# The cosign build fleet verifies releases with (ADR-0100).
#
# One file, three readers: internal/release embeds it (fleet update), and
# scripts/lib/release.sh (bootstrap, and the first artifact update on a box
# whose installed fleet predates `fleet release`) and .github/workflows/release.yml
# (the signer) read it from the checkout. So the signer and every verifier run
# the same cosign, and the bytes are pinned by digest, not by a tag on GitHub.
#
# Digests are cosign's own published checksums (cosign_checksums.txt of the
# release), whose keyless signature was checked against Sigstore's release
# identity before they were copied here. To bump: replace all three lines from
# a newer release's cosign_checksums.txt after verifying it the same way.
