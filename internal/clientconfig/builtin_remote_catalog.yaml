# Fleet's built-in directory of HOSTED third-party MCP servers.
#
# Every client bundle inherits this list by default (it is a LISTING, not a
# connection: fleet never contacts a URL here until a user explicitly adds the
# server through Settings -> Connections and completes the per-user OAuth
# flow, #443). A bundle overrides an entry by redefining its name in its own
# remote_mcp_catalog:, hides one via remote_mcp_catalog_hidden:, opts out
# entirely with remote_mcp_catalog_builtin: false, and opts INTO the
# community-provenance tier with remote_mcp_catalog_community: true.
#
# Curation rules (enforced by internal/clientconfig tests):
#   - url is the vendor's officially documented hosted MCP endpoint, https
#     only, verified against docs_url before shipping;
#   - provenance is explicit on every entry: official (the service's own
#     vendor operates the endpoint), third_party (an identifiable company
#     hosts access to OTHER vendors' services -- it sees the traffic and often
#     holds delegated tokens), community (an identifiable maintainer, neither
#     of the above). Never list an endpoint that cannot be attributed to a
#     named operator; prefer a repo_url so users can vet the code.
#   - category groups the directory UI; auth hints what connecting takes
#     (oauth | api_key | open | tenant -- tenant means the URL carries a
#     {placeholder} the user must fill from their own org/workspace).
#
# A static shipped catalog rots: endpoints move, vendors sunset betas. The
# per-entry docs_url is the source of truth; operators can hide a dead entry
# with remote_mcp_catalog_hidden in a config-only change between releases.


servers:

