# Elcano frontend standard (scripts/stack-check.sh). fleet is Tier B: a
# React + Vite single-page app (web/) compiled into the fleet binary and served
# by Go (internal/webui builds index.html per request). See AGENTS.md.
# web/tools/openapi-typescript is a build-time-only workspace of web/ (one
# lockfile, devDependencies only): the OpenAPI → TypeScript generator, kept
# apart because it drives the TypeScript 5 compiler API (ADR-0109).
tier=B
web=web/src web/public internal/webui
npm=web web/tools/openapi-typescript
backend=go
