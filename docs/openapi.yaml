  /upload:
    post:
      summary: Upload a file for a task's workspace.
      description: >-
        Authenticated in-handler — accepts an admin key, a scoped API key
        carrying create_task permission (#719: an uploaded file is only usable
        via a subsequent task create, so the same keys that may create tasks may
        stage uploads; a valid readonly/webhook key gets a definitive 403), a
        user bearer token, or the Elcano cookie.
      security: [{ adminApiKey: [] }, { scopedApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        "200": { description: Uploaded }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /files/{filename}:
    parameters:
      - name: filename
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Download a previously-uploaded file (admin-only; the worker-node download path was removed in #459).
      security: [{ adminApiKey: [] }]
      responses:
        "200": { description: The file bytes }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /triggers/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Fire a webhook-triggered task run.
      description: >-
        Spawns a one-shot run cloned from the trigger's template task, with the
        rendered prompt_template as the prompt. Authenticated SOLELY by the
        per-trigger HMAC-SHA256 secret over the raw body (GitHub-compatible
        X-Hub-Signature-256, or X-Fleet-Signature-256) — NOT the admin API key.
        Unknown slug and bad signature both return 401 (indistinguishable, with
        equalized HMAC work) to prevent slug enumeration. A leaked secret lets a
        caller inject the spawned run's prompt under the template's seat
        (network/MCP/files); the sandbox remains the execution boundary. Rotate
        with `fleet sched trigger rotate`.
      security: []
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        "202":
          description: Accepted — a run was enqueued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id: { type: string, format: uuid }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /triggers/email/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Fire an email-ingress trigger (#511).
      description: >-
        An email provider's inbound-parse webhook posts a normalized email
        payload to spawn a governed run cloned from the trigger's template task.
        Authenticated by the per-trigger HMAC-SHA256 secret over the raw body
        (X-Hub-Signature-256 or X-Fleet-Signature-256) — NOT the admin API key.
        An unknown slug, a webhook-kind slug, or a bad signature all return an
        identical timing-equalized 401 (no slug/kind enumeration). After auth the
        email-kind policy is enforced (approved senders → 403; required DKIM/SPF →
        403; attachment count/size caps → 413) and the Message-ID is deduped (a
        duplicate delivery returns 200 with status=duplicate and spawns no run).
        The spawned run inherits the template's write-capable MCP connectors ONLY
        when the template task set allow_event_triggers=true; otherwise it runs
        with native tools only. The run is recorded against the inbound event, and
        on success a reply is sent to the sender when SMTP is configured.
      security: []
      requestBody:
        description: >-
          A normalized inbound email: { message_id, from, to, subject, text,
          html, spf, dkim, attachments:[{filename,size,content_type}] }.
        content:
          application/json:
            schema: { type: object }
      responses:
        "202":
          description: Accepted — a run was enqueued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id: { type: string, format: uuid }
        "200":
          description: Duplicate delivery — already processed, no new run.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: duplicate }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }

  /auth/login:
    post:
      summary: Username/password login → user token.
      security: []
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401": { $ref: "#/components/responses/Error" }
  /auth/elcano-login:
    get:
      summary: Begin/complete Elcano unified login (sets the elcano_auth cookie).
      security: []
      responses:
        "303": { description: Redirect (See Other) after setting the auth cookie. }
  /auth/logout:
    post:
      summary: Clear the Elcano auth cookie.
      security: []
      responses:
        "303": { description: Redirect (See Other) after clearing the cookie. }
