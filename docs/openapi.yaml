openapi: 3.1.0
info:
  title: fleet orchestrator API
  version: "1.0.0"
  description: |
    HTTP API for the fleet **orchestrator** (the scheduling engine):
    scheduled-task lifecycle, API-key administration, the notes wiki, run logs,
    dashboard stats, and auth.

    This document is generated by hand but **kept honest by a CI test**:
    `cmd/fleet/openapi_drift_test.go` walks the real chi router
    (`buildOrchestratorMux`) and fails the build if the set of
    `{method, path}` here ever drifts from the shipped routes, and if any
    operation references a security scheme not defined below.

    A second gate (`TestOpenAPISchemaDrift`) statically cross-checks the reusable
    `components.schemas.*` against their backing Go models via reflection: every
    documented property must exist as a json field on the model, every `required:`
    field must exist and not be `omitempty`, and scalar types must agree. It does
    NOT verify status codes, runtime population, or inline (anonymous, non-`$ref`)
    operation bodies — those remain documentary. Undocumented model fields are
    surfaced as test warnings, not failures. See the test's block comment for the
    exact scope and its limits.

    The interactive chat HTTP/SSE API (`internal/httpapi`) is a separate surface
    and is not described here.

servers:
  - url: /v1
    description: >-
      The versioned orchestrator API (#321) — the stability-guaranteed surface
      for external consumers. Every response carries an X-Fleet-API-Version
      header. Prefer this base; path keys below are relative to it.
  - url: /
    description: >-
      Legacy unversioned paths, served by the SAME handlers for backward
      compatibility. Responses carry Deprecation + Link (successor-version)
      headers; migrate to the /v1 base. (The version prefix is applied by a
      wrapper, so both bases resolve to the identical routes.)

components:
  headers:
    XFleetApiVersion:
      description: >-
        The HTTP API major version (#321). Present on every /v1 response;
        increments only on a breaking API change (independent of the fleet
        binary semver). Clients may assert it to confirm compatibility.
      schema: { type: string, example: "1" }
  securitySchemes:
    adminApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: >-
        The bootstrap ADMIN_API_KEY or a typed admin API key
        (fleet_admin_…, #1081). Full access; other key types are rejected
        on admin-only routes.
    scopedApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: A non-admin API key; access limited to its permission set.
    bearerToken:
      type: http
      scheme: bearer
      description: "A user token from the username/password login path (Authorization: Bearer)."
    elcanoAuthCookie:
      type: apiKey
      in: cookie
      name: elcano_auth
      description: The Elcano unified-auth Ed25519-signed identity cookie (scoped-user tier).

  schemas:
    PromptLibraryWrite:
      type: object
      required: [name, content, visibility]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 1024 }
        content: { type: string, minLength: 1, maxLength: 262144 }
        visibility: { type: string, enum: [private, workspace] }
    PromptLibraryItem:
      allOf:
        - { $ref: "#/components/schemas/PromptLibraryWrite" }
        - type: object
          required: [id, source, read_only, owned_by_caller]
          properties:
            id: { type: string }
            source: { type: string, enum: [git, workspace] }
            read_only: { type: boolean }
            owned_by_caller: { type: boolean }
            owner_username: { type: string }
            path: { type: string }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    TaskFeedback:
      type: object
      properties:
        id: { type: string, format: uuid }
        task_id: { type: string, format: uuid }
        rating: { type: string, enum: [up, down] }
        critique: { type: string }
        consumed: { type: boolean }
        created_at: { type: integer }
        created_by: { type: string }
    TaskLearnedInstruction:
      type: object
      properties:
        id: { type: string, format: uuid }
        task_id: { type: string, format: uuid }
        version: { type: integer }
        content: { type: string }
        status: { type: string, enum: [proposed, active, archived] }
        signal_count: { type: integer }
        created_at: { type: integer }
        activated_at: { type: integer }
        activated_by: { type: string }
    DatasetColumn:
      type: object
      properties:
        name: { type: string }
        type: { type: string, enum: [text, number, boolean] }
        output: { type: boolean }
        description: { type: string }
    Dataset:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        goal: { type: string }
        columns:
          type: array
          items: { $ref: "#/components/schemas/DatasetColumn" }
        model: { type: string }
        persona: { type: string }
        status: { type: string, enum: [idle, running, paused] }
        concurrency: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        row_counts:
          type: object
          additionalProperties: { type: integer }
    DatasetRow:
      type: object
      properties:
        id: { type: string, format: uuid }
        dataset_id: { type: string, format: uuid }
        row_index: { type: integer }
        cells: {}
        status: { type: string, enum: [pending, running, proposed, approved, failed] }
        proposed: {}
        result_note: { type: string }
        error: { type: string }
        attempts: { type: integer }
        cost_usd: { type: number }
        updated_at: { type: string, format: date-time }
    ErrorResponse:
      type: object
      properties:
        detail: { type: string, description: "Human-readable error message (the handler's writeError body)." }
    HealthResponse:
      type: object
      properties:
        status: { type: string, example: ok }
    MCPChoice:
      type: object
      properties:
        server: { type: string }
        account: { type: string }
      required: [server]
    MCPSelection:
      type: array
      items: { $ref: "#/components/schemas/MCPChoice" }
    CostRange:
      type: object
      properties:
        min: { type: number }
        max: { type: number }
    ModelPrice:
      type: object
      properties:
        input_per_m: { type: number, description: "USD per 1M input (prompt) tokens" }
        output_per_m: { type: number, description: "USD per 1M output (completion) tokens" }
    CostForecast:
      type: object
      description: >
        Pre-submission cost forecast for a scheduled task (#233). All cost fields
        are null when the model's pricing is unknown; the token estimates are
        still populated. Advisory only — the forecast never gates task creation.
      properties:
        model: { type: string }
        estimated_prompt_tokens: { type: integer }
        system_prompt_tokens: { type: integer }
        tool_definitions_tokens: { type: integer }
        avg_output_tokens: { type: integer }
        max_iterations: { type: integer }
        pricing_known: { type: boolean }
        per_iteration_cost_usd: { type: number, nullable: true }
        estimated_total_cost_usd: { type: number, nullable: true }
        estimated_total_cost_range: { allOf: [{ $ref: "#/components/schemas/CostRange" }], nullable: true }
        max_cost_ceiling_usd: { type: number }
        would_hit_ceiling: { type: boolean }
        price: { allOf: [{ $ref: "#/components/schemas/ModelPrice" }], nullable: true }
        note: { type: string }
    TaskCreate:
      type: object
      properties:
        prompt: { type: string }
        name: { type: string, description: "Optional, human-readable label; the identity key for the definition import/export endpoints (#238). A non-empty name must be unique across tasks. Never injected into the agent prompt." }
        title: { type: string, description: "Optional short display label shown wherever the task is listed. Unlike name it is NOT unique and IS carried onto every occurrence, re-run and clone, so all the runs of one job share it. Single line, max 120 characters. Never injected into the agent prompt." }
        model: { type: string }
        fallback_model: { type: string }
        max_iterations: { type: integer }
        mcp_selection: { $ref: "#/components/schemas/MCPSelection" }
        credential_allowlist:
          type: array
          description: >-
            Per-task least-privilege credential scoping (#184): which
            (server, account) MCP pairs this task may call. Omitted/null
            inherits the global credential policy; an explicit list narrows it.
            Every entry must name a server; account is optional (empty = the
            default/shared seat).
          items:
            type: object
            properties:
              server: { type: string }
              account: { type: string }
            required: [server]
        persona: { type: string, description: "Per-task persona override (#221): a bundle persona name (personas/<name>.yaml, named without the extension). Empty = the global default persona. An unknown name is rejected with 400 at create time listing the bundle's valid personas (#720); a task whose persona later disappears from the bundle still dispatches on the global default." }
        tags: { type: array, items: { type: string }, description: "User-defined labels for organizing/filtering tasks (#212): lowercase alphanumeric plus '-'/'.', ≤64 chars each, ≤20 per task (normalized at create)." }
        timezone: { type: string, description: "IANA timezone name (e.g. America/New_York) recurrence is evaluated in. Empty falls back to the server default (then UTC) at create time; the stored scheduled_for instant is always UTC." }
        description: { type: string, description: "Optional operator documentation (Markdown: why the task exists, runbook, owner). Never injected into agent prompts; capped at 10000 characters." }
        max_retries: { type: integer, description: "ADDITIONAL whole-task attempts after the first when a run fails with a retryable class (0 = no retries, the default)." }
        retry_policy:
          type: object
          description: >-
            Optional whole-task retry classification/backoff. Structured-output
            failures are non-retryable by default; explicitly opt in with
            retry_on values structured_output_format and/or
            structured_output_persistence, with the usual whole-task
            side-effect caveat.
          properties:
            backoff: { type: string, enum: [exponential, fixed], default: exponential }
            initial_delay_seconds: { type: integer, minimum: 0, default: 30 }
            max_delay_seconds: { type: integer, minimum: 0, default: 600 }
            retry_on:
              type: array
              items: { type: string, enum: [transient, cost_ceiling, context_budget, structured_output_format, structured_output_persistence, terminal] }
            no_retry_on:
              type: array
              items: { type: string, enum: [transient, cost_ceiling, context_budget, structured_output_format, structured_output_persistence, terminal] }
        output_schema:
          type: object
          additionalProperties: true
          description: >-
            Required terminal machine-output contract. Must be a self-contained
            JSON Schema object no larger than 65,536 encoded bytes, 32 nesting
            levels, or 2,048 JSON nodes. A structured task reaches success only
            when schema-valid output_json is committed atomically with success.
        carry_context: { type: boolean, default: false, description: "Recurring runs carry a bounded handoff from the prior run (#504). Default false = each run starts fresh." }
        priority: { type: integer }
        instruction_self_improve: { type: boolean, default: false, description: "Captain's Log: give this scheduled task persistent memory across runs (the remember/recall tools + run-start injection, stored in fleet's DB and scoped to this task). Default false = each run starts fresh. Never touches the operator-owned config bundle." }
        allow_network: { type: boolean, default: false, description: "Allow this scheduled task's execution sandbox outbound network egress. Default false seals it with --network=none, matching the interactive lockdown path." }
        allow_task_creation: { type: boolean, default: false, description: "Grant this task's SCHEDULED runs the built-in create_task tool so they can enqueue follow-up tasks. Default false: the tool is never registered, so interactive/unprivileged runs cannot self-schedule (no privilege escalation)." }
        allow_recurring_task_creation: { type: boolean, default: false, description: "Stricter, separately-toggled grant that additionally lets create_task set a cron recurrence on a spawned task. Meaningless without allow_task_creation; default false." }
        scheduled_for: { type: string, format: date-time }
        recurrence: { type: string, description: "5-field cron expression" }
        files: { type: array, items: { type: string } }
        file_names: { type: array, items: { type: string }, description: "Optional logical names paired 1:1 with files. Inputs are materialized under these prompt-visible basenames in the dedicated connector workspace." }
        serialization_key: { type: string, description: "Opaque mutual-exclusion token (#709). Fleet guarantees at most one task per key is ACTIVE (leased/running) at a time: a queued task whose key matches an active task is skipped at claim time — it stays queued and is retried on a later pass, never failed. Fleet never interprets the key's contents; its meaning is owned by the intake caller (e.g. \"client:<id>\"). Recurring occurrences inherit the key, so successive runs stay mutually exclusive with same-key tasks. Absent/empty/whitespace-only = unserialized (the default, and the behavior of every pre-existing task). Immutable after creation." }
      required: [prompt]
    Task:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: "Import/export identity key (#238); unique across tasks when non-empty. Cleared on every copy (recurrence occurrence, re-run, clone)." }
        title: { type: string, description: "Optional short display label shown wherever the task is listed. Unlike name it is NOT unique and IS carried onto every occurrence, re-run and clone, so all the runs of one job share it. Single line, max 120 characters. Never injected into the agent prompt." }
        prompt: { type: string }
        model: { type: string }
        fallback_model: { type: string }
        max_iterations: { type: integer }
        mcp_selection: { $ref: "#/components/schemas/MCPSelection" }
        priority: { type: integer }
        allow_network: { type: boolean, description: "Whether this task's execution sandbox is allowed outbound network egress (default false = sealed)." }
        status: { type: string, enum: [scheduled, pending, running, completed, failed, cancelled] }
        created_at: { type: string, format: date-time }
        scheduled_for: { type: string, format: date-time }
        recurrence: { type: string }
        result: { type: string }
        output_schema: { type: object, additionalProperties: true, description: "Declared terminal JSON Schema contract, when structured-output mode is enabled." }
        output_json: { nullable: true, description: "Locally schema-validated result. Non-null on every successful task that declares output_schema." }
        error_message: { type: string }
        files: { type: array, items: { type: string } }
        file_names: { type: array, items: { type: string } }
        serialization_key: { type: string, description: "Opaque mutual-exclusion token: at most one task per key is active at a time. Absent = unserialized. See TaskCreate.serialization_key." }
        created_by: { type: string, format: uuid }
        workspace_path: { type: string, description: "Host filesystem path of the per-run workspace directory the agent wrote into (#287). Present once the run begins; absent for tasks that never ran." }
        allow_task_creation: { type: boolean, description: "Whether this task's scheduled runs may enqueue follow-up tasks via create_task (default false)." }
        allow_recurring_task_creation: { type: boolean, description: "Whether create_task may set a cron recurrence on a task this one spawns (default false)." }
        created_by_task_id: { type: string, format: uuid, description: "The task whose scheduled run spawned this one via create_task. Set server-side for lineage/audit; null for tasks not spawned by a task." }
      required: [id, prompt, status]
    WorkspaceEntry:
      type: object
      properties:
        name: { type: string, description: "Slash-joined path relative to the workspace root; directories carry a trailing slash." }
        size_bytes: { type: integer, format: int64 }
        modified_at: { type: string, format: date-time }
        is_dir: { type: boolean }
      required: [name, size_bytes, modified_at, is_dir]
    WorkspaceListing:
      type: object
      properties:
        files: { type: array, items: { $ref: "#/components/schemas/WorkspaceEntry" } }
        workspace_path: { type: string, description: "The resolved workspace root the listing is rooted at." }
        truncated: { type: boolean, description: "True when the listing was capped (very large workspace)." }
      required: [files, workspace_path]
    APIKeyCreate:
      type: object
      properties:
        name: { type: string }
        role: { type: string, enum: [admin, client, readonly] }
        permissions:
          type: array
          items: { type: string, enum: [create_task, view_tasks, cancel_task, view_logs, view_all_logs, manage_keys, admin] }
          description: >-
            Explicit permission set for the legacy (role-based) path, for grants
            no role expresses — chiefly view_all_logs, the fleet-wide transcript
            read. Rejected with 400 when combined with role or type (a typed key
            derives its permissions from its type), or when it names an unknown
            permission.
        rate_limit: { type: integer }
        expires_in_days: { type: integer }
        description: { type: string }
        max_cost_per_day_usd:
          type: number
          deprecated: true
          description: >-
            RETIRED. Sending this (or max_cost_per_month_usd) is rejected with
            400 — the per-key accumulator that would have enforced it never
            existed. Use a rolling budget instead:
            POST /admin/budgets {"scope":"key","principal_id":"<key_id>","window":"day","hard_usd":…}.
        max_cost_per_month_usd:
          type: number
          deprecated: true
          description: 'RETIRED — see max_cost_per_day_usd. Use POST /admin/budgets with window "month".'
      required: [name]
    APIKeyCreated:
      type: object
      description: "The created key's metadata (the embedded APIKeyResponse) plus the one-time plaintext api_key."
      properties:
        api_key: { type: string, description: "The plaintext key — shown ONCE at creation." }
        key_id: { type: string }
        name: { type: string }
        key_prefix: { type: string }
        permissions: { type: array, items: { type: string } }
        rate_limit: { type: integer }
        created_at: { type: string, format: date-time }
        enabled: { type: boolean }
        description: { type: string }
    UserCreate:
      type: object
      properties:
        username: { type: string }
        password: { type: string }
        role: { type: string, enum: [admin, client, readonly] }
      required: [username, password]
    UserResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        role: { type: string }
    CurrentUserResponse:
      type: object
      description: >-
        The GET /api/me probe body. `username` and `role` are present only when
        the credential resolves to a user record (bearer token or Elcano
        cookie); an API-key credential yields just `authenticated: true`.
      properties:
        authenticated: { type: boolean }
        username: { type: string }
        role: { type: string }
      required: [authenticated]
    LoginRequest:
      type: object
      properties:
        username: { type: string }
        password: { type: string }
      required: [username, password]
    LoginResponse:
      type: object
      properties:
        token: { type: string }
        user: { $ref: "#/components/schemas/UserResponse" }
    DashboardStats:
      type: object
      properties:
        pending_tasks: { type: integer }
        running_tasks: { type: integer }
        completed_tasks_today: { type: integer }
        failed_tasks_today: { type: integer }
    LogSession:
      type: object
      description: A captain's-log session (the recorded transcript of one task run).
    SLAReport:
      type: object
      description: >-
        The GET /sla-report response (#274): per-bucket SLA actuals over a
        window. The bucket key is the task's prompt (fleet has no separate
        `name` column).
      properties:
        period: { type: string, description: "Human label, e.g. last_7_days." }
        window_days: { type: integer, description: "Numeric window bound (1–90)." }
        tasks:
          type: array
          items: { $ref: "#/components/schemas/SLAReportTask" }
      required: [period, window_days, tasks]
    SLAReportTask:
      type: object
      description: One row of the SLA report (#274).
      properties:
        task_name: { type: string }
        expected_minutes: { type: integer }
        p50_actual_minutes: { type: number }
        p95_actual_minutes: { type: number }
        breach_rate_pct: { type: number }
        sample_count: { type: integer }
      required: [task_name, expected_minutes, p50_actual_minutes, p95_actual_minutes, breach_rate_pct, sample_count]

    UsageReport:
      type: object
      description: >-
        The GET /admin/usage response (#601 part 1): cost + token totals over
        [from, to) grouped by group_by, sourced from the already-persisted
        metering (task_iterations ⋈ tasks in the sched DB, plus the chat
        turn_metrics log). `sources` lists which meters contributed ("tasks"
        always; "chat" when the chat store is wired). `note` carries the
        honest-scope caveat: dollar figures cover only runs with model pricing
        available (#289) — token totals are complete regardless.
      properties:
        group_by: { type: string, enum: [user, key, project, model, day, week] }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        buckets:
          type: array
          items: { $ref: "#/components/schemas/UsageBucket" }
        totals: { $ref: "#/components/schemas/UsageBucket" }
        sources:
          type: array
          items: { type: string }
        note: { type: string }
      required: [group_by, from, to, buckets, totals, sources, note]
    UsageBucket:
      type: object
      description: >-
        One aggregated usage row (#601 part 1). `key` is the grouping value
        (user email/username, API key id, project id, model slug, or the
        YYYY-MM-DD bucket start for day/week); the empty key collects rows
        without that dimension (tasks have no project; chat turns have no API
        key). Per-source splits (task_* / chat_*) are kept alongside the
        combined totals; cached_tokens is chat-only (task iterations do not
        persist a cached-token count).
      properties:
        key: { type: string }
        label: { type: string, description: "Human-friendly name when one exists (project name)." }
        cost_usd: { type: number }
        prompt_tokens: { type: integer }
        completion_tokens: { type: integer }
        cached_tokens: { type: integer }
        task_cost_usd: { type: number }
        chat_cost_usd: { type: number }
        task_iterations: { type: integer }
        chat_turns: { type: integer }
      required: [key, cost_usd, prompt_tokens, completion_tokens, cached_tokens, task_cost_usd, chat_cost_usd, task_iterations, chat_turns]
    AdoptionReport:
      type: object
      description: >-
        The GET /admin/usage/adoption response: the per-user AI-adoption read
        model behind the Operations Center's exec Adoption view. Aggregates
        the same persisted metering as /admin/usage on (user, UTC day) at
        once: per-user merged totals with a daily token series aligned to
        `days`, equal-length previous-window comparators (`prev_from` marks
        that window's start), a daily activity trend, and the
        provisioned-account roster ("who hasn't adopted yet"). `sources`
        lists the meters that contributed ("tasks" always; "chat" and
        "accounts" when their seams are wired). `note` carries the
        honest-scope caveats (pricing coverage #289; token volume is an
        adoption signal, not a performance grade).
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        prev_from: { type: string, format: date-time }
        days:
          type: array
          items: { type: string }
        users:
          type: array
          items: { $ref: "#/components/schemas/AdoptionUser" }
        inactive_users:
          type: array
          items: { $ref: "#/components/schemas/AdoptionSeat" }
        daily:
          type: array
          items: { $ref: "#/components/schemas/AdoptionDay" }
        totals: { $ref: "#/components/schemas/AdoptionTotals" }
        sources:
          type: array
          items: { type: string }
        note: { type: string }
      required: [from, to, prev_from, days, users, inactive_users, daily, totals, sources, note]
    AdoptionUser:
      type: object
      description: >-
        One user's adoption-report row: merged task+chat spend and activity
        over the window, previous-window comparators, and `daily_tokens`
        (prompt+completion per day, index-aligned to the report's `days`).
        The empty `user` collects unattributed spend (deleted-user task rows)
        — listed so no spend disappears, never counted as an active user.
      properties:
        user: { type: string }
        cost_usd: { type: number }
        task_cost_usd: { type: number }
        chat_cost_usd: { type: number }
        prompt_tokens: { type: integer }
        completion_tokens: { type: integer }
        cached_tokens: { type: integer }
        task_iterations: { type: integer }
        chat_turns: { type: integer }
        active_days: { type: integer }
        last_active: { type: string, description: "Latest active UTC day (YYYY-MM-DD); omitted when never active in the window." }
        prev_cost_usd: { type: number }
        prev_tokens: { type: integer }
        daily_tokens:
          type: array
          items: { type: integer }
      required: [user, cost_usd, task_cost_usd, chat_cost_usd, prompt_tokens, completion_tokens, cached_tokens, task_iterations, chat_turns, active_days, prev_cost_usd, prev_tokens, daily_tokens]
    AdoptionSeat:
      type: object
      description: >-
        One provisioned chat account in the adoption roster. Seats with no
        metered activity in the window are listed under `inactive_users`.
      properties:
        email: { type: string }
        created_at: { type: string, format: date-time }
      required: [email, created_at]
    AdoptionDay:
      type: object
      description: >-
        One day of the adoption trend: merged cost, prompt+completion tokens,
        work units (task iterations + chat turns), and distinct active users.
      properties:
        day: { type: string }
        cost_usd: { type: number }
        tokens: { type: integer }
        actions: { type: integer }
        active_users: { type: integer }
      required: [day, cost_usd, tokens, actions, active_users]
    AdoptionTotals:
      type: object
      description: >-
        The adoption report's roll-up. `registered_users` is 0 when the
        accounts roster isn't wired — check `sources` for "accounts" to tell
        that apart from an empty roster.
      properties:
        active_users: { type: integer }
        prev_active_users: { type: integer }
        new_active_users: { type: integer }
        registered_users: { type: integer }
        cost_usd: { type: number }
        prev_cost_usd: { type: number }
        tokens: { type: integer }
        prev_tokens: { type: integer }
        cached_tokens: { type: integer }
        chat_turns: { type: integer }
        task_iterations: { type: integer }
      required: [active_users, prev_active_users, new_active_users, registered_users, cost_usd, prev_cost_usd, tokens, prev_tokens, cached_tokens, chat_turns, task_iterations]
    BudgetCreate:
      type: object
      description: >-
        POST /admin/budgets body (#601 part 2): create or replace the rolling
        budget for one (scope, principal_id, window). scope=user is keyed by
        the sched username (an email on a standard deployment), scope=key by
        the scoped API key id. Any other scope (including the legacy
        project) is rejected: tasks carry no project dimension, so such a
        budget could never be enforced.
        Bounds are optional individually but at least one must be set, soft
        must not exceed hard per measure, and budgets bound TOKENS as well as
        dollars because dollar coverage depends on pricing configuration
        (#289). An upsert resets the once-per-window soft-alert marker.
      properties:
        scope: { type: string, enum: [user, key] }
        principal_id: { type: string }
        window: { type: string, enum: [day, week, month], description: "UTC calendar window (weeks start Monday 00:00 UTC)." }
        soft_usd: { type: number, description: "Dollar spend that fires the once-per-window notify alert." }
        hard_usd: { type: number, description: "Dollar spend at which new task creation is refused (402)." }
        soft_tokens: { type: integer, description: "Token (prompt+completion) spend that fires the alert." }
        hard_tokens: { type: integer, description: "Token spend at which new task creation is refused (402)." }
      required: [scope, principal_id, window]
    Budget:
      type: object
      description: >-
        One persisted per-principal rolling budget (#601 part 2). Holds only
        configuration plus the soft-alert dedup marker — spend is recomputed
        from the persisted metering (the part-1 usage read model) at each
        check, never accumulated here.
      properties:
        id: { type: string, format: uuid }
        scope: { type: string, enum: [user, key, project] }
        principal_id: { type: string }
        window: { type: string, enum: [day, week, month] }
        soft_usd: { type: number }
        hard_usd: { type: number }
        soft_tokens: { type: integer }
        hard_tokens: { type: integer }
        soft_alert_window_start: { type: string, format: date-time, description: "UTC start of the window the one soft alert fired for (dedup marker)." }
        soft_alert_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, scope, principal_id, window, created_at, updated_at]
    BudgetStatus:
      type: object
      description: >-
        One GET /admin/budgets row (#601 part 2): the configured budget plus
        its live evaluation — current window [start, end), spend recomputed
        from the persisted metering, the EFFECTIVE hard bounds after the
        fail-safe clamp against the live global ceilings (#286; a budget can
        only narrow FLEET_MAX_COST_USD / FLEET_MAX_TOTAL_TOKENS, never exceed
        them), and whether this window's soft alert has fired.
      properties:
        id: { type: string, format: uuid }
        scope: { type: string, enum: [user, key, project] }
        principal_id: { type: string }
        window: { type: string, enum: [day, week, month] }
        soft_usd: { type: number }
        hard_usd: { type: number }
        soft_tokens: { type: integer }
        hard_tokens: { type: integer }
        soft_alert_window_start: { type: string, format: date-time }
        soft_alert_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        window_start: { type: string, format: date-time }
        window_end: { type: string, format: date-time }
        spend_usd: { type: number }
        spend_tokens: { type: integer }
        effective_hard_usd: { type: number }
        effective_hard_tokens: { type: integer }
        soft_alerted: { type: boolean }
      required: [id, scope, principal_id, window, created_at, updated_at, window_start, window_end, spend_usd, spend_tokens, soft_alerted]

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

paths:
  /health:
    get:
      summary: Liveness check.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
  /api-info:
    get:
      summary: API version discovery (#321).
      description: >-
        Machine-readable version metadata so a client can assert compatibility
        at startup: the API major version (which changes only on a breaking
        change — see docs/api-versioning.md), the fleet binary version, and the
        supported/deprecated version lists. Unauthenticated (same posture as
        /health); reachable at both /api-info and /v1/api-info.
      security: []
      responses:
        "200":
          description: Version metadata.
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_version: { type: string }
                  fleet_version: { type: string }
                  supported_versions: { type: array, items: { type: string } }
                  deprecated_versions: { type: array, items: { type: string } }
                  schema_url: { type: string }
  /metrics:
    get:
      summary: Prometheus metrics (text exposition format). Admin-API-key gated.
      security: [{ adminApiKey: [] }]
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema: { type: string }
  /api/config:
    get:
      summary: Public dashboard config (version, server clock, task-scheduling default zone).
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string }
                  timezone:
                    type: string
                    description: "IANA name of the server clock (FLEET_TIMEZONE)."
                  server_time:
                    type: string
                    format: date-time
                    description: >-
                      The orchestrator's current time, formatted in its own
                      configured location so the UTC offset travels with it. A
                      client computes its clock skew from this once and ticks
                      locally, so a wrong browser clock cannot make the
                      dashboard display a confident lie about server time.
                  default_task_timezone:
                    type: string
                    description: >-
                      IANA zone a scheduled task gets when its create request
                      names none (FLEET_DEFAULT_TIMEZONE). Distinct from
                      timezone — this is the zone a cron recurrence fires in.

  /.well-known/agent-card.json:
    get:
      summary: A2A Agent Card — the protocol's discovery document (#1279).
      description: >-
        Public by construction (it names capabilities and the JSON-RPC endpoint
        URL, nothing else; no secrets, no per-deployment identity beyond the
        operator's branding bundle). Spec-fixed well-known path, unversioned
        forever (never Deprecation-tagged on the bare path). Served with an
        ETag + Cache-Control per A2A spec §8.6. Answers 501 until the operator
        sets FLEET_A2A_ENABLED. See docs/A2A.md; spec pin
        internal/a2a.SpecVersion.
      security: []
      responses:
        "200":
          description: The Agent Card.
          content:
            application/json:
              schema: { type: object }
        "304":
          description: Not modified (If-None-Match hit the card's ETag).
        "501":
          description: The A2A server is not enabled on this deployment.

  /a2a:
    post:
      summary: A2A JSON-RPC 2.0 endpoint — every A2A method over one route (#1279).
      description: >-
        The A2A protocol's JSON-RPC binding (spec v1.0.1, JSON-RPC + SSE only):
        SendMessage / SendStreamingMessage / GetTask / ListTasks / CancelTask /
        SubscribeToTask multiplex over this POST; streaming methods respond
        with text/event-stream where each data: line is a complete JSON-RPC
        envelope. Authentication is per JSON-RPC method inside the dispatcher
        and accepts ONLY the credential the Agent Card declares — X-API-Key
        (typed fleet keys or the admin key); JSON-RPC-layer errors ride HTTP
        200 with the envelope's error member (A2A codes -32001..-32009, each
        carrying a google.rpc.ErrorInfo detail). SendMessage runs the same
        governed create pipeline as POST /tasks; reads are creator-scoped
        (ADR-0043), and an invisible task answers TaskNotFound rather than 403
        (A2A §3.3.2). Requires the A2A-Version: "1.0" header. Answers 501
        until FLEET_A2A_ENABLED is set. See docs/A2A.md.
      security: [{ scopedApiKey: [] }, { adminApiKey: [] }]
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: >-
            A JSON-RPC 2.0 response envelope (result or error) — or, for the
            streaming methods, a text/event-stream of envelopes that closes
            when the task reaches a terminal state.
          content:
            application/json:
              schema: { type: object }
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "501":
          description: The A2A server is not enabled on this deployment.

  /a2a/:
    post:
      summary: Trailing-slash twin of POST /a2a (#1279 TCK finding).
      description: >-
        Identical to POST /a2a. Exists because A2A clients built on httpx
        (the official TCK included) resolve the Agent Card's interface URL as
        a base and POST to "<url>/", which chi's exact matching otherwise
        404s. Same handler, same auth, same rate limiter.
      security: [{ scopedApiKey: [] }, { adminApiKey: [] }]
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: A JSON-RPC 2.0 response envelope, as on POST /a2a.
          content:
            application/json:
              schema: { type: object }
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "501":
          description: The A2A server is not enabled on this deployment.

  /tasks:
    get:
      summary: >-
        List tasks. Visibility is own-rows for principals without a fleet-wide
        grant (#1082): a non-admin user or scoped API key lists only tasks it
        created; the admin key, PermissionAdmin carriers, and view_all_logs
        holders list every task. The same scope applies to the single-task
        reads, export, and the upcoming projection.
      security: [{ adminApiKey: [] }, { scopedApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Task" } }
    post:
      summary: Create (schedule) a task.
      description: Authenticated in-handler — accepts an admin key, a scoped key, a user bearer token, or the Elcano cookie.
      security: [{ adminApiKey: [] }, { scopedApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskCreate" }
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /tasks/batch:
    post:
      summary: Create multiple tasks in a single call.
      description: >
        Accepts a slice of TaskCreate recipes (up to 100) and creates them in one
        API call. When atomic=true the whole batch is validated up front and
        inserted in a single transaction — any failure rolls back all (422 with
        per-task errors). When atomic=false (default) valid tasks are created
        while invalid ones are skipped, yielding 207 Multi-Status with per-task
        created/failed results. Same auth + rate limiter as POST /tasks; the
        scoped API key's hourly cap is charged N tokens for a batch of N tasks
        (one by the auth check, N-1 by the handler) so the batch path is never a
        rate-limit bypass.
      security: [{ adminApiKey: [] }, { scopedApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [tasks]
              properties:
                atomic:
                  type: boolean
                  default: false
                tasks:
                  type: array
                  maxItems: 100
                  items: { $ref: "#/components/schemas/TaskCreate" }
      responses:
        "200":
          description: All tasks created (atomic or non-atomic with no failures).
          content:
            application/json:
              schema:
                type: object
                properties:
                  created:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        index: { type: integer }
                  failed:
                    type: array
                    items: { type: object }
                  count: { type: integer }
        "207":
          description: Partial success (non-atomic only); some tasks were skipped.
        "413":
          description: Batch size exceeds the 100-task limit.
        "422":
          description: Atomic rollback or every task failed validation.
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /tasks/estimate:
    post:
      summary: Pre-submission cost forecast for a task.
      description: >
        Same request body as POST /tasks, but returns a token + cost forecast
        and creates nothing. Pure local computation (no model call). Returns 200
        with cost fields populated for a model whose pricing is known, or 202
        with null cost fields and an explanatory note when the model's pricing is
        unknown. Same authentication and rate limiter as POST /tasks.
      security: [{ adminApiKey: [] }, { scopedApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskCreate" }
      responses:
        "200":
          description: Forecast (model pricing known)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CostForecast" }
        "202":
          description: Forecast with null cost fields (model pricing unknown)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CostForecast" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /tasks/tags:
    get:
      summary: List the distinct task tags in use with per-tag task counts (busiest first).
      security: [{ adminApiKey: [] }, { scopedApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    tag: { type: string }
                    task_count: { type: integer }
  /tasks/export:
    get:
      summary: Export task DEFINITIONS (not runs/logs) as a versioned JSON or YAML envelope for backup, cross-box migration, and cloning (#238).
      security: [{ adminApiKey: [] }, { scopedApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      parameters:
        - name: ids
          in: query
          schema: { type: string }
          description: Comma-separated task UUIDs to export; omit for all tasks.
        - name: format
          in: query
          schema: { type: string, enum: [json, yaml], default: json }
        - name: recurrence_only
          in: query
          schema: { type: boolean, default: false }
          description: Export only tasks with a non-empty recurrence (cron tasks).
      responses:
        "200":
          description: A versioned envelope of task definitions.
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string }
                  exported_at: { type: string, format: date-time }
                  tasks: { type: array, items: { type: object } }
            application/yaml:
              schema:
                type: object
        "403": { $ref: "#/components/responses/Error" }
  /tasks/import:
    post:
      summary: Import task definitions from a previously exported envelope; creates tasks in a single batch with per-task conflict handling (#238).
      security: [{ adminApiKey: [] }, { scopedApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      parameters:
        - name: dry_run
          in: query
          schema: { type: boolean, default: false }
          description: Validate and return the plan without writing.
        - name: conflict
          in: query
          schema: { type: string, enum: [error, skip, replace], default: error }
          description: Name-collision handling. conflict=replace additionally requires admin.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                version: { type: string }
                exported_at: { type: string, format: date-time }
                tasks: { type: array, items: { type: object } }
          application/yaml:
            schema: { type: object }
      responses:
        "200":
          description: Import result (all records created/skipped/replaced, or dry_run).
          content:
            application/json:
              schema:
                type: object
                properties:
                  dry_run: { type: boolean }
                  total: { type: integer }
                  created: { type: integer }
                  skipped: { type: integer }
                  replaced: { type: integer }
                  errors: { type: integer }
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        status: { type: string, enum: [created, skipped, replaced, error] }
                        id: { type: string, format: uuid }
                        reason: { type: string }
                        error: { type: string }
        "207":
          description: Multi-status — one or more records errored but others succeeded.
        "409": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /tasks/{task_id}:
    parameters:
      - name: task_id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Get a task.
      security: [{ adminApiKey: [] }, { scopedApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      summary: Update a task.
      security: [{ adminApiKey: [] }, { scopedApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskCreate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
    delete:
      summary: Cancel a task — and stop its live run (#508).
      description: >-
        Flips the task to cancelled with who-stopped-it attribution recorded on
        the terminal result ("stopped by <principal>"). If the task is executing
        in this server process, the governed run is interrupted at its next
        checkpoint: the sandbox is released, the partial transcript persists,
        and the live stream's terminal frame reports "stopped". Allowed for a
        principal with cancel permission (admin/scoped key), or a user stopping
        a task they personally created.
      security: [{ adminApiKey: [] }, { scopedApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      responses:
        "200": { description: Cancelled (attribution on the task's result). }
  /tasks/{task_id}/permanent:
    parameters:
      - name: task_id
        in: path
        required: true
        schema: { type: string }
    delete:
      summary: Permanently delete a task and its transcripts.
      description: >-
        Removes the task row, its run transcripts, and every cascading child
        (webhook triggers, loop config, task memory, feedback, learned
        instructions). Distinct from cancelling: a cancelled task keeps its row,
        and with it its name — which carries a partial unique index, so a broken
        job could never be replaced under the same name and could not be renamed
        either (PUT /tasks/{task_id} only edits pending or scheduled tasks).
        Deleting is the only operation that frees a name for reuse.

        Refuses with 409 while the task is leased or running: the worker still
        holds the lease and is writing to the row. Stop it first, then delete.
        Same authorization as cancelling — a principal with cancel permission
        (admin/scoped key), or a user deleting a task they personally created.
      security: [{ adminApiKey: [] }, { scopedApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
                  id: { type: string }
        "403": { description: Not the task's creator and lacking cancel permission. }
        "404": { description: No such task. }
        "409": { description: The task is running; stop it before deleting. }
  /tasks/{task_id}/output:
    parameters:
      - name: task_id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Get a task's validated structured output (#244).
      description: >
        Returns the validated JSON result of a structured-output task (one created
        with an output_schema), raw and unwrapped, for direct programmatic
        consumption. output_json and terminal success are committed atomically
        under the worker lease, before success notifications or recurrence side
        effects. Therefore every successful structured task returns 200 here.
        404 means no output_schema was declared. 409 means the task is not yet
        terminal — poll again later. 410 means the task failed terminally: the
        declared output will never exist for this run, so stop polling. 500
        marks a legacy/corrupt invariant-violating success row (no output_json,
        or stored bytes that are not valid JSON).
      security: [{ adminApiKey: [] }, { scopedApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      responses:
        "200":
          description: The validated structured output (shape defined by the task's output_schema).
          content:
            application/json:
              schema: {}
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /tasks/{task_id}/error-analysis:
    parameters:
      - name: task_id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Get a task's post-failure error diagnosis (#317).
      description: >
        Returns the asynchronous LLM diagnosis of a TERMINALLY-failed task — a
        structured classification plus suggested remediation — raw and unwrapped,
        for direct programmatic consumption. The diagnosis is produced off-thread
        after a terminal failure with a cheap model and a hard timeout. 404 when
        the task has no error analysis (it did not fail terminally, analysis is
        disabled, or the diagnosis was not produced); 409 while the task has not
        yet reached a terminal state.
      security: [{ adminApiKey: [] }, { scopedApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      responses:
        "200":
          description: The error diagnosis.
          content:
            application/json:
              schema:
                type: object
                required: [category, summary]
                properties:
                  category:
                    type: string
                    enum:
                      - configuration
                      - credentials
                      - network
                      - rate_limit
                      - timeout
                      - tool_error
                      - model_refusal
                      - resource_exhausted
                      - logic_error
                      - unknown
                  summary: { type: string }
                  remediation:
                    type: array
                    items: { type: string }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /tasks/{task_id}/artifacts:
    parameters:
      - name: task_id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: List a task's published output artifacts (#204).
      description: >
        Returns the curated manifest of named output files the run's agent
        explicitly published via the publish_artifact tool — a JSON array of
        {name, path, description, size} — distinct from the raw per-run workspace
        the workspace endpoints expose. Each entry's path is downloadable via the
        task's workspace file endpoint. Restricted to the task's creator (or an
        admin), like the workspace file endpoints — the manifest indexes the
        creator-private workspace. 404 when the run published no artifacts; 409
        while the task has not yet reached a terminal state.
      security: [{ adminApiKey: [] }, { scopedApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      responses:
        "200":
          description: The published-artifact manifest.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [name, path, size]
                  properties:
                    name: { type: string }
                    path: { type: string }
                    description: { type: string }
                    size: { type: integer, format: int64 }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /tasks/{task_id}/tags:
    parameters:
      - name: task_id
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Atomically add and/or remove tags on a task.
      security: [{ adminApiKey: [] }, { scopedApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                add: { type: array, items: { type: string } }
                remove: { type: array, items: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /tasks/{task_id}/rerun:
    parameters:
      - name: task_id
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Re-run a task once now (a new task copied from this one, optional overrides).
      security: [{ adminApiKey: [] }, { scopedApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                overrides:
                  type: object
                  properties:
                    prompt: { type: string }
                    model: { type: string }
                    fallback_model: { type: string }
                    max_iterations: { type: integer }
                    priority: { type: integer }
                    allow_network: { type: boolean }
                    description: { type: string }
                    title: { type: string, description: "Relabel the copy; omitted inherits the source's title." }
                    tags: { type: array, items: { type: string } }
                    files: { type: array, items: { type: string }, description: "Replaces attachments; omitted inherits, an empty array clears. Values are uploaded filenames." }
                    file_names: { type: array, items: { type: string }, description: "Optional logical names paired 1:1 with files. Replacing files clears inherited names unless supplied here." }
                    allow_delegation: { type: boolean }
                    thinking_budget_tokens: { type: integer, description: "Negative clears to the global default; omitted inherits the source." }
                    persona: { type: string }
                    mcp_selection: { $ref: "#/components/schemas/MCPSelection" }
                    expected_duration_minutes: { type: integer, description: "SLA expectation for the copy; 0 clears it, omitted inherits the source." }
                    sla_warn_multiplier: { type: number, description: "0 = the default (1.5); omitted inherits." }
                    sla_fail_multiplier: { type: number, description: "0 = the default (2.0); omitted inherits." }
                    sandbox_limits:
                      type: object
                      nullable: true
                      description: "Per-run sandbox cgroup override; an explicit null (or an all-zero object) clears to the global defaults, omitted inherits."
                      properties:
                        memory_mb: { type: integer }
                        cpus: { type: number }
                        pids: { type: integer }
                    run_if:
                      type: object
                      nullable: true
                      description: "Pre-run shell gate for the copy (POSIX sh); an explicit null clears it, omitted inherits."
                      properties:
                        command: { type: string }
                        exit_code_is: { type: integer }
                        timeout_seconds: { type: integer }
                    carry_context: { type: boolean }
                    instruction_self_improve: { type: boolean }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /tasks/{task_id}/clone:
    parameters:
      - name: task_id
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Clone a task (a new task copied from this one, preserving recurrence; optional overrides).
      security: [{ adminApiKey: [] }, { scopedApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                overrides:
                  type: object
                  description: "Accepts the same override fields as POST /tasks/{task_id}/rerun, including files and file_names."
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /tasks/{task_id}/stream:
    parameters:
      - name: task_id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Stream a task's run log live (SSE).
      description: >
        Server-Sent Events stream of the task's run log. While the task is in flight
        the in-memory event buffer is tailed live, with Last-Event-ID replay on
        reconnect; once the task has finished the persisted log is replayed one-shot.
        Event types: agent_message, tool_call, tool_result, and a terminal status.
        Same auth + ownership gate as GET /logs/{task_id}.
      security: [{ adminApiKey: [] }, { scopedApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      responses:
        "200":
          description: An SSE stream of run-log events.
          content:
            text/event-stream:
              schema: { type: string }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /tasks/{task_id}/workspace:
    parameters:
      - name: task_id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: List (or ZIP-export) the files an agent created in a completed task's workspace.
      description: >
        Lists the files the task's agent wrote into its per-run workspace directory
        (reports, data, code, charts). Access is restricted to the admin or the
        task's creator (the creating user or API key) — strictly more than ordinary
        task visibility, because workspace files are private artifacts. Only available
        for completed tasks (success/error); a running task's workspace is mid-write.
        With ?format=zip the entire workspace is streamed as a ZIP archive (capped at
        FLEET_WORKSPACE_DOWNLOAD_MAX_BYTES total uncompressed size, default 50 MiB).
      security: [{ adminApiKey: [] }, { scopedApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      parameters:
        - name: format
          in: query
          required: false
          schema: { type: string, enum: [zip] }
          description: When "zip", stream the whole workspace as a ZIP archive instead of the JSON listing.
      responses:
        "200":
          description: The workspace listing (JSON), or the ZIP archive when ?format=zip.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceListing" }
            application/zip:
              schema: { type: string, format: binary }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
  /tasks/{task_id}/workspace/*:
    parameters:
      - name: task_id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Download a single file from a completed task's workspace.
      description: >
        Streams one file from the task's per-run workspace as an attachment. The
        trailing path is interpreted relative to the workspace root and is guarded
        against traversal (".."/absolute/NUL paths are rejected; symlinks that escape
        the workspace root are not followable). Access is restricted to the admin or
        the task's creator. A file larger than FLEET_WORKSPACE_DOWNLOAD_MAX_BYTES
        (default 50 MiB) returns 413 and must be fetched via the CLI.
      security: [{ adminApiKey: [] }, { scopedApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      responses:
        "200":
          description: The file contents, as an attachment.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
  /tasks/cleanup:
    post:
      summary: Cleanup completed/old task history.
      security: [{ adminApiKey: [] }]
      responses:
        "200": { description: OK }
  /tasks/model:
    post:
      summary: Bulk re-assign the pinned model/fallback across scheduled tasks (admin).
      description: >-
        Fleet-wide mutation; admin-only. Optionally limited to tasks pinned to
        from_model. dry_run returns the matched tasks without writing.
      security: [{ adminApiKey: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                model: { type: string }
                fallback_model:
                  type: string
                  description: >-
                    Omit to leave each task's existing fallback_model untouched;
                    send an empty string to clear it to NULL; send a slug to set it.
                from_model: { type: string }
                dry_run: { type: boolean }
              required: [model]
      responses:
        "200": { description: OK }
        "400": { $ref: "#/components/responses/Error" }

  /admin/migrations:
    get:
      summary: Migration status — applied vs pending sched-DB migrations (#256).
      description: >-
        Read-only operator view of the scheduler (sched) database's schema
        migrations: the current golang-migrate version, whether the tracking row
        is dirty (a prior migration failed mid-flight and needs a `migrate force`
        + restart), and the applied vs pending migration lists derived from the
        embedded `.up.sql` files. Applies nothing — safe to call any time.
        Admin-only. The chat server exposes the equivalent for its own database
        at the same path on its port.
      security: [{ adminApiKey: [] }]
      responses:
        "200":
          description: Migration status for the sched database.
          content:
            application/json:
              schema:
                type: object
                properties:
                  db: { type: string }
                  runner: { type: string }
                  migration_table: { type: string }
                  current_version: { type: integer, nullable: true }
                  dirty: { type: boolean }
                  applied:
                    type: array
                    items:
                      type: object
                      properties:
                        version: { type: integer }
                        name: { type: string }
                  pending:
                    type: array
                    items:
                      type: object
                      properties:
                        version: { type: integer }
                        name: { type: string }
        "500": { $ref: "#/components/responses/Error" }

  /datasets:
    get:
      summary: List datasets (#514).
      description: Every dataset (table agent) with per-status row counts, newest first.
      security: [{ adminApiKey: [] }, { scopedApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      responses:
        "200":
          description: The dataset list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  datasets:
                    type: array
                    items: { $ref: "#/components/schemas/Dataset" }
    post:
      summary: Create a dataset (#514).
      description: >-
        Defines a table agent: a name, the per-row goal, typed columns (at least
        one output column — those define the structured write-back schema), the
        pinned model each row runs at, and an optional persona + worker
        concurrency (1..8, default 2).
      security: [{ adminApiKey: [] }, { scopedApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, goal, columns, model]
              properties:
                name: { type: string, maxLength: 128 }
                goal: { type: string, maxLength: 8000 }
                columns:
                  type: array
                  items: { $ref: "#/components/schemas/DatasetColumn" }
                model: { type: string }
                persona: { type: string }
                concurrency: { type: integer, minimum: 0, maximum: 8 }
      responses:
        "200":
          description: The created dataset.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dataset" }
        "400": { $ref: "#/components/responses/Error" }
  /datasets/{datasetID}:
    parameters:
      - name: datasetID
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Get one dataset (#514).
      security: [{ adminApiKey: [] }, { scopedApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      responses:
        "200":
          description: The dataset with row counts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dataset" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete a dataset and its rows (#514).
      description: Refused (409) while the dataset is running — pause it first.
      security: [{ adminApiKey: [] }, { scopedApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      responses:
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /datasets/{datasetID}/rows:
    parameters:
      - name: datasetID
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: List a dataset's rows (#514).
      description: Ordered by row_index; filter with ?status= and page with ?limit=&offset= (default limit 200).
      security: [{ adminApiKey: [] }, { scopedApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, running, proposed, approved, failed] }
        - name: limit
          in: query
          schema: { type: integer }
        - name: offset
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: The rows plus the dataset's per-status counts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    items: { $ref: "#/components/schemas/DatasetRow" }
                  row_counts:
                    type: object
                    additionalProperties: { type: integer }
    post:
      summary: Import rows (#514).
      description: >-
        Appends rows from JSON ({"rows":[{column: value}]}) or CSV
        (Content-Type text/csv; the header row names INPUT columns). Values may
        only target input columns; unknown names are rejected. Capped at 5000
        rows / 16 MiB per request.
      security: [{ adminApiKey: [] }, { scopedApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rows:
                  type: array
                  items: { type: object }
          text/csv:
            schema: { type: string }
      responses:
        "200":
          description: Rows imported.
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
  /datasets/{datasetID}/run:
    parameters:
      - name: datasetID
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Start working the dataset's pending rows (#514).
      description: >-
        Claims the dataset (idle|paused → running) and fans out its configured
        worker concurrency; each row runs through the governed loop and lands as
        a PROPOSED write-back for review. 409 when already running.
      security: [{ adminApiKey: [] }, { scopedApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      responses:
        "200":
          description: Run started.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /datasets/{datasetID}/pause:
    parameters:
      - name: datasetID
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Pause a running dataset (#514).
      description: Cancels the active run between rows; pending rows stay pending and resume on the next run.
      security: [{ adminApiKey: [] }, { scopedApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      responses:
        "200":
          description: Paused.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /datasets/{datasetID}/approve:
    parameters:
      - name: datasetID
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Approve proposed write-backs (#514 review queue).
      description: >-
        Merges each proposed object into the row's cells and marks the row
        approved. Empty/omitted row_ids approves EVERY proposed row (bulk
        approve). Only rows in status "proposed" are touched.
      security: [{ adminApiKey: [] }, { scopedApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                row_ids:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: Rows approved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  approved: { type: integer }
  /datasets/{datasetID}/rerun:
    parameters:
      - name: datasetID
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Reset rows to pending for a re-run (#514).
      description: >-
        The given row_ids (any non-running status), or EVERY failed row when
        omitted (bulk retry). Clears proposed/error state; approved cells stay.
      security: [{ adminApiKey: [] }, { scopedApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                row_ids:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: Rows reset.
          content:
            application/json:
              schema:
                type: object
                properties:
                  reset: { type: integer }
  /datasets/{datasetID}/export:
    parameters:
      - name: datasetID
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Export the dataset as CSV (#514).
      description: All columns (approved values merged) plus _status/_note/_error per row.
      security: [{ adminApiKey: [] }, { scopedApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      responses:
        "200":
          description: The CSV export.
          content:
            text/csv:
              schema: { type: string }
        "404": { $ref: "#/components/responses/Error" }
  /tasks/{task_id}/feedback:
    parameters:
      - name: task_id
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Submit feedback on a task's output (#516 self-improving memory).
      description: >-
        Records a thumbs up/down (optional critique) signal. When fresh
        down-signals cross the distillation threshold and self-improvement is
        enabled, a learned instruction is DISTILLED and staged as 'proposed'
        (off-thread) — it does not change behavior until activated.
      security: [{ adminApiKey: [] }, { scopedApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: string, enum: [up, down] }
                critique: { type: string }
      responses:
        "200":
          description: The recorded feedback.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskFeedback" }
        "400": { $ref: "#/components/responses/Error" }
  /tasks/{task_id}/learned-instructions:
    parameters:
      - name: task_id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: List a task's learned instructions (#516), newest version first.
      security: [{ adminApiKey: [] }, { scopedApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      responses:
        "200":
          description: The task's learned instructions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  learned_instructions:
                    type: array
                    items: { $ref: "#/components/schemas/TaskLearnedInstruction" }
  /tasks/{task_id}/learned-instructions/{version}/activate:
    parameters:
      - name: task_id
        in: path
        required: true
        schema: { type: string }
      - name: version
        in: path
        required: true
        schema: { type: integer }
    post:
      summary: Activate (or revert to) a learned-instruction version (#516).
      description: >-
        Makes the version the task's sole active learned instruction (archiving
        any prior active) — this is both the activate and the revert primitive.
        Requires operator (cancel) permission.
      security: [{ adminApiKey: [] }, { scopedApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      responses:
        "200":
          description: The activated instruction.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskLearnedInstruction" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /tasks/{task_id}/learned-instructions/active:
    parameters:
      - name: task_id
        in: path
        required: true
        schema: { type: string }
    delete:
      summary: Deactivate the active learned instruction (#516 full revert).
      description: Archives the task's active learned instruction so future runs inject none. Requires operator (cancel) permission.
      security: [{ adminApiKey: [] }, { scopedApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      responses:
        "200":
          description: Whether an instruction was active.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deactivated: { type: boolean }
        "403": { $ref: "#/components/responses/Error" }
  /tasks/paused:
    get:
      summary: List tasks paused awaiting a human answer (#510).
      description: The "needs a human answer" queue — tasks whose agent called `ask` and parked in paused_awaiting_input (holding no sandbox/lease).
      security: [{ adminApiKey: [] }, { scopedApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: The paused tasks.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items: { $ref: "#/components/schemas/Task" }
  /tasks/{task_id}/resume:
    parameters:
      - name: task_id
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Answer a paused task's question and re-queue it (#510).
      description: >-
        Supplies the human answer to a task in paused_awaiting_input and
        re-queues it (status → pending); the next run is given the Q&A and
        continues. 409 when the task is not paused. Requires operator (cancel)
        permission.
      security: [{ adminApiKey: [] }, { scopedApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties:
                answer: { type: string }
      responses:
        "200":
          description: Re-queued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /tasks/{task_id}/wake:
    parameters:
      - name: task_id
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Fire a named event at a task parked by wake_on_event (self-wake).
      description: >-
        Re-queues a task in paused_awaiting_wake early (status → pending); the
        event key must match the one the task is waiting for, so a caller can
        never wake an arbitrary sleeping task. The next run is told the event
        fired (with the optional note). 409 when the task is not awaiting a
        wake or waits for a different event. Requires operator (cancel)
        permission, mirroring /tasks/{task_id}/resume. See docs/SELF-WAKE.md.
      security: [{ adminApiKey: [] }, { scopedApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event]
              properties:
                event: { type: string }
                note: { type: string }
      responses:
        "200":
          description: Re-queued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /tasks/upcoming:
    get:
      summary: Upcoming scheduled runs — calendar/timeline feed (#504).
      description: >-
        Projects future executions from the existing scheduler data: up to a few
        cron occurrences per recurring task (in the task's timezone) plus each
        one-shot's scheduled_for, sorted by time. A computed view (no run-records
        table).
      security: [{ adminApiKey: [] }, { scopedApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Upcoming runs, soonest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  upcoming:
                    type: array
                    items:
                      type: object
                      properties:
                        task_id: { type: string }
                        name: { type: string }
                        title: { type: string, description: "The task's display label; survives every occurrence, unlike name." }
                        prompt: { type: string }
                        recurrence: { type: string }
                        next_run: { type: string, format: date-time }
                        recurring: { type: boolean }
  /admin/pipeline-metrics:
    get:
      summary: Tool-pipeline metrics derived from retained session logs (#543).
      description: >-
        The sensor behind data-driven optimization decisions (see #505's reopen
        criteria): per-run tool turns / total + distinct tool calls / tokens /
        cost / wall clock, derived from the session logs fleet already
        persists, plus a fleet-wide aggregate (tool-turn histogram and the
        share of runs that were long multi-tool pipelines). Admin-only.
      security: [{ adminApiKey: [] }]
      parameters:
        - name: runs
          in: query
          required: false
          schema: { type: integer, default: 100, maximum: 500 }
          description: Cap on per-run rows returned (most recent first); the aggregate always covers every retained log.
      responses:
        "200":
          description: Aggregate + most-recent per-run pipeline metrics.
          content:
            application/json:
              schema:
                type: object
                properties:
                  aggregate:
                    type: object
                    properties:
                      runs: { type: integer }
                      tool_turn_histogram:
                        type: object
                        additionalProperties: { type: integer }
                      pct_runs_at_least_5_tool_turns: { type: number }
                      avg_tool_turns: { type: number }
                      avg_distinct_tools: { type: number }
                      avg_prompt_tokens: { type: number }
                      avg_completion_tokens: { type: number }
                      avg_wall_clock_seconds: { type: number }
                  runs:
                    type: array
                    items:
                      type: object
                      properties:
                        task_id: { type: string }
                        tool_turns: { type: integer }
                        total_tool_calls: { type: integer }
                        distinct_tools: { type: integer }
                        max_calls_in_one_turn: { type: integer }
                        prompt_tokens: { type: integer }
                        completion_tokens: { type: integer }
                        cost_usd: { type: number }
                        wall_clock_seconds: { type: integer }
                        created_at: { type: integer }
        "401": { $ref: "#/components/responses/Error" }
  /admin/queue:
    get:
      summary: Pending task-queue stats — per-tier depth + oldest wait (#230).
      description: >-
        Operator view of the pending task queue: total depth, the oldest pending
        wait, and the count + oldest wait per named priority tier
        (critical/high/normal/low/bulk). Lower priority integer = higher urgency.
        Admin-only — backlog data is operator-sensitive.
      security: [{ adminApiKey: [] }]
      responses:
        "200":
          description: Pending-queue depth and oldest wait, overall and per tier.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pending_total: { type: integer }
                  oldest_age_seconds: { type: integer }
                  tiers:
                    type: array
                    items:
                      type: object
                      properties:
                        tier: { type: string }
                        min_priority: { type: integer }
                        max_priority: { type: integer }
                        count: { type: integer }
                        oldest_age_seconds: { type: integer }
        "500": { $ref: "#/components/responses/Error" }

  /admin/reload-config:
    post:
      summary: Hot-reload reloadable settings without a restart (#286).
      description: >-
        Re-reads the small, explicitly safe subset of settings that a running
        fleet may change mid-flight — the per-run cost/token ceilings, the
        per-turn iteration ceiling, and the sampling temperature shared by
        interactive and scheduled runs (FLEET_MAX_COST_USD,
        FLEET_MAX_TOTAL_TOKENS, FLEET_MAX_ITERATIONS, FLEET_TEMPERATURE). Values are
        re-read from the env file (FLEET_ENV_FILE) and process environment with
        the same precedence as boot. Equivalent to sending SIGUSR2. Settings that
        are bound into a listener, connection pool, or signing context at startup
        (bind addresses, DB DSNs, auth secrets, the admission-semaphore size, TLS)
        are NOT reloadable and are reported under `skipped` when changed. Admin-only.
      security: [{ adminApiKey: [] }]
      responses:
        "200":
          description: A diff of what changed, was skipped (needs restart), or errored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  reloaded_at: { type: string, format: date-time }
                  changed:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string }
                        old: { type: string }
                        new: { type: string }
                  skipped:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string }
                        reason: { type: string }
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string }
                        error: { type: string }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /admin/mcp-servers/reload:
    post:
      summary: Hot-reload the MCP server catalog without a restart (#218).
      description: >-
        Re-reads the client-config bundle's MCP catalog (manifest.yaml) and
        applies the minimum set of server mutations to the live interactive
        agent — starting newly-added servers, draining + closing removed ones,
        and restarting changed ones — WITHOUT tearing down unchanged servers or
        restarting the process. The change takes effect on the next interactive
        chat turn and the next scheduled run that uses the shared catalog;
        in-flight runs finish on their current tool set. Equivalent to sending
        SIGHUP. Admin-only. Returns a summary of what changed.
      security: [{ adminApiKey: [] }]
      responses:
        "200":
          description: Summary of the servers added, removed, restarted, or left unchanged.
          content:
            application/json:
              schema:
                type: object
                properties:
                  added: { type: array, items: { type: string } }
                  removed: { type: array, items: { type: string } }
                  restarted: { type: array, items: { type: string } }
                  unchanged: { type: array, items: { type: string } }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /sla-report:
    get:
      summary: SLA report — per-task actual-duration p50/p95 + breach rate (#274).
      description: >-
        Aggregates the per-prompt SLA actuals over a window: the expected
        duration, the p50/p95 actual run duration (completed_at - started_at),
        and the breach rate (fraction of runs that crossed the fail threshold).
        Admin-only — duration/breach data is operator-sensitive and the report is
        global (all tasks) while a member may be scoped. The gate is enforced
        in-handler on the admin permission, so the admin API key OR an admin-role
        user (the dashboard's header-trust/bearer session) is accepted while a
        non-admin member gets 403 (#458). days= (default 7, clamped to [1, 90])
        selects the window.
      security: [{ adminApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      parameters:
        - name: days
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 90, default: 7 }
      responses:
        "200":
          description: The SLA report for the window.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SLAReport" }
        "500": { $ref: "#/components/responses/Error" }

  /admin/usage:
    get:
      summary: Usage analytics — cost/token roll-up by principal, project, model, or time bucket (#601 part 1).
      description: >-
        Aggregates the already-persisted metering over a window: task-side from
        task_iterations joined to tasks (cost_usd, prompt/completion tokens per
        iteration, keyed by created_by / created_by_key_id / model), chat-side
        from the turn_metrics session log (keyed by user email, project,
        conversation model). Admin-only — spend data is global across all
        principals. Like /sla-report, the gate is enforced in-handler on the
        admin permission so both the admin API key and an admin-role dashboard
        session are accepted (#458). group_by defaults to user; from/to default
        to the trailing 30 days (to is exclusive; the window is clamped to 366
        days). Dollar figures depend on pricing configuration (#289): native-
        provider runs accrue $0 unless a pricing override is set — token totals
        are complete regardless.
      security: [{ adminApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      parameters:
        - name: group_by
          in: query
          required: false
          schema: { type: string, enum: [user, key, project, model, day, week], default: user }
        - name: from
          in: query
          required: false
          description: Window start (inclusive), RFC 3339 or YYYY-MM-DD. Default = to − 30 days.
          schema: { type: string }
        - name: to
          in: query
          required: false
          description: Window end (exclusive), RFC 3339 or YYYY-MM-DD. Default = now.
          schema: { type: string }
      responses:
        "200":
          description: The usage report for the window.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsageReport" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /admin/usage/adoption:
    get:
      summary: Adoption analytics — per-user AI-adoption audit with daily series and trend deltas.
      description: >-
        The read model behind the Operations Center's exec Adoption view. Same
        persisted metering as /admin/usage, aggregated by (user, UTC day) at
        once: per-user merged totals with per-day token series (sparklines,
        active days), an equal-length previous window for trend deltas, a
        daily activity trend, and the provisioned-account roster so inactive
        seats are listed explicitly. Admin-only with the /admin/usage posture:
        registered for proxy reachability, gated in-handler on the admin
        permission (#458). from/to default to the trailing 30 days (to is
        exclusive; the window is clamped to 366 days). Dollar figures depend
        on pricing configuration (#289) — token totals are complete
        regardless, which is why the leaderboard reads token volume first.
      security: [{ adminApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      parameters:
        - name: from
          in: query
          required: false
          description: Window start (inclusive), RFC 3339 or YYYY-MM-DD. Default = to − 30 days.
          schema: { type: string }
        - name: to
          in: query
          required: false
          description: Window end (exclusive), RFC 3339 or YYYY-MM-DD. Default = now.
          schema: { type: string }
        - name: format
          in: query
          required: false
          description: json (default) or csv (the per-user leaderboard as an attachment).
          schema: { type: string, enum: [json, csv], default: json }
      responses:
        "200":
          description: The adoption report for the window.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdoptionReport" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /admin/budgets:
    get:
      summary: List per-principal rolling budgets with their live window spend (#601 part 2).
      description: >-
        Every configured budget plus its current-window evaluation — spend
        recomputed from the persisted metering (the part-1 usage read model),
        the effective hard bounds after the fail-safe clamp against the live
        global ceilings (#286), and whether this window's soft alert fired.
        Admin-only; like /admin/usage the gate is enforced in-handler on the
        admin permission so both the admin API key and an admin-role dashboard
        session are accepted (#458).
      security: [{ adminApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      responses:
        "200":
          description: The configured budgets with live evaluation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  budgets:
                    type: array
                    items: { $ref: "#/components/schemas/BudgetStatus" }
                required: [budgets]
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      summary: Create or replace a per-principal rolling budget (#601 part 2).
      description: >-
        Upserts on (scope, principal_id, window) — one budget per principal per
        window kind — and resets the once-per-window soft-alert marker so an
        edited budget re-arms its alert. Enforcement applies at every
        task-create path (POST /tasks, POST /tasks/batch, chat schedule_task):
        at a soft bound one notify alert fires per window crossing; at a hard
        bound new task creation is refused with 402 until the window rolls
        over. Budgets only narrow the live global FLEET_MAX_COST_USD /
        FLEET_MAX_TOTAL_TOKENS ceilings, never exceed them. Admin-only
        (in-handler admin gate, #458).
      security: [{ adminApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BudgetCreate" }
      responses:
        "200":
          description: The persisted budget.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Budget" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /admin/budgets/{budget_id}:
    delete:
      summary: Delete a per-principal rolling budget (#601 part 2).
      security: [{ adminApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      parameters:
        - name: budget_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Deleted.
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /logs/{task_id}:
    parameters:
      - name: task_id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Get the captain's-log session for a task.
      description: >-
        Requires the view_logs permission AND either ownership of the task (the
        creating user or API key) or the explicit fleet-wide view_all_logs
        permission, which PermissionAdmin implies. A transcript carries the run's
        verbatim tool traffic, so a view_logs holder reads its OWN tasks only;
        anyone else's is 403. Same gate on the /history siblings and on
        GET /tasks/{task_id}/stream.
      security: [{ adminApiKey: [] }, { scopedApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogSession" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /logs/{task_id}/history:
    parameters:
      - name: task_id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: List the task's superseded transcripts (per-attempt run log history).
      description: >-
        Metadata only (entry id + when a newer transcript replaced it), newest
        first. History exists only where a retry / ask-resume / wake cycle of
        the SAME task id overwrote a transcript. Same auth + ownership gate as
        GET /logs/{task_id}.
      security: [{ adminApiKey: [] }, { scopedApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        superseded_at: { type: string, format: date-time }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /logs/{task_id}/history/{entry_id}:
    parameters:
      - name: task_id
        in: path
        required: true
        schema: { type: string }
      - name: entry_id
        in: path
        required: true
        schema: { type: integer }
    get:
      summary: Fetch one superseded transcript from the task's run log history.
      description: >-
        Returns the LogSession shape GET /logs/{task_id} returns. Entry lookups
        are task-scoped; same auth + ownership gate as GET /logs/{task_id}.
      security: [{ adminApiKey: [] }, { scopedApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogSession" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /logs/{task_id}/subagents/{child_session_id}:
    parameters:
      - name: task_id
        in: path
        required: true
        schema: { type: string }
      - name: child_session_id
        in: path
        required: true
        schema: { type: string, pattern: "^subagent-[0-9a-f-]{36}$" }
    get:
      summary: Fetch a spawned sub-agent's own transcript (#1043).
      description: >-
        Returns the sibling session log (LogSession shape) a sub-agent child
        run wrote. Same auth + ownership gate as GET /logs/{task_id}, PLUS a
        linkage check — the child id must appear in a subagent_spawned entry of
        this task's persisted log (latest or any history attempt). The
        transcript file is host-local and best-effort: 404 when it is no
        longer present, while the parent log's linkage entry remains the
        durable record.
      security: [{ adminApiKey: [] }, { scopedApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogSession" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /users:
    post:
      summary: Create a sched user.
      security: [{ adminApiKey: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
  /api/me:
    get:
      summary: The authenticated principal.
      security: [{ adminApiKey: [] }, { scopedApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUserResponse" }
  /stats:
    get:
      summary: Dashboard stats.
      security: [{ adminApiKey: [] }, { scopedApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardStats" }

  /mcp-servers:
    get:
      summary: Optional-MCP catalog for the scheduled-task picker (read-only; never secret values).
      description: >
        Mirrors chat's GET /mcp-servers so the same MCP picker renders in the
        task form. Returns each Optional server's name, display name,
        description, tool count, default-enabled flag, and its credential-account
        seat names (derived from the <VAR>_<ACCOUNT> env suffix scan). Secret
        values are never returned.
      security: [{ adminApiKey: [] }, { scopedApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  servers:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        display_name: { type: string }
                        description: { type: string }
                        tool_count: { type: integer }
                        enabled: { type: boolean }
                        accounts:
                          type: array
                          items: { type: string }

  /mcp-accounts:
    get:
      summary: Flat (server, account) credential-seat catalog (names only).
      description: >
        Companion to /mcp-servers for the credential-account admin table. Lists
        every provisioned (server, account) seat by name; never returns secret
        values.
      security: [{ adminApiKey: [] }, { scopedApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts:
                    type: array
                    items:
                      type: object
                      properties:
                        server: { type: string }
                        account: { type: string }

  /task-templates:
    get:
      summary: Read-only task-template catalog for the "new task from a template" UI.
      description: >
        Returns the client bundle's task_templates catalog: each entry's name,
        description, icon, a partial-TaskCreate `task` payload that seeds the
        task-create form, and the {variable} placeholder names extracted from its
        prompt (so the UI can prompt for them before pre-filling). Pure config
        read-through — no template is ever persisted and no task is created here
        (the task is created through the ordinary POST /tasks path). Returns an
        empty array when the bundle ships no templates.
      security: [{ adminApiKey: [] }, { scopedApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string }
                    description: { type: string }
                    icon: { type: string }
                    variables:
                      type: array
                      items: { type: string }
                    task:
                      type: object
                      description: >
                        Partial TaskCreate payload (subset of editable fields) used
                        to pre-fill the form. All fields optional.
                      properties:
                        prompt: { type: string }
                        model: { type: string }
                        fallback_model: { type: string }
                        max_iterations: { type: integer }
                        max_retries: { type: integer }
                        recurrence: { type: string }
                        timezone: { type: string }
                        priority: { type: integer }
                        allow_network: { type: boolean }
                        instruction_self_improve: { type: boolean }
                        persona: { type: string }
                        description: { type: string }
                        tags:
                          type: array
                          items: { type: string }

  /prompts:
    get:
      summary: List the visible hybrid prompt library.
      description: >
        Merges live-read, read-only files from the client bundle's prompts/
        directory with the caller's private prompts and all workspace-shared
        database prompts.
      security: [{ adminApiKey: [] }, { scopedApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      responses:
        "200":
          description: Visible prompt entries.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/PromptLibraryItem" } }
    post:
      summary: Create a private or workspace-shared prompt.
      security: [{ adminApiKey: [] }, { scopedApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromptLibraryWrite" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/PromptLibraryItem" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /prompts/export:
    get:
      summary: Export the visible hybrid prompt library as versioned JSON.
      security: [{ adminApiKey: [] }, { scopedApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      responses:
        "200":
          description: Portable prompt-library backup.
          content:
            application/json:
              schema:
                type: object
                properties:
                  format: { type: string, enum: [fleet-prompt-library] }
                  version: { type: integer, enum: [1] }
                  exported_at: { type: string, format: date-time }
                  prompts: { type: array, items: { $ref: "#/components/schemas/PromptLibraryItem" } }

  /prompts/{prompt_id}:
    parameters:
      - name: prompt_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      summary: Replace an owned database-backed prompt (admins may replace any).
      security: [{ adminApiKey: [] }, { scopedApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromptLibraryWrite" }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/PromptLibraryItem" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete an owned database-backed prompt (admins may delete any).
      security: [{ adminApiKey: [] }, { scopedApiKey: [] }, { bearerToken: [] }, { elcanoAuthCookie: [] }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }

  /keys:
    post:
      summary: Create an API key (plaintext shown once).
