# Per-unit restatement of the unit body's TimeoutStopFailureMode=kill.
#
# Why this exists: Fedora (and any distro shipping
# /usr/lib/systemd/system/service.d/10-timeout-abort.conf) sets
# TimeoutStopFailureMode=abort GLOBALLY, and drop-ins are read after the unit
# body — so the global drop-in overrides fleet-web.service's own
# TimeoutStopFailureMode=kill line. A per-unit drop-in under
# fleet-web.service.d/ is read after the global one and wins.
#
# Install to /etc/systemd/system/fleet-web.service.d/10-timeout-kill.conf
# (see the install block at the top of ../fleet-web.service).
[Service]
TimeoutStopFailureMode=kill
