# Cockpit is disabled and masked on this host; keep its login-banner notice
# (/etc/motd.d/cockpit -> /run/cockpit/issue) empty. Overrides the package copy
# in /usr/lib/tmpfiles.d, so it survives cockpit-ws upgrades.
F /run/cockpit/inactive.issue 0640 root wheel -
F /run/cockpit/active.issue   0640 root wheel -
L /run/cockpit/issue - - - - inactive.issue
