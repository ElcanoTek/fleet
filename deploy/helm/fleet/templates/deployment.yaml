{{- /*
The probes below speak plain HTTP to the chat port, 8080, which the chart
binds with FLEET_SERVER_ADDR. config.env is rendered after that, so a
FLEET_SERVER_ADDR there that binds another port moves the listener, and
FLEET_TLS_MODE=manual|auto makes it HTTPS: either fails every probe, and the
liveness probe then restarts the pod in a loop. A FLEET_SERVER_ADDR that binds
port 8080 on every interface is the chart's own setting and renders. Each
value is compared as fleet reads that key: FLEET_TLS_MODE with one pair of
quotes stripped, then trimmed and lowercased, so a value fleet would reject
at boot is refused here too (an unquoted off in a values file is YAML for
false); FLEET_SERVER_ADDR with one pair of quotes stripped and nothing else,
since fleet binds it verbatim. TLS belongs at the Ingress. The same keys set
through config.existingSecret cannot be seen here (deploy/helm/fleet/README.md).
*/ -}}
{{- $env := .Values.config.env | default dict }}
{{- $tls := lower (trim (include "fleet.stripEnvQuotes" (get $env "FLEET_TLS_MODE"))) }}
{{- if or (eq $tls "manual") (eq $tls "auto") }}
{{- fail (printf "config.env.FLEET_TLS_MODE=%s: the chart's probes and Service speak plain HTTP to the chat port, and an HTTPS chat listener would fail every probe and restart the pod in a loop. Terminate TLS at the Ingress and remove FLEET_TLS_MODE (or set it to \"off\", quoted)." $tls) }}
{{- else if not (has $tls (list "" "off")) }}
{{- fail (printf "config.env.FLEET_TLS_MODE=%q: fleet accepts only off, manual or auto and would refuse to start. An unquoted off or no in a values file is YAML for false: write \"off\" (quoted), or remove FLEET_TLS_MODE." $tls) }}
{{- end }}
{{- if hasKey $env "FLEET_SERVER_ADDR" }}
{{- $addr := include "fleet.stripEnvQuotes" (get $env "FLEET_SERVER_ADDR") }}
{{- if not (has $addr (list ":8080" "0.0.0.0:8080" "[::]:8080")) }}
{{- fail (printf "config.env.FLEET_SERVER_ADDR=%q: the chart binds the chat listener to 0.0.0.0:8080, the port its probes and Service target; another address (fleet binds the value exactly as written, spaces included) would fail every probe or every boot and restart the pod in a loop. Remove FLEET_SERVER_ADDR from config.env, or set it to 0.0.0.0:8080." $addr) }}
{{- end }}
{{- end }}
# The fleet control plane. ONE replica, forever: scheduler leases and the
# worker semaphore are single-owner (ADR-0004 / ADR-0049) — two replicas
# against one database pair is a correctness bug. There is deliberately no
# replicas knob; horizontal scale of work = more sandbox pods.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fleet.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleet.labels" . | nindent 4 }}
  {{- with include "fleet.unpinnedImages" . }}
  annotations:
    # Images deployed by a movable tag, not a digest (NOTES.txt warns too).
    fleet.elcanotek.com/unpinned-images: {{ . | quote }}
  {{- end }}
spec:
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate: a rolling update would run two control
    # planes side by side for the overlap window — the exact multi-writer
    # state the single-owner invariant forbids.
    type: Recreate
  selector:
    matchLabels:
      {{- include "fleet.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fleet.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "fleet.serviceAccountName" . }}
      # Must exceed FLEET_SHUTDOWN_GRACE_SECONDS (default 300) with headroom for
      # pool and DB teardown. Without it the kubelet SIGKILLs at its own 30s
      # default — the same number — so the documented drain had no slack and
      # raising the fleet knob for long turns silently did nothing.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fleet
          image: {{ include "fleet.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: chat
              containerPort: 8080
            - name: orchestrator
              containerPort: 8000
            # The browser tier: the web UI and its /api, served by the fleet
            # binary itself (ADR-0091) — the Ingress points here.
            - name: web
              containerPort: 3000
          env:
            # Listeners bind all pod interfaces; the Service/Ingress is the
            # exposure boundary (the single-box default is loopback + Caddy).
            - name: FLEET_SERVER_ADDR
              value: "0.0.0.0:8080"
            - name: FLEET_WEB_ADDR
              value: "0.0.0.0:3000"
            - name: FLEET_ORCHESTRATOR_ADDR
              value: "0.0.0.0:8000"
            - name: FLEET_DATA_DIR
              value: {{ .Values.dataDir | quote }}
            # fleet defaults EMAIL_ATTACHMENT_DIR to ./data/attachments —
            # CWD-relative, and nothing derives it from FLEET_DATA_DIR. The
            # image has no WORKDIR, so cwd is /, and boot fails creating
            # /data/attachments/uploads as uid 1000 BEFORE the sandbox
            # preflight ever runs. deploy/fleet.service solves the same trap by
            # anchoring the CWD; a pod spec says it directly.
            - name: EMAIL_ATTACHMENT_DIR
              value: "{{ .Values.dataDir }}/attachments"
            # Cluster identity for the sandbox-pod orphan sweep. The UID
            # anchors this pod and the release name marks the owner, so a
            # restarted control plane can tell its predecessor's leaked pods
            # from a co-tenant release's live ones. fleet pairs the UID with a
            # per-process boot nonce, because kubelet restarts a crashed
            # container in place and the UID alone would not change. Without
            # these fleet falls back to a pid heuristic that is meaningless
            # across containers.
            - name: FLEET_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: FLEET_OWNER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/instance']
            - name: FLEET_WORKSPACE_ROOT
              value: {{ .Values.workspaceRoot | quote }}
            # ── sandbox backend (#989) ──
            - name: FLEET_SANDBOX_BACKEND
              value: {{ .Values.sandbox.backend | quote }}
            - name: FLEET_SANDBOX_IMAGE
              value: {{ include "fleet.sandboxImage" . | quote }}
            - name: FLEET_SANDBOX_K8S_NAMESPACE
              value: {{ include "fleet.sandboxNamespace" . | quote }}
            - name: FLEET_SANDBOX_K8S_WORKSPACE_CLAIM
              value: {{ .Values.workspace.claimName | quote }}
            - name: FLEET_SANDBOX_K8S_NETWORK_POLICY
              value: {{ .Values.networkPolicies.denyAll.name | quote }}
            - name: FLEET_SANDBOX_K8S_OPEN_EGRESS_POLICY
              value: {{ .Values.networkPolicies.openEgress.name | quote }}
            {{- if .Values.networkPolicies.openEgress.acknowledgeUnrestricted }}
            - name: FLEET_SANDBOX_K8S_OPEN_EGRESS_ACKNOWLEDGED
              value: "true"
            {{- end }}
            {{- $podSA := .Values.sandbox.kubernetes.podServiceAccount }}
            {{- if and $podSA.name (or $podSA.create $podSA.external) }}
            # Only stamped when the SA will actually exist. create=false without
            # external=true used to still set this, and every pod create then
            # failed with `serviceaccount "fleet-sandbox" not found` — after a
            # green preflight, which never checks the SA.
            - name: FLEET_SANDBOX_K8S_SERVICE_ACCOUNT
              value: {{ $podSA.name | quote }}
            {{- end }}
            {{- with .Values.sandbox.kubernetes.imagePullSecret }}
            - name: FLEET_SANDBOX_K8S_IMAGE_PULL_SECRET
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.sandbox.kubernetes.runtimeClass }}
            - name: FLEET_SANDBOX_K8S_RUNTIME_CLASS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.sandbox.kubernetes.seccompProfile }}
            - name: FLEET_SANDBOX_K8S_SECCOMP_PROFILE
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.sandbox.kubernetes.bundleDocsInImage }}
            - name: FLEET_SANDBOX_K8S_BUNDLE_DOCS_IN_IMAGE
              value: "true"
            {{- end }}
            {{- with .Values.sandbox.kubernetes.nodeSelector }}
            - name: FLEET_SANDBOX_K8S_NODE_SELECTOR
              {{- /* %v, not %s: a label value written unquoted in YAML arrives
                     here as a bool or a number (fleet-runner: true), and %s
                     renders those as Go's error text — literally
                     "fleet-runner=%!s(bool=true)", which the apiserver then
                     rejects on every single sandbox pod. %v prints what the
                     operator meant, and Kubernetes label values are strings
                     anyway. */}}
              value: {{ $pairs := list }}{{- range $k, $v := . }}{{- $pairs = append $pairs (printf "%s=%v" $k $v) }}{{- end }}{{ join "," $pairs | quote }}
            {{- end }}
            {{- with .Values.sandbox.kubernetes.tolerations }}
            - name: FLEET_SANDBOX_K8S_TOLERATIONS
              value: {{ toJson . | quote }}
            {{- end }}
            - name: FLEET_SANDBOX_MEMORY
              value: {{ .Values.sandbox.memory | quote }}
            - name: FLEET_SANDBOX_CPUS
              value: {{ .Values.sandbox.cpus | quote }}
            - name: FLEET_SANDBOX_DISK_GB
              value: {{ .Values.sandbox.diskGB | quote }}
            {{- /* null means "let the engine derive"; 0 is a real value (no
                 warm pool), so the gate is set-ness, not positivity (#1264). */}}
            {{- if not (kindIs "invalid" .Values.sandbox.warmSize) }}
            - name: FLEET_SANDBOX_WARM_SIZE
              value: {{ .Values.sandbox.warmSize | int | quote }}
            {{- end }}
            {{- if .Values.postgres.enabled }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "fleet.fullname" . }}-postgres
                  key: url
            {{- end }}
            {{- range $k, $v := .Values.config.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- with .Values.config.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          volumeMounts:
            - name: workspace
              mountPath: {{ .Values.workspaceRoot }}
            - name: data
              mountPath: {{ .Values.dataDir }}
          # Each probe asks the endpoint that answers its own question. This is
          # ONE replica: a failing readiness probe takes the whole UI and API
          # offline, and a failing liveness probe restarts the pod, killing
          # every in-flight turn and task. Not /healthz: it answers 503 while
          # any model's circuit breaker is open (5 provider errors in 5
          # minutes), which a provider incident or a delisted model causes
          # while runs fall back and chat keeps working, and it does not
          # check the databases. It is for monitors (docs/DEPLOYMENT-KUBERNETES.md,
          # "Health probes"). cmd/fleet's TestChartProbesMatchTheirMeaning
          # renders this chart and sends each probe below to the chat listener
          # as fleet builds it.
          #
          # Startup: /livez answers once the listener is up, and boot order is
          # chat DB connect+migrate → sched DB connect+migrate → sandbox
          # preflight (up to 30s) → listeners, so it answers when boot has
          # finished. Without a startupProbe liveness starts counting during
          # migrations and kills the pod at ~t+120s. A large migrated database
          # then never finishes: every restart re-runs the migration from the
          # start and is killed again, and each kill risks leaving the migrator
          # dirty.
          startupProbe:
            httpGet:
              path: /livez
              port: chat
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: {{ .Values.startupProbeFailureThreshold }}
          # Readiness: /readyz is 503 while a database ping fails or while the
          # process drains on SIGTERM, and 207 (still ready) when only the
          # sandbox or disk check is degraded. The database pings use
          # connections of their own, so a busy pool does not fail them. Its
          # checks run in parallel, each cut off at 5s, so the timeout sits
          # above that: at the kubelet's 1s default a slow apiserver (the
          # sandbox check under the kubernetes backend) would fail the probe
          # although /readyz says ready. Six failures (a minute) ride out a
          # database failover or a network blip before the only replica
          # leaves the Service.
          readinessProbe:
            httpGet:
              path: /readyz
              port: chat
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          # Liveness: /livez is 200 while the process serves HTTP, including
          # while it drains, and depends on neither the databases nor any
          # model provider: a restart fixes neither, and it would cut a drain
          # short.
          livenessProbe:
            httpGet:
              path: /livez
              port: chat
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: {{ .Values.workspace.claimName }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.data.claimName }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
