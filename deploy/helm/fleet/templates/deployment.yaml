# The fleet control plane. ONE replica, forever: scheduler leases and the
# worker semaphore are single-owner (ADR-0004 / ADR-0049) — two replicas
# against one database pair is a correctness bug. There is deliberately no
# replicas knob; horizontal scale of work = more sandbox pods.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fleet.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleet.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate: a rolling update would run two control
    # planes side by side for the overlap window — the exact multi-writer
    # state the single-owner invariant forbids.
    type: Recreate
  selector:
    matchLabels:
      {{- include "fleet.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fleet.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "fleet.serviceAccountName" . }}
      # Must exceed FLEET_SHUTDOWN_GRACE_SECONDS (default 30) with headroom for
      # pool and DB teardown. Without it the kubelet SIGKILLs at its own 30s
      # default — the same number — so the documented drain had no slack and
      # raising the fleet knob for long turns silently did nothing.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fleet
          image: "{{ required "image.repository is required (you build the fleet image yourself — see docs/DEPLOYMENT-KUBERNETES.md)" .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: chat
              containerPort: 8080
            - name: orchestrator
              containerPort: 8000
          env:
            # Listeners bind all pod interfaces; the Service/Ingress is the
            # exposure boundary (the single-box default is loopback + Caddy).
            - name: FLEET_SERVER_ADDR
              value: "0.0.0.0:8080"
            - name: FLEET_ORCHESTRATOR_ADDR
              value: "0.0.0.0:8000"
            - name: FLEET_DATA_DIR
              value: {{ .Values.dataDir | quote }}
            # fleet defaults EMAIL_ATTACHMENT_DIR to ./data/attachments —
            # CWD-relative, and nothing derives it from FLEET_DATA_DIR. The
            # image has no WORKDIR, so cwd is /, and boot fails creating
            # /data/attachments/uploads as uid 1000 BEFORE the sandbox
            # preflight ever runs. deploy/fleet.service solves the same trap by
            # anchoring the CWD; a pod spec says it directly.
            - name: EMAIL_ATTACHMENT_DIR
              value: "{{ .Values.dataDir }}/attachments"
            # Cluster identity for the sandbox-pod orphan sweep. The UID names
            # this incarnation and the release name marks the owner, so a
            # restarted control plane can tell its predecessor's leaked pods
            # from a co-tenant release's live ones. Without these fleet falls
            # back to a pid heuristic that is meaningless across containers.
            - name: FLEET_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: FLEET_OWNER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/instance']
            - name: FLEET_WORKSPACE_ROOT
              value: {{ .Values.workspaceRoot | quote }}
            # ── sandbox backend (#989) ──
            - name: FLEET_SANDBOX_BACKEND
              value: {{ .Values.sandbox.backend | quote }}
            - name: FLEET_SANDBOX_IMAGE
              value: {{ required "sandbox.image is required (a registry ref sandbox nodes can pull)" .Values.sandbox.image | quote }}
            - name: FLEET_SANDBOX_K8S_NAMESPACE
              value: {{ include "fleet.sandboxNamespace" . | quote }}
            - name: FLEET_SANDBOX_K8S_WORKSPACE_CLAIM
              value: {{ .Values.workspace.claimName | quote }}
            - name: FLEET_SANDBOX_K8S_NETWORK_POLICY
              value: {{ .Values.networkPolicies.denyAll.name | quote }}
            {{- $podSA := .Values.sandbox.kubernetes.podServiceAccount }}
            {{- if and $podSA.name (or $podSA.create $podSA.external) }}
            # Only stamped when the SA will actually exist. create=false without
            # external=true used to still set this, and every pod create then
            # failed with `serviceaccount "fleet-sandbox" not found` — after a
            # green preflight, which never checks the SA.
            - name: FLEET_SANDBOX_K8S_SERVICE_ACCOUNT
              value: {{ $podSA.name | quote }}
            {{- end }}
            {{- with .Values.sandbox.kubernetes.imagePullSecret }}
            - name: FLEET_SANDBOX_K8S_IMAGE_PULL_SECRET
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.sandbox.kubernetes.runtimeClass }}
            - name: FLEET_SANDBOX_K8S_RUNTIME_CLASS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.sandbox.kubernetes.seccompProfile }}
            - name: FLEET_SANDBOX_K8S_SECCOMP_PROFILE
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.sandbox.kubernetes.bundleDocsInImage }}
            - name: FLEET_SANDBOX_K8S_BUNDLE_DOCS_IN_IMAGE
              value: "true"
            {{- end }}
            {{- with .Values.sandbox.kubernetes.nodeSelector }}
            - name: FLEET_SANDBOX_K8S_NODE_SELECTOR
              value: {{ $pairs := list }}{{- range $k, $v := . }}{{- $pairs = append $pairs (printf "%s=%s" $k $v) }}{{- end }}{{ join "," $pairs | quote }}
            {{- end }}
            {{- with .Values.sandbox.kubernetes.tolerations }}
            - name: FLEET_SANDBOX_K8S_TOLERATIONS
              value: {{ toJson . | quote }}
            {{- end }}
            - name: FLEET_SANDBOX_MEMORY
              value: {{ .Values.sandbox.memory | quote }}
            - name: FLEET_SANDBOX_CPUS
              value: {{ .Values.sandbox.cpus | quote }}
            - name: FLEET_SANDBOX_DISK_GB
              value: {{ .Values.sandbox.diskGB | quote }}
            {{- if gt (int .Values.sandbox.warmSize) 0 }}
            - name: FLEET_SANDBOX_WARM_SIZE
              value: {{ .Values.sandbox.warmSize | quote }}
            {{- end }}
            {{- if .Values.postgres.enabled }}
            - name: FLEET_CHAT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "fleet.fullname" . }}-postgres
                  key: chat-url
            - name: FLEET_SCHED_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "fleet.fullname" . }}-postgres
                  key: sched-url
            {{- end }}
            {{- range $k, $v := .Values.config.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- with .Values.config.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          volumeMounts:
            - name: workspace
              mountPath: {{ .Values.workspaceRoot }}
            - name: data
              mountPath: {{ .Values.dataDir }}
          # Boot order is: chat DB connect+migrate → sched DB connect+migrate →
          # sandbox preflight (up to 30s) → listeners. The listener comes up
          # LAST, so without a startupProbe liveness starts counting during
          # migrations and kills the pod at ~t+120s. A large migrated database
          # then never finishes: every restart re-runs the migration from the
          # start and is killed again, and each kill risks leaving the migrator
          # dirty.
          startupProbe:
            httpGet:
              path: /healthz
              port: chat
            periodSeconds: 10
            failureThreshold: {{ .Values.startupProbeFailureThreshold }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: chat
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: chat
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: {{ .Values.workspace.claimName }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.data.claimName }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
