{{- if .Values.postgres.enabled }}
# Optional in-cluster PostgreSQL for evaluation and small installs: one
# replica, one PVC, ONE database "fleet" (the chat and sched stores live in
# its schemas chat and sched, ADR-0098). Production should use a managed
# database and a DATABASE_URL in config.existingSecret.
{{- $legacy := include "fleet.postgresLegacyLayout" . }}
{{- /* The password never comes from values: reuse the existing Secret's
     (operator-pre-created or a prior install's) or generate a random one. */ -}}
{{- $password := "" }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-postgres" (include "fleet.fullname" .)) }}
{{- if $existing }}
{{- $password = index $existing.data "password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fleet.fullname" . }}-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleet.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ $password | quote }}
  {{- if $legacy }}
  # LEGACY-DB-LAYOUT: remove after consolidation — a pre-#2049 release's two databases.
  chat-url: "postgres://fleet:{{ $password }}@{{ include "fleet.postgresHost" . }}:5432/chat?sslmode=disable"
  sched-url: "postgres://fleet:{{ $password }}@{{ include "fleet.postgresHost" . }}:5432/sched?sslmode=disable"
  {{- else }}
  url: "postgres://fleet:{{ $password }}@{{ include "fleet.postgresHost" . }}:5432/fleet?sslmode=disable"
  {{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "fleet.fullname" . }}-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleet.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "fleet.postgresHost" . }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "fleet.name" . }}-postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "fleet.name" . }}-postgres
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      # runAsNonRoot/runAsUser and the container context below are what a
      # `restricted` Pod Security Standard namespace requires — the norm on the
      # clusters this chart targets, and without them this pod is rejected
      # outright at admission. 999 is the postgres uid in the official image.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          env:
            - name: POSTGRES_USER
              value: fleet
            # The image creates this database on an empty volume; fleet's stores
            # create their schemas in it. (A pre-#2049 volume already holds its
            # chat and sched databases; the image never re-initialises it.)
            - name: POSTGRES_DB
              value: fleet
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "fleet.fullname" . }}-postgres
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "fleet"]
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.postgres.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fleet.postgresHost" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleet.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: {{ include "fleet.name" . }}-postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: postgres
      port: 5432
{{- end }}
