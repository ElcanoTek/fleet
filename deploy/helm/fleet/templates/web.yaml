{{- if .Values.web.enabled }}
# Optional web tier (the Next.js app you build from web/). It talks to the
# control-plane Service; expose it via the Ingress below or your own.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fleet.fullname" . }}-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleet.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "fleet.name" . }}-web
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "fleet.name" . }}-web
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: {{ required "web.image is required when web.enabled" .Values.web.image }}
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
          env:
            - name: CHAT_SERVER_URL
              value: "http://{{ include "fleet.fullname" . }}:8080"
            - name: ORCHESTRATOR_URL
              value: "http://{{ include "fleet.fullname" . }}:8000"
            {{- range $k, $v := .Values.web.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- with .Values.config.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fleet.fullname" . }}-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleet.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "fleet.name" . }}-web
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.web.port }}
      targetPort: http
{{- end }}
