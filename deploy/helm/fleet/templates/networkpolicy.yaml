{{- if .Values.networkPolicies.denyAll.create }}
# The sealed-egress policy for sandbox pods labeled
# fleet.elcanotek.com/egress=none (lockdown turns, sealed scheduled runs).
# fleet's boot preflight REQUIRES this object to exist before it will start
# with the kubernetes backend. HONEST LIMIT: a NetworkPolicy object is
# enforced by the cluster CNI — on a CNI without NetworkPolicy support this
# object exists but seals nothing. Verify your CNI enforces it (the
# production checklist in docs/DEPLOYMENT-KUBERNETES.md shows how).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.networkPolicies.denyAll.name }}
  namespace: {{ include "fleet.sandboxNamespace" . }}
  labels:
    {{- include "fleet.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fleet-sandbox
      fleet.elcanotek.com/egress: "none"
  policyTypes: ["Ingress", "Egress"]
  # No ingress/egress rules: everything denied, both directions.
{{- end }}
{{- if .Values.networkPolicies.openEgress.create }}
---
# Egress shaping for OPEN sandbox pods: allow DNS + everything EXCEPT the
# blocked CIDRs (your cluster/node ranges), so `pip install` works but the
# sandbox cannot reach in-cluster Services. Ingress stays denied.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fleet.fullname" . }}-sandbox-open-egress
  namespace: {{ include "fleet.sandboxNamespace" . }}
  labels:
    {{- include "fleet.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fleet-sandbox
      fleet.elcanotek.com/egress: "open"
  policyTypes: ["Ingress", "Egress"]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            {{- with .Values.networkPolicies.openEgress.blockedCIDRs }}
            except:
              {{- toYaml . | nindent 14 }}
            {{- end }}
    # DNS (kube-dns lives inside the cluster CIDRs excluded above).
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
