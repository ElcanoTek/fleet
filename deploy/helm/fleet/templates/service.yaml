apiVersion: v1
kind: Service
metadata:
  name: {{ include "fleet.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleet.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "fleet.selectorLabels" . | nindent 4 }}
  ports:
    - name: chat
      port: 8080
      targetPort: chat
    - name: orchestrator
      port: 8000
      targetPort: orchestrator
