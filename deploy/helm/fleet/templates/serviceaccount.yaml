{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "fleet.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleet.labels" . | nindent 4 }}
{{- end }}
{{- if .Values.sandbox.kubernetes.podServiceAccount.create }}
---
# Identity stamped on sandbox pods so admission policies can key on it.
# No RBAC is bound to it and no token is ever mounted
# (automountServiceAccountToken=false on every sandbox pod).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.sandbox.kubernetes.podServiceAccount.name }}
  namespace: {{ include "fleet.sandboxNamespace" . }}
  labels:
    {{- include "fleet.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
