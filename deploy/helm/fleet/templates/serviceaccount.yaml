{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "fleet.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleet.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  # The cloud-identity hook (EKS IRSA's eks.amazonaws.com/role-arn, GKE
  # Workload Identity's iam.gke.io/gcp-service-account). The schema has always
  # accepted this key; nothing rendered it, so the annotation an operator set
  # to give the control plane a cloud identity was silently dropped.
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.sandbox.kubernetes.podServiceAccount.create }}
---
# Identity stamped on sandbox pods so admission policies can key on it.
# No RBAC is bound to it and no token is ever mounted
# (automountServiceAccountToken=false on every sandbox pod).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.sandbox.kubernetes.podServiceAccount.name }}
  namespace: {{ include "fleet.sandboxNamespace" . }}
  labels:
    {{- include "fleet.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
