# Installed by `fleet doctor` into /etc/systemd/journald.conf.d/ when the
# operator has set no SystemMaxUse of their own. journald's default ceiling is
# 10% of the filesystem (up to 4 GiB), which on a single-box install sits on
# the same volume as the databases, workspaces and sandbox image store; fleet's
# own logs need far less than that to cover the incidents anyone investigates.
# See docs/DOCTOR.md ("Disk hygiene").
[Journal]
SystemMaxUse=1G
