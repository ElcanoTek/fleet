# The CodeQL bundle .github/workflows/codeql.yml analyzes with, pinned by
# SHA-256 so the scan survives a GitHub release-asset outage: each Analyze leg
# restores its bundle from actions/cache (keyed by version + SHA-256), and only
# on a miss downloads it with retries and requires the hash below, then hands
# the local tarball to `github/codeql-action/init` through `tools:`.
#
#   action   the github/codeql-action commit the bundle was taken from — the
#            SHA every github/codeql-action/* step in codeql.yml is pinned to
#   version  that commit's src/defaults.json `cliVersion`: the bundle the
#            action would have downloaded itself (codeql-bundle-v<version>)
#   <lang>   SHA-256 of codeql-bundle-<lang>-linux64.tar.zst, the per-language
#            bundle the action picks for a single-language job on a hosted
#            runner (javascript-typescript's is "javascript")
#
# Dependabot bumps the action SHA; scripts/update-pins.sh (pins.tsv row
# CODEQL_BUNDLE, run monthly by pins-update.yml) reads the new commit's
# defaults.json, downloads each bundle, requires it to match the digest GitHub
# publishes for the asset, and rewrites this file. On a Dependabot PR that
# moves codeql-action, run `PINS_ONLY=CODEQL_BUNDLE scripts/update-pins.sh`
# and commit the result: scripts/check_codeql_bundle_test.go fails until the
# action line here names the same commit as the workflow.
