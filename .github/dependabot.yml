# Dependabot keeps fleet's three dependency surfaces patched: the Go module
# at the repo root, the Vite web app under /web, and the GitHub Actions
# used by the CI workflows. Minor + patch bumps are grouped per ecosystem so
# routine updates land as one PR instead of a flood; majors stay separate so
# breaking changes get their own review.
#
# Supply-chain cooldown: the gomod, npm and docker surfaces carry a `cooldown`
# block so Dependabot waits a few days before opening a PR for a freshly published
# release. This is a deliberate defense against fast typosquat / account-takeover
# attacks, where a compromised version is published and then yanked once the
# ecosystem flags it — by the time Dependabot proposes the bump, that window has
# usually closed. Every bump here is merged by a human (this repository has no
# auto-merge), so the cooldown is not load-bearing on its own; what it buys is
# that a reviewer is never looking at a release the ecosystem has not yet had a
# chance to scrutinize. Cooldown applies to version updates only, never to
# Dependabot security updates, so urgent CVE fixes are not delayed.
#
# Schema (key `cooldown`, integer `*-days` sub-keys; supported for gomod and npm;
# applies to version updates only):
#   https://docs.github.com/code-security/reference/supply-chain-security/dependabot-options-reference#cooldown--
version: 2

# ── Two things that decide whether you actually SEE an update ────────────────
#
# 1. THIS FILE IS READ FROM THE DEFAULT BRANCH (main). Since ADR-0062 main is
#    the only branch, so an edit here takes effect as soon as its PR merges.
#
# 2. Every entry targets main (the default; there is no `target-branch`), so
#    version updates and SECURITY updates go through the same full `CI gate`
#    on the same branch. The old split — version bumps soaking on a `dev`
#    integration branch while security updates went straight to main, un-
#    grouped and outside the `ignore` rules — is gone with `dev`. Note the
#    documented GitHub rule still holds: security updates ignore per-ecosystem
#    options (grouping, prefixes, `ignore`), so a CVE bump can still propose a
#    major that the version-update rules below would have held back.
#
# Cadence: `interval: monthly` for version updates, matching the dependency
# policy in AGENTS.md ("Dependencies and in-housed code"): a version bump is
# merged when it earns it (a commit we need, a CVE whose code path we reach),
# and once a month as a routine grouped refresh so drift never piles up into a
# big-bang upgrade. It used to be `daily`, which opened a PR for every release
# of anything we import, including releases that touch none of our code (chi
# v5.5.0 changed only `chi/middleware`, which fleet in-housed in #1778, so #1829
# was noise). Every merge to `main` is a release (ADR-0059), so daily bumps
# meant daily no-op releases or a queue of PRs left open on purpose. Monthly
# gives one PR per ecosystem per month, reviewed and merged in one sitting.
#
# What monthly does NOT delay:
#   * Dependabot SECURITY updates. They are raised when an advisory is
#     published, not on this schedule, and cooldown does not apply to them.
#   * Our own gates. govulncheck (call-graph aware) and `npm audit` gate every
#     PR and every push to `main`, so the first PR or push after an advisory
#     goes red, whatever Dependabot's calendar says. That red check is the
#     out-of-cycle trigger: bump the one dependency, in its own PR (#1821,
#     #1822 are the pattern). Between pushes, Go is also scanned daily
#     (govulncheck-scheduled.yml, non-blocking, Security tab); npm has no
#     scheduled lane, so a fresh npm advisory on a quiet week surfaces only
#     through Dependabot security updates. Those are a repository setting
#     (Settings → Code security), not something this file controls: keep them
#     on.
#   * A bump someone needs now. Bump it by hand in the PR that needs it.

# ── What Dependabot does NOT cover here (learned the hard way) ───────────────
# The node RUNTIME major is not a dependency any of the three surfaces below can
# see, so Dependabot never proposed the 22 → 24 move and never will:
#
#   * `github-actions` updates ACTION REFS (actions/setup-node@v6 → @v7) and
#     reusable-workflow refs. Anything passed as an INPUT to an action is a
#     workflow value, not a dependency: dependabot-core's github_actions parser
#     collects `uses:` strings and reads nothing else — not `with:`, not
#     `services.*.image`, not `env:`. That blind spot is a CLASS, not one bug:
#     `node-version:` sat pinned at '22' in six jobs across four files,
#     `go-version:` in five,
#     and `postgres:18` / the gitleaks + grype / golangci-lint binary pins are
#     in it today. The only defence is a single declaration point — node reads
#     web/.nvmrc, Go reads go.mod. Add new pins the same way.
#   * `npm` updates packages in a package.json. The node interpreter is not one
#     of them, and `engines.node` is a constraint Dependabot does not bump. The
#     Go equivalent: the `go` directive in go.mod is not updated either
#     (dependabot-core#9527), so the toolchain version is ours to move.
#   * Nothing covers the box's `nodejs` RPM — that is dnf's business, and
#     scripts/bootstrap.sh + scripts/doctor.sh now install the versioned
#     `nodejs<major>` package read from the same web/.nvmrc.
#
# So bumping node is a deliberate, human-initiated change: edit web/.nvmrc,
# and CI + bootstrap + doctor + update all follow. fleet tracks the LATEST node
# major — Current included (ADR-0078, which retired the earlier "Active or
# Maintenance LTS, never Current" rule). The move is not left to memory:
# node-latest-reminder.yml files an issue (with the declaration-point
# checklist) once nodejs.org publishes a major newer than web/.nvmrc.
#
# Why "latest" is safe here when "never Current" used to be the rule:
#
#   * The odd-major trap is gone. Through v25, odd majors never became LTS and
#     lived ~7 months. nodejs/Release's schedule.json now gives v27 an `alpha`
#     phase followed by a release in April 2027 that becomes LTS that October:
#     from 27 on, node ships one major a year and every one becomes LTS.
#   * The distro lag no longer strands a box. bootstrap.sh and doctor.sh still
#     prefer the VERSIONED dnf stream (nodejs<major>, nodejs<major>-npm), but
#     when Fedora has not packaged the new major yet (node 26 reached F45
#     only), they install the signed nodejs.org release instead — the node
#     analogue of GOTOOLCHAIN=auto. See fleet_node_tarball_install in
#     scripts/lib/node-version.sh.
#
# Deliberately NOT expressed as an `ignore` rule for major node bumps. Silencing
# them would remove a signal that a new line exists, which is precisely how the
# go.mod toolchain pin sat at 1.26.7 after 1.27.0 shipped (Dependabot does not
# touch the `go` directive either — see above). An @types/node major ahead of
# web/.nvmrc fails scripts/check_versions_test.go: take it as the cue to bump
# the runtime with it, in one PR.

updates:
  # Go module (go.mod / go.sum at the repo root).
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    # Wait before proposing freshly published releases (see header).
    cooldown:
      default-days: 7
      # 7, not 14 for a major: a long delay protects nothing here — a major is
      # reviewed by a human either way.
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 3
    commit-message:
      prefix: "deps(go)"
    groups:
      go-minor-patch:
        update-types:
          - minor
          - patch

  # Vite + React web app (web/package.json + web/package-lock.json).
  #
  # There are deliberately NO `ignore` entries here any more. Both of the ones
  # that used to live in this block — eslint majors and typescript majors —
  # existed for the same reason: eslint-config-next (from the Next.js era) pinned eslint plugins to
  # peer `eslint <=9`, and typescript-eslint refused TypeScript 7. Replacing
  # eslint with oxlint (a Rust linter with its own parser, no TypeScript API
  # dependency) removed the cause, so both bumps are now ordinary updates
  # Dependabot is free to propose. If a future ignore is added here, say which
  # upstream constraint forces it and what would let it be dropped.
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    # Same supply-chain cooldown as gomod (see header).
    cooldown:
      default-days: 7
      # 7, not 14 for a major: a long delay protects nothing here — a major is
      # reviewed by a human either way.
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 3
    commit-message:
      prefix: "deps(web)"
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  # Container base images.
  #
  # Podman-native `Containerfile` IS supported, despite a lot of stale advice
  # to the contrary: dependabot-core's docker file fetcher matches
  # DOCKER_REGEXP = /dockerfile|containerfile/i (verified against
  # dependabot-core main; the "support Containerfile" issue #6067 is closed).
  #
  # `directories` (not `directory`) because only the plural form takes a list.
  # Docker supports cooldown `default-days` only — the semver-*-days keys are
  # not supported for this ecosystem, so they are deliberately absent.
  #
  # Honest expectations for the one file covered:
  #   * config/default/sandbox/Containerfile — fedora-minimal:latest. A
  #     non-comparable tag short-circuits the update checker
  #     (`return true unless version_tag.comparable?`), so this will produce NO
  #     PRs at all. It is listed anyway so coverage already exists the day
  #     someone pins a digest, as that file's own header contemplates. (The
  #     node:24-slim Containerfile that did produce PRs left with
  #     scripts/rampart-service, ADR-0063.)
  - package-ecosystem: docker
    directories:
      - "/config/default/sandbox"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(image)"

  # GitHub Actions referenced by .github/workflows/*.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(actions)"
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
