# Node latest reminder — files an issue when node publishes a major newer than
# web/.nvmrc (ADR-0078; replaces the LTS reminder of #1300).
#
# WHY: the node RUNTIME major is invisible to Dependabot (see the note in
# .github/dependabot.yml — the npm ecosystem bumps packages, not the
# interpreter, and `engines.node` is a constraint it never moves). fleet tracks
# the LATEST node major for the web bundle it builds — in CI and release.yml
# only since ADR-0098; no box runs or builds with node — so "a new major exists"
# is the event that starts the bump, and nothing else would surface it: the
# same rot pattern scan-cron-alarm.yml exists for, a thing with no PR attached.
#
# Deliberately ONLINE, unlike the LTS reminder it replaces: "what is the newest
# release" has no date to hardcode. A fetch failure fails the job — a red
# scheduled run is visible; a reminder that quietly cannot see is not.
name: Node latest reminder

on:
  schedule:
    # Tuesday 11:00 UTC, weekly. Offset from the 07:00 canary, the 08:00 daily
    # govulncheck, the Monday 09:00 Grype scan and the Monday 10:00 CodeQL
    # re-scan, following the same don't-contend-for-runners reasoning those
    # files state. Weekly is plenty: each reminder dedupes on its open issue.
    - cron: '0 11 * * 2'
  workflow_dispatch: # manual re-check

permissions:
  contents: read # reads web/.nvmrc
  issues: write # files the reminder issues

jobs:
  remind:
    name: File an issue when node has a newer major
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the tree (web/.nvmrc is the node declaration point)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare web/.nvmrc against the newest node release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # The major before the first dot (a leading v dropped): `tr -dc`
          # would read a full-version .nvmrc like 26.10.0 as 26100.
          current="$(tr -d '[:space:]' < web/.nvmrc)"
          current="${current#v}"
          current="${current%%.*}"
          case "${current}" in
            ''|*[!0-9]*) echo "cannot read a node major from web/.nvmrc" >&2; exit 1 ;;
          esac
          # index.json is newest-first, but it also lists PRERELEASES: from
          # v27 on, each major has a public alpha phase months before it
          # ships (v27.0.0-alpha.0.0.0 topped the list on 2026-10-29 while
          # v26 was still the newest release, and filed #1903 by mistake).
          # ADR-0078 tracks the latest RELEASED major, so take the newest
          # entry shaped exactly vMAJOR.MINOR.PATCH — the same shape
          # a release (not a prerelease) has — and skip anything with a
          # prerelease suffix.
          latest="$(curl -fsSL --retry 3 https://nodejs.org/dist/index.json \
            | jq -r '[.[] | select(.version | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))][0].version // empty')"
          if [ -z "${latest}" ]; then
            echo "no release-shaped version in nodejs.org/dist/index.json; refusing to guess." >&2
            exit 1
          fi
          latest_major="$(printf '%s' "${latest#v}" | cut -d. -f1)"
          echo "web/.nvmrc major: ${current}; newest node release: ${latest}"
          if [ "${current}" -ge "${latest_major}" ]; then
            echo "already on the latest major; nothing to remind."
            exit 0
          fi

          # The title carries the MAJOR only: it is the dedupe key, and a patch
          # release while we are still behind must not file a second issue.
          title="Move the node major to ${latest_major}: web/.nvmrc is still ${current}"
          num="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$title\" in:title" --json number --jq '.[0].number // empty' || true)"
          if [ -n "$num" ]; then
            echo "reminder issue #${num} is already open; not duplicating."
            exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "Filed automatically by .github/workflows/node-latest-reminder.yml: node ${latest} was the newest release when this was filed, and web/.nvmrc still reads ${current}. fleet tracks the latest node major (ADR-0078).

          Bump every declaration point together (\`TestNodeMajorAgreesEverywhere\` in scripts/check_versions_test.go enforces the set):

          - [ ] \`web/.nvmrc\` → ${latest_major} (the single declaration point; CI and release.yml build the web bundle with it — boxes have no node, ADR-0098)
          - [ ] \`web/package.json\` \`engines.node\` → \`>=${latest_major}\`, and \`@types/node\` → \`^${latest_major}\` (+ \`npm install\` for the lockfile)
          - [ ] \`make test\` (\`TestNodeMajorAgreesEverywhere\` green) + \`make ci-web\`

          This issue dedupes by title: the weekly cron will not file another while this one is open."
