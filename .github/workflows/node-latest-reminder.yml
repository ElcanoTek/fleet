# Node latest reminder — files an issue when node publishes a major newer than
# web/.nvmrc, or when node's release-signing keys drift from the copy vendored
# in scripts/lib/ (ADR-0078; replaces the LTS reminder of #1300).
#
# WHY: the node RUNTIME major is invisible to Dependabot (see the note in
# .github/dependabot.yml — the npm ecosystem bumps packages, not the
# interpreter, and `engines.node` is a constraint it never moves). fleet tracks
# the LATEST node major, so "a new major exists" is the event that starts the
# bump, and nothing else would surface it: the same rot pattern
# scan-cron-alarm.yml exists for, a thing with no PR attached.
#
# The keyring half matters because the upstream fallback
# (fleet_node_tarball_install) verifies SHASUMS256.txt.asc against the VENDORED
# keys only. A releaser added upstream after our copy was taken signs a release
# we then refuse to install — fail-closed, which is right, but the fix
# (scripts/update-node-release-keys.sh) should land before a box needs it.
#
# Deliberately ONLINE, unlike the LTS reminder it replaces: "what is the newest
# release" has no date to hardcode. A fetch failure fails the job — a red
# scheduled run is visible; a reminder that quietly cannot see is not.
name: Node latest reminder

on:
  schedule:
    # Tuesday 11:00 UTC, weekly. Offset from the 07:00 canary, the 08:00 daily
    # govulncheck, the Monday 09:00 Grype scan and the Monday 10:00 CodeQL
    # re-scan, following the same don't-contend-for-runners reasoning those
    # files state. Weekly is plenty: each reminder dedupes on its open issue.
    - cron: '0 11 * * 2'
  workflow_dispatch: # manual re-check

permissions:
  contents: read # reads web/.nvmrc and scripts/lib/node-release-keys.list
  issues: write # files the reminder issues

jobs:
  remind:
    name: File an issue when node has a newer major or new release keys
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the tree (web/.nvmrc is the node declaration point)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare web/.nvmrc against the newest node release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          current="$(tr -dc '0-9' < web/.nvmrc)"
          # index.json is newest-first; the first entry is the latest release.
          latest="$(curl -fsSL --retry 3 https://nodejs.org/dist/index.json | jq -r '.[0].version')"
          latest_major="$(printf '%s' "${latest#v}" | cut -d. -f1)"
          echo "web/.nvmrc major: ${current}; newest node release: ${latest}"
          if [ "${current}" -ge "${latest_major}" ]; then
            echo "already on the latest major; nothing to remind."
            exit 0
          fi

          title="Move the node major to ${latest_major}: node ${latest} is out and web/.nvmrc is still ${current}"
          num="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$title\" in:title" --json number --jq '.[0].number // empty' || true)"
          if [ -n "$num" ]; then
            echo "reminder issue #${num} is already open; not duplicating."
            exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "Filed automatically by .github/workflows/node-latest-reminder.yml: node ${latest} is the newest release and web/.nvmrc still reads ${current}. fleet tracks the latest node major (ADR-0078).

          Bump every declaration point together (\`TestNodeMajorAgreesEverywhere\` in scripts/check_versions_test.go enforces the set):

          - [ ] \`web/.nvmrc\` → ${latest_major} (the single declaration point; CI, bootstrap, doctor, update all read it)
          - [ ] \`web/package.json\` \`engines.node\` → \`>=${latest_major}\`, and \`@types/node\` → \`^${latest_major}\` (+ \`npm install\` for the lockfile)
          - [ ] \`make test\` (\`TestNodeMajorAgreesEverywhere\` green) + \`make ci-web\`
          - [ ] Boxes: where Fedora has no \`nodejs${latest_major}\` stream yet, \`fleet update\` → \`doctor --node\` installs the signed nodejs.org build instead (scripts/lib/node-version.sh). Note it in the PR so operators know which boxes take that path.

          This issue dedupes by title: the weekly cron will not file another while this one is open."

      - name: Compare the vendored node release keys against nodejs/release-keys
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          upstream="$(curl -fsSL --retry 3 https://raw.githubusercontent.com/nodejs/release-keys/main/keys.list | sort -u)"
          vendored="$(sort -u scripts/lib/node-release-keys.list)"
          if [ "${upstream}" = "${vendored}" ]; then
            echo "vendored node release keys match nodejs/release-keys."
            exit 0
          fi
          echo "drift between scripts/lib/node-release-keys.list and nodejs/release-keys:"
          diff <(printf '%s\n' "${vendored}") <(printf '%s\n' "${upstream}") || true

          title="Refresh the vendored node release keys: nodejs/release-keys has changed"
          num="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$title\" in:title" --json number --jq '.[0].number // empty' || true)"
          if [ -n "$num" ]; then
            echo "reminder issue #${num} is already open; not duplicating."
            exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "Filed automatically by .github/workflows/node-latest-reminder.yml: nodejs/release-keys' keys.list no longer matches scripts/lib/node-release-keys.list.

          The upstream node fallback (fleet_node_tarball_install) trusts only the vendored keyring, so a release signed by a newly added releaser would be refused on boxes that need it.

          - [ ] Run \`scripts/update-node-release-keys.sh\` and review the diff (added/removed fingerprints should match nodejs/release-keys' history).
          - [ ] \`make test\`

          This issue dedupes by title: the weekly cron will not file another while this one is open."
