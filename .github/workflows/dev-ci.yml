# Fast CI lane for the `dev` integration branch — quick signal, not the full
# gate. ci.yml does not fire on dev at all (its push/pull_request triggers filter
# to main), so this file is dev's only automated signal.
#
# It runs BOTH on pushes to dev and on pull requests targeting dev. The PR
# trigger matters more than it looks: without it, a PR into dev was gated by
# nothing but CodeQL, so `dev` was the first thing to ever build a change —
# every Dependabot PR merged unverified, and a `next` 16.3.0 bump landed a
# TypeScript error that only surfaced at the dev→main promotion. A branch whose
# job is to integrate should not be where compilation is first attempted.
#
# What runs here: Go compile+vet+lint+test WITH a Postgres service (#723 — so the
# DB-gated suites, including the entire `fleet import` suite, are exercised on dev
# instead of first firing at the dev→main promotion; no -race lane), the Python
# lint (ruff), the web lint/test/build lane, the migration DDL lint, and the
# gitleaks secret scan (the no-secrets invariant is never weakened, on any
# branch).
#
# Still deliberately deferred to the dev→main PR's full ci.yml gate, because each
# is slow and none of them is what a routine change breaks: the -race lane,
# govulncheck, the Grype image scan, and both Playwright suites. The division of
# labour is "does it compile, lint, and pass tests" here; "is it safe to ship"
# there.
#
# CodeQL and Semgrep used to be on that deferred list and no longer are: both
# run IN this lane, as reusable-workflow calls wired into `Dev gate`, so a
# scanner finding blocks dev the same way a compile error does. See
# docs/SCANNING.md.
#
# `Dev gate` is the single aggregate job (same pattern as ci.yml's `CI gate`):
# when the dev branch is protected, require just that one check.
name: Dev CI (fast lane)

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

# Rapid successive pushes cancel the previous run — the point of this lane is
# feedback on the latest state, not a queue of stale results.
concurrency:
  # github.ref already differs between a PR (refs/pull/N/merge) and a push to dev
  # (refs/heads/dev); event_name is included so the two can never share a group
  # and cancel each other.
  group: dev-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go compile / vet / lint / test (fast)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Postgres service mirroring ci.yml's full-lane Go job (#723), so the
    # DB-gated suites — internal/store, internal/httpapi, internal/sched/*,
    # internal/runner, and the migration-critical `fleet import` tests — run on
    # every dev push instead of self-skipping until the dev→main promotion.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: fleet
          POSTGRES_PASSWORD: fleet
          POSTGRES_DB: fleet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fleet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Same DSN split as ci.yml: the chat and sched migration systems both use
      # a table named schema_migrations with INCOMPATIBLE schemas, so they MUST
      # point at separate databases. Both suites auto-migrate from an empty DB.
      FLEET_TEST_DATABASE_URL: postgres://fleet:fleet@localhost:5432/fleet_chat_test?sslmode=disable
      CHAT_TEST_DATABASE_URL: postgres://fleet:fleet@localhost:5432/fleet_chat_test?sslmode=disable
      DATABASE_URL: postgres://fleet:fleet@localhost:5432/fleet_sched_test?sslmode=disable
      FLEET_CLIENT_CONFIG_DIR: ${{ github.workspace }}/config/default

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Create test databases
        run: |
          PGPASSWORD=fleet psql -h localhost -U fleet -d fleet -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE fleet_chat_test;' \
            -c 'CREATE DATABASE fleet_sched_test;'

      - name: Compile
        run: go build ./...

      - name: go vet
        # Same tag as ci.yml so host.go (gated behind fleet_host_executor) is
        # vetted too — without it the sandbox package's host tests don't compile.
        run: go vet -tags fleet_host_executor ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Keep pinned in lockstep with ci.yml + .golangci.yml (see the note
          # there) so the fast lane and the full gate never disagree.
          version: v2.13.1
          only-new-issues: false

      - name: Disable podman so container sandbox tests self-skip
        # Same as ci.yml's Go job: the runner ships podman, and the sandbox
        # integration tests gate on exec.LookPath("podman") — absent → clean
        # t.Skip; present-without-the-image → t.Fatalf. Masking the binary makes
        # every container test skip; the real sandbox is exercised by the full
        # gate's e2e-live job on the dev→main PR.
        run: |
          if command -v podman >/dev/null 2>&1; then
            sudo mv "$(command -v podman)" "$(command -v podman).disabled"
          fi
          if command -v podman >/dev/null 2>&1; then
            echo "podman still on PATH at $(command -v podman); failing" >&2
            exit 1
          fi
          echo "podman is not on PATH (container sandbox tests will skip)"

      - name: Test (no -race; DB suites run against the Postgres service, #723)
        # Same tag as make test / ci.yml — internal/sandbox's host tests only
        # compile with it.
        # -count=1 defeats the build cache, matching ci.yml's three
        # invocations. setup-go restores ~/.cache/go-build, which stores test
        # RESULTS, and Go's cache key covers the binary, argv, env and files
        # opened — it cannot see the Postgres SERVICE CONTAINER these suites talk
        # to. Without it a DB-backed suite can print "ok (cached)" against a
        # server it never contacted, which is a green check over an unrun test.
        run: go test -p 1 -tags fleet_host_executor ./... -count=1

  python:
    name: Python lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Mirrors ci.yml's `python` job exactly, for the same reason the web lane was
    # added to this file: a change should not first be checked at the dev->main
    # promotion. ruff takes about a second, so there is no speed argument for
    # deferring it.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ruff
        env:
          # Keep pinned in lockstep with ci.yml (asserted by
          # scripts/check_versions_test.go) so the fast lane and the full gate
          # cannot disagree.
          RUFF_VERSION: '0.15.8'
        run: |
          set -euo pipefail
          python3 -m pip install --user --quiet "ruff==${RUFF_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          ruff --version

      - name: Lint
        run: ruff check --output-format github .

      - name: Formatting check
        # Mirrors ci.yml's gate; the tree is ruff-formatted, so a failure here
        # is a new unformatted file.
        run: ruff format --check .

  codeql:
    # Reusable-workflow call (see codeql.yml's header): puts the CodeQL jobs in
    # THIS graph so `Dev gate` blocks on them. A finding in the blocking band
    # fails the gate, so green means "no unwaived High-and-above finding", not
    # just "ran" — and on a `pull_request` event it means that of the DIFF only,
    # because CodeQL is diff-informed there (docs/adr/0048-codeql-severity-gating.md).
    # The tree-wide verdict comes from the push runs.
    # Unconditional (no docs-only detection in the fast lane, and Dev gate
    # demands strict success, so a skip would fail it); running on dev pushes
    # too also covers any direct push that bypassed a PR — and is the only event
    # shape that scans the whole tree.
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/codeql.yml

  semgrep:
    # Same mechanism: called here so `Dev gate` blocks on it.
    permissions:
      contents: read
    uses: ./.github/workflows/semgrep.yml

  web:
    name: Web lint / test / build (fast)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The lane dev was missing entirely. Nothing here ran web/ at all, so a
    # web-only change — every one of the npm Dependabot PRs — reached dev with no
    # build behind it. Commands mirror ci.yml's `web` job exactly so the fast lane
    # and the full gate cannot drift; the Playwright suites stay in the full gate.
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Read from web/.nvmrc so the deployed node major is declared once.
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Audit dependencies for known CVEs
        # Mirrors ci.yml's web job: lockfile-only, fails on any severity, runs
        # before the install so a vulnerable lockfile fails fast.
        run: npm audit --audit-level=low

      - name: Audit rampart-service dependencies for known CVEs
        working-directory: scripts/rampart-service
        run: npm audit --audit-level=low

      - name: Check whether the rampart security overrides are droppable
        # scripts/rampart-service/package.json force-patches sharp and adm-zip
        # because their parents have not released fixes. The day upstream does,
        # this FAILS with removal instructions — an override left behind after
        # upstream fixes itself silently pins Dependabot's updates down. A
        # registry flake skips with a notice (the audit above is the CVE gate).
        # Absolute path: this job's default working-directory is web/, which is
        # exactly how run 32579378165 caught the repo-relative form (exit 127).
        run: '"$GITHUB_WORKSPACE/scripts/check-npm-overrides.sh"'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Explicit type gate. `next build` also type-checks, but it runs LAST and
      # after the bundle work — so a plain type error used to surface minutes
      # into the job. oxlint is a syntax/semantic linter with no type awareness
      # (that is why it works on TS 7 at all), so the types need their own step
      # rather than riding along with lint as they did under
      # @typescript-eslint. On the native TS 7 compiler this costs ~2s.
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npx vitest run

      - name: Build
        # `next build` type-checks, which is the step that actually catches a
        # dependency bump breaking the app.
        run: npm run build

  helm:
    # Same chart lint as ci.yml (#989): lint + minimal and everything-on
    # renders. helm is preinstalled on the runner image.
    name: Helm chart lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint and render the fleet chart
        run: |
          set -euo pipefail
          helm version --short
          helm lint deploy/helm/fleet \
            --set image.repository=registry.invalid/fleet --set image.tag=ci \
            --set sandbox.image=registry.invalid/fleet-sandbox:ci
          helm template ci deploy/helm/fleet --namespace fleet \
            --set image.repository=registry.invalid/fleet --set image.tag=ci \
            --set sandbox.image=registry.invalid/fleet-sandbox:ci >/dev/null
          helm template ci deploy/helm/fleet --namespace fleet \
            --set image.repository=registry.invalid/fleet --set image.tag=ci \
            --set sandbox.image=registry.invalid/fleet-sandbox:ci \
            --set postgres.enabled=true \
            --set web.enabled=true --set web.image=registry.invalid/fleet-web:ci \
            --set ingress.enabled=true --set ingress.host=fleet.example.com \
            --set networkPolicies.openEgress.create=true \
            --set 'networkPolicies.openEgress.blockedCIDRs={10.0.0.0/8}' \
            --set sandbox.kubernetes.runtimeClass=kata >/dev/null

  migrations:
    name: Migration DDL lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the merge-base with origin/main resolves and the
          # linter can diff the branch's new/changed migration files.
          fetch-depth: 0

      - name: Lint changed migrations for dangerous DDL
        env:
          # On a PR, diff against the base commit the PR actually targets. On a
          # push, the pushed-from SHA. github.event.before is a push-only field —
          # left unset on a PR it would be empty, and the script's fallback
          # (merge-base with origin/main) would diff in every migration dev has
          # accumulated since main, flagging files the PR never touched.
          # Both are empty on edge cases (new branch / force-push), where the
          # script falls back to merge-base with origin/main, then a clean skip.
          MIGRATION_LINT_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: scripts/check-migrations.sh

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install gitleaks
        # Same pinned release + checksum as ci.yml — reproducible, can't be
        # silently changed by an upstream re-tag.
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        run: gitleaks dir . --redact --exit-code 1

  actions:
    # Lint the workflow files THEMSELVES. This repo carries ~3.1k lines of
    # workflow YAML that decide what every other gate on this list even runs,
    # and until now nothing checked them. The overlap with what already runs is
    # narrow and worth stating: Semgrep's `p/github-actions` pack meets this on
    # exactly ONE axis (actions referenced by a mutable tag) and CodeQL's
    # `actions` language on taint into a checkout. Neither parses `${{ }}`
    # expressions and neither shellchecks a `run:` block, which is where
    # actionlint earns its place — expression syntax and type errors, undefined
    # contexts, invalid `needs:` / `runs-on:` / cron, deprecated syntax, plus
    # shellcheck over the bash in every `run:`.
    #
    # The tree was at ZERO findings when this gate went in, so a failure here is
    # a regression rather than a backlog to wade through. Getting there took two
    # real fixes and one waiver: `run: "$GITHUB_WORKSPACE/..."` in both lanes
    # passed the path to the shell UNQUOTED (the YAML quotes are consumed by the
    # YAML parser, so the shell never saw them, despite the comment above the
    # line showing quoting was intended), and the SC2153 on `RESULTS` is an
    # `env:`-supplied name shellcheck cannot see, waived in-line with a reason.
    #
    # Deliberately NOT gated on the docs-only classifier. A change under
    # .github/workflows/ can never be docs-only by that allowlist anyway, but a
    # broken workflow is the one failure that can disarm every OTHER gate here,
    # so it runs unconditionally rather than depending on a classifier to let it.
    name: Workflow + shell lint (actionlint, shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install actionlint
        # Pinned release + checksum, the same contract as the gitleaks step
        # above: an upstream re-tag cannot silently change what this gate
        # enforces. Checksum verified against the release's own
        # actionlint_1.7.7_checksums.txt.
        env:
          ACTIONLINT_VERSION: '1.7.7'
          ACTIONLINT_SHA256: '023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757'
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSL -o "$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
          actionlint --version

      - name: Run actionlint
        # shellcheck ships preinstalled on the ubuntu-latest image, so actionlint
        # finds it and the `run:` blocks get checked too. ASSERT that rather than
        # assume it: a silently absent shellcheck drops half this job's coverage
        # while the job still reports green — the green-but-vacuous outcome this
        # repo keeps writing post-mortems about (see docs/SCANNING.md).
        run: |
          set -euo pipefail
          command -v shellcheck >/dev/null || {
            echo "::error::shellcheck is missing from the runner image; actionlint would silently skip every run: block."
            exit 1
          }
          shellcheck --version | head -2
          actionlint -color

      - name: Lint shell scripts (shellcheck)
        # The 18 tracked *.sh files are ~6.2k lines, and they are the DEPLOY
        # PATH, not helpers: scripts/update.sh, bootstrap.sh and doctor.sh are
        # what `fleet update` / `fleet bootstrap` actually run on an operator's
        # box. Go has golangci-lint, the web tier has oxlint + tsc, Python has
        # ruff — bash had nothing, which is the same gap docs/SCANNING.md used to
        # justify adding ruff, one language over. Several scripts already carry
        # hand-written `# shellcheck` directives, so it was being run by hand;
        # nothing made that reproducible.
        #
        # -S warning, and the tree is CLEAN at that level: the backlog was three
        # findings total (two SC2034, one SC2148), all fixed or annotated with a
        # reason in the same change that added this gate. Gating over an unfixed
        # backlog is how a gate becomes something people learn to ignore, so the
        # level was chosen by measuring, not by taste. The info tier (11 findings,
        # mostly style) stays off.
        run: |
          set -euo pipefail
          mapfile -t sh_files < <(git ls-files '*.sh')
          printf 'shellchecking %d files\n' "${#sh_files[@]}"
          # A vacuous pass is the failure mode this repo keeps writing up: if the
          # glob ever matches nothing, say so instead of reporting green.
          [ "${#sh_files[@]}" -gt 0 ] || { echo "::error::no shell scripts matched"; exit 1; }
          shellcheck -S warning "${sh_files[@]}"

  dev-gate:
    name: Dev gate
    # Aggregate check for branch protection: passes only when every fast-lane
    # job succeeded (mirrors ci.yml's `CI gate`).
    if: always()
    needs: [go, python, codeql, semgrep, web, migrations, gitleaks, helm, actions]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any fast-lane job failed
        # RESULTS via env, not interpolated into the run: block. The values are
        # drawn from {success, failure, cancelled, skipped} so nothing
        # attacker-controlled reaches the shell — but this is the exact shape the
        # two sites fixed in #1246 were fixed away FROM, and it breaks semgrep's
        # bash sub-parser, which silently costs coverage on this very file.
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          # RESULTS is supplied by the `env:` block above; shellcheck cannot see
          # that and reads the all-caps name as a typo for the local `results`.
          # shellcheck disable=SC2153
          results="$RESULTS"
          echo "job results: $results"
          for r in $results; do
            [ "$r" = "success" ] || { echo "a fast-lane job did not succeed"; exit 1; }
          done
