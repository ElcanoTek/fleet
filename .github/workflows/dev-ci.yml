# Fast CI lane for the `dev` integration branch — quick signal, not the full
# gate. ci.yml does not fire on dev at all (its push/pull_request triggers filter
# to main), so this file is dev's only automated signal.
#
# It runs BOTH on pushes to dev and on pull requests targeting dev. The PR
# trigger matters more than it looks: without it, a PR into dev was gated by
# nothing but CodeQL, so `dev` was the first thing to ever build a change —
# every Dependabot PR merged unverified, and a `next` 16.3.0 bump landed a
# TypeScript error that only surfaced at the dev→main promotion. A branch whose
# job is to integrate should not be where compilation is first attempted.
#
# What runs here: Go compile+vet+lint+test WITH a Postgres service (#723 — so the
# DB-gated suites, including the entire `fleet import` suite, are exercised on dev
# instead of first firing at the dev→main promotion; no -race lane), the web
# lint/test/build lane, the migration DDL lint, and the gitleaks secret scan (the
# no-secrets invariant is never weakened, on any branch).
#
# Still deliberately deferred to the dev→main PR's full ci.yml gate, because each
# is slow and none of them is what a routine change breaks: the -race lane,
# govulncheck, the Grype image scan, and both Playwright suites. The division of
# labour is "does it compile, lint, and pass tests" here; "is it safe to ship"
# there.
#
# CodeQL used to be on that deferred list and no longer is. It does not run in
# this file — it has its own workflow, .github/workflows/codeql.yml, whose
# `pull_request` trigger covers dev as well as main. So a PR into dev IS
# CodeQL-scanned; it just is not scanned by this lane. See docs/CODEQL.md.
#
# `Dev gate` is the single aggregate job (same pattern as ci.yml's `CI gate`):
# when the dev branch is protected, require just that one check.
name: Dev CI (fast lane)

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

# Rapid successive pushes cancel the previous run — the point of this lane is
# feedback on the latest state, not a queue of stale results.
concurrency:
  # github.ref already differs between a PR (refs/pull/N/merge) and a push to dev
  # (refs/heads/dev); event_name is included so the two can never share a group
  # and cancel each other.
  group: dev-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go compile / vet / lint / test (fast)
    runs-on: ubuntu-latest

    # Postgres service mirroring ci.yml's full-lane Go job (#723), so the
    # DB-gated suites — internal/store, internal/httpapi, internal/sched/*,
    # internal/runner, and the migration-critical `fleet import` tests — run on
    # every dev push instead of self-skipping until the dev→main promotion.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: fleet
          POSTGRES_PASSWORD: fleet
          POSTGRES_DB: fleet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fleet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Same DSN split as ci.yml: the chat and sched migration systems both use
      # a table named schema_migrations with INCOMPATIBLE schemas, so they MUST
      # point at separate databases. Both suites auto-migrate from an empty DB.
      FLEET_TEST_DATABASE_URL: postgres://fleet:fleet@localhost:5432/fleet_chat_test?sslmode=disable
      CHAT_TEST_DATABASE_URL: postgres://fleet:fleet@localhost:5432/fleet_chat_test?sslmode=disable
      DATABASE_URL: postgres://fleet:fleet@localhost:5432/fleet_sched_test?sslmode=disable
      FLEET_CLIENT_CONFIG_DIR: ${{ github.workspace }}/config/default

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Create test databases
        run: |
          PGPASSWORD=fleet psql -h localhost -U fleet -d fleet -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE fleet_chat_test;' \
            -c 'CREATE DATABASE fleet_sched_test;'

      - name: Compile
        run: go build ./...

      - name: go vet
        # Same tag as ci.yml so host.go (gated behind fleet_host_executor) is
        # vetted too — without it the sandbox package's host tests don't compile.
        run: go vet -tags fleet_host_executor ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Keep pinned in lockstep with ci.yml + .golangci.yml (see the note
          # there) so the fast lane and the full gate never disagree.
          version: v2.13.1
          only-new-issues: false

      - name: Disable podman so container sandbox tests self-skip
        # Same as ci.yml's Go job: the runner ships podman, and the sandbox
        # integration tests gate on exec.LookPath("podman") — absent → clean
        # t.Skip; present-without-the-image → t.Fatalf. Masking the binary makes
        # every container test skip; the real sandbox is exercised by the full
        # gate's e2e-live job on the dev→main PR.
        run: |
          if command -v podman >/dev/null 2>&1; then
            sudo mv "$(command -v podman)" "$(command -v podman).disabled"
          fi
          if command -v podman >/dev/null 2>&1; then
            echo "podman still on PATH at $(command -v podman); failing" >&2
            exit 1
          fi
          echo "podman is not on PATH (container sandbox tests will skip)"

      - name: Test (no -race; DB suites run against the Postgres service, #723)
        # Same tag as make test / ci.yml — internal/sandbox's host tests only
        # compile with it.
        run: go test -p 1 -tags fleet_host_executor ./...

  web:
    name: Web lint / test / build (fast)
    runs-on: ubuntu-latest
    # The lane dev was missing entirely. Nothing here ran web/ at all, so a
    # web-only change — every one of the npm Dependabot PRs — reached dev with no
    # build behind it. Commands mirror ci.yml's `web` job exactly so the fast lane
    # and the full gate cannot drift; the Playwright suites stay in the full gate.
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Read from web/.nvmrc so the deployed node major is declared once.
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Explicit type gate. `next build` also type-checks, but it runs LAST and
      # after the bundle work — so a plain type error used to surface minutes
      # into the job. oxlint is a syntax/semantic linter with no type awareness
      # (that is why it works on TS 7 at all), so the types need their own step
      # rather than riding along with lint as they did under
      # @typescript-eslint. On the native TS 7 compiler this costs ~2s.
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npx vitest run

      - name: Build
        # `next build` type-checks, which is the step that actually catches a
        # dependency bump breaking the app.
        run: npm run build

  migrations:
    name: Migration DDL lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so the merge-base with origin/main resolves and the
          # linter can diff the branch's new/changed migration files.
          fetch-depth: 0

      - name: Lint changed migrations for dangerous DDL
        env:
          # On a PR, diff against the base commit the PR actually targets. On a
          # push, the pushed-from SHA. github.event.before is a push-only field —
          # left unset on a PR it would be empty, and the script's fallback
          # (merge-base with origin/main) would diff in every migration dev has
          # accumulated since main, flagging files the PR never touched.
          # Both are empty on edge cases (new branch / force-push), where the
          # script falls back to merge-base with origin/main, then a clean skip.
          MIGRATION_LINT_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: scripts/check-migrations.sh

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install gitleaks
        # Same pinned release + checksum as ci.yml — reproducible, can't be
        # silently changed by an upstream re-tag.
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        run: gitleaks dir . --redact --exit-code 1

  dev-gate:
    name: Dev gate
    # Aggregate check for branch protection: passes only when every fast-lane
    # job succeeded (mirrors ci.yml's `CI gate`).
    if: always()
    needs: [go, web, migrations, gitleaks]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any fast-lane job failed
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "job results: $results"
          for r in $results; do
            [ "$r" = "success" ] || { echo "a fast-lane job did not succeed"; exit 1; }
          done
