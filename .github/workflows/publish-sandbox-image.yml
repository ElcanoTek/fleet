name: Publish sandbox image (reusable)

# Per-client sandbox image publisher (#195). This is the REGISTRY-PUBLISH
# opt-in path: a client config repo (e.g. acme-config) calls this reusable
# workflow to build its bundle's sandbox image, push it to GHCR, and open a PR
# setting `sandbox.image` in its manifest — after which fleet deployments
# `podman pull` the prebuilt image (clientconfig.Sandbox().ResolvedImageRef())
# instead of spending 5–15 minutes rebuilding ~1.3 GB on-box at deploy time.
#
# Deliberately NOT wired into fleet core CI: commit 24ce69f removed the
# core-CI dependency on a vendor-published registry image, and that stays
# removed — core CI builds the sandbox locally. The only triggers here are
# workflow_call (client repos) and a manual workflow_dispatch for ad-hoc
# publishes of the generic bundle.
#
# WHY THE ACTIONS PAGE SHOWS THIS WORKFLOW RED, AND WHY IT LOOKS ABANDONED
#
# Both have the same one-sentence answer: the last six runs are from June 2026,
# when this file still had a `push: branches: [main]` trigger and pushed
# ghcr.io/elcanotek/sandbox on every merge. Those runs all died at
# `podman push` with `denied: permission_denied: write_package` — the repo's
# GITHUB_TOKEN had no write access to that org-level package (an org package is
# not writable by a repo token until it is linked to the repo, or the org's
# package-creation policy allows it). The push trigger was then removed when
# #195/#705 turned this into a reusable per-client publisher, so nothing has
# fired since, and GitHub keeps showing the last recorded conclusion. The red is
# a 2026-06-23 tombstone, not a currently-broken pipeline: no fleet gate depends
# on this workflow, and core CI builds the sandbox locally. A successful manual
# dispatch (see below — pass update_manifest: false) is what clears the badge.
#
# So the perms requirement is on the CALLER, and it is not optional: publish to
# an image name under the caller repo's OWN owner (hence the
# ghcr.io/${{ github.repository_owner }}/... form in the contract below), and
# link the package to that repo the first time. A caller pushing into someone
# else's namespace gets the same permission_denied the June runs got.
#
# Caller contract (in a client config repo):
#
#   name: Publish sandbox image
#   on:
#     push:
#       branches: [main]
#       paths: ["sandbox/**"]
#     workflow_dispatch:
#   permissions:
#     contents: write        # manifest-update PR branch
#     packages: write        # GHCR push
#     pull-requests: write   # open the manifest-update PR
#   jobs:
#     publish:
#       uses: ElcanoTek/fleet/.github/workflows/publish-sandbox-image.yml@main
#       with:
#         image_name: ghcr.io/${{ github.repository_owner }}/fleet-sandbox-<client>
#
# The image is tagged twice: an immutable {git-sha} tag (what the manifest PR
# pins — safe to deploy) and a mutable :latest for convenience.

on:
  workflow_call:
    inputs:
      bundle_dir:
        description: >-
          Client bundle directory relative to the caller repo root (the dir
          holding manifest.yaml). Client config repos are the bundle, so the
          default is the repo root.
        type: string
        required: false
        default: "."
      image_name:
        description: "Full image name WITHOUT tag (e.g. ghcr.io/acme/fleet-sandbox-acme)"
        type: string
        required: true
      update_manifest:
        description: "Open a PR pinning sandbox.image to the pushed {sha} tag"
        type: boolean
        required: false
        default: true
      fleet_ref:
        description: "fleet ref to take scripts/build-sandbox-image.sh from"
        type: string
        required: false
        default: "main"
  workflow_dispatch:
    inputs:
      image_name:
        description: "Full image name WITHOUT tag (e.g. ghcr.io/elcanotek/fleet-sandbox)"
        type: string
        required: true
      bundle_dir:
        description: "Bundle dir relative to repo root"
        type: string
        required: false
        default: "config/default"
      update_manifest:
        # Declared here, and defaulting to false, on purpose. Undeclared inputs
        # read as null, and `null != false` is TRUE — so before this existed a
        # manual dispatch took the manifest-update path and opened a PR pinning
        # `sandbox.image` in fleet's OWN config/default/manifest.yaml. That
        # bundle is the build-on-box default (`image: "${FLEET_SANDBOX_IMAGE:-}"`)
        # and must stay unpinned; a manual dispatch is for getting an image into
        # GHCR, never for editing this repo.
        description: >-
          Open a PR pinning sandbox.image to the pushed {sha} tag. Leave false
          for an ad-hoc publish of the generic bundle — config/default must stay
          build-on-box.
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  packages: write
  pull-requests: write

# Two publishes of the same image must not overlap: they both move the mutable
# :latest tag, and the loser of the race decides what it ends up pointing at.
# Serialize per image name rather than per repo, so two different client bundles
# in the same repo can still publish concurrently.
concurrency:
  group: publish-sandbox-image-${{ inputs.image_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build + push ${{ inputs.image_name }}
    runs-on: ubuntu-latest
    env:
      BUNDLE_DIR: ${{ inputs.bundle_dir }}
      IMAGE: ${{ inputs.image_name }}
      # The immutable tag, hoisted so no `run:` body has to interpolate it.
      SHA: ${{ github.sha }}
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v7

      # The build script lives in fleet core; a client-config caller doesn't
      # have it. Checking it out into a subdir keeps ONE canonical builder
      # (same manifest parsing, same flags) instead of a drifting copy per repo.
      - name: Checkout fleet (build script)
        uses: actions/checkout@v7
        with:
          repository: ElcanoTek/fleet
          ref: ${{ inputs.fleet_ref || 'main' }}
          path: .fleet-core
          sparse-checkout: |
            scripts/build-sandbox-image.sh
          sparse-checkout-cone-mode: false

      - name: Ensure podman
        run: |
          command -v podman >/dev/null 2>&1 \
            || (sudo apt-get update -qq && sudo apt-get install -y -qq podman)
          podman --version

      - name: Log in to GHCR
        env:
          # Passed as env, not interpolated into the script: a ${{ }} expression
          # is spliced into the run body before the shell runs, which puts the
          # token on a command line and lets any metacharacter in a value be
          # executed. Reading "$GHCR_TOKEN" keeps it a value.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" \
            | podman login ghcr.io --username "$GHCR_USER" --password-stdin

      - name: Build sandbox image (:${{ github.sha }})
        run: |
          FLEET_CLIENT_CONFIG_DIR="$GITHUB_WORKSPACE/$BUNDLE_DIR" \
          IMAGE_NAME="$IMAGE" \
            bash .fleet-core/scripts/build-sandbox-image.sh "$SHA"

      - name: Tag :latest and push both tags
        run: |
          podman tag "$IMAGE:$SHA" "$IMAGE:latest"
          podman push "$IMAGE:$SHA"
          podman push "$IMAGE:latest"
          echo "Published:"
          echo "  $IMAGE:$SHA   (immutable — what the manifest pins)"
          echo "  $IMAGE:latest"

      - name: Update manifest sandbox.image
        # Both triggers declare update_manifest now, so a plain truth test is
        # enough — no `!= false` reading of a null.
        if: ${{ inputs.update_manifest }}
        run: |
          manifest="$BUNDLE_DIR/manifest.yaml"
          image_ref="$IMAGE:$SHA"
          # Rewrite the image: line under the sandbox: block only (same block
          # scoping as build-sandbox-image.sh's reader, but writing).
          python3 - "$manifest" "$image_ref" <<'PY'
          import re, sys

          path, ref = sys.argv[1], sys.argv[2]
          lines, in_sandbox, rewrote = [], False, False
          with open(path, encoding="utf-8") as f:
              for line in f:
                  if re.match(r"^sandbox:\s*$", line):
                      in_sandbox = True
                  elif re.match(r"^\S", line):
                      in_sandbox = False
                  if in_sandbox and re.match(r"^\s+image:", line):
                      line = re.sub(r"(^\s+image:\s*).*", rf'\g<1>"{ref}"', line)
                      rewrote = True
                  lines.append(line)
          if not rewrote:
              sys.exit(f"{path}: no image: line under the sandbox: block")
          with open(path, "w", encoding="utf-8") as f:
              f.writelines(lines)
          PY
          git diff -- "$manifest"

      - name: Open PR with manifest update
        if: ${{ inputs.update_manifest }}
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(sandbox): pin sandbox.image → ${{ github.sha }}"
          branch: bot/sandbox-image-${{ github.sha }}
          delete-branch: true
          title: "chore(sandbox): pin sandbox image → ${{ github.sha }}"
          body: |
            Automated sandbox image publish (fleet #195 reusable workflow).

            **Image**: `${{ inputs.image_name }}:${{ github.sha }}`
            **Workflow run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Merging pins `sandbox.image` so fleet deployments `podman pull` this
            prebuilt image instead of building on-box. The `${{ github.sha }}` tag is
            immutable; `:latest` was also pushed for convenience.
