name: Publish sandbox image (reusable)

# Per-client sandbox image publisher (#195). A client config repo (e.g.
# acme-config) calls this reusable workflow to build its bundle's sandbox image
# and push it to GHCR. Adopting a published image is then a deliberate
# deployment-side act: set FLEET_SANDBOX_IMAGE (or the manifest's
# sandbox.image) to the printed ref, and fleet `podman pull`s it
# (clientconfig.Sandbox().ResolvedImageRef()) instead of spending 5-15 minutes
# rebuilding ~1.3 GB on-box at deploy time.
#
# A registry image is also the only way a Kubernetes deployment can work at
# all: there is no "build on the box" when the box is a scheduled pod. Treat
# this workflow as the supply side of that future, which is why it survived the
# 2026-08-20 cleanup while the manifest-pinning half of it did not.
#
# Deliberately NOT wired into fleet core CI: commit 24ce69f removed the
# core-CI dependency on a vendor-published registry image, and that stays
# removed — core CI builds the sandbox locally. The only triggers here are
# workflow_call (client repos) and a manual workflow_dispatch for ad-hoc
# publishes of the generic bundle.
#
# WHAT THIS WORKFLOW USED TO ALSO DO, AND WHY IT NO LONGER DOES
#
# It used to end by rewriting the caller's manifest sandbox.image and opening a
# PR to pin it. That half never worked once: across 8 recorded runs in 6 repos
# between 2026-06 and 2026-08 it never created a single PR. The two runs that
# got that far (reklaim-config 2026-07-29, elcano-config 2026-08-06) both built
# and pushed their image successfully and then died on
#
#   ##[error]GitHub Actions is not permitted to create or approve pull requests.
#
# which is an org/repo Actions setting, not something a workflow can fix. It was
# also redundant: every bundle README already tells operators to adopt an image
# by setting FLEET_SANDBOX_IMAGE per box, and fleet's own config/default
# manifest must stay unpinned (build-on-box) regardless. So the pin-PR steps,
# the `update_manifest` input, the peter-evans/create-pull-request dependency,
# and the `contents: write` + `pull-requests: write` permissions they required
# are all gone. What remains is the half that demonstrably works.
#
# The earlier six fleet-repo runs (all 2026-06, all red) failed further upstream
# still, at `podman push`, with `denied: permission_denied: write_package`. They
# targeted ghcr.io/elcanotek/sandbox — a package that already existed at the org
# level and was NOT linked to the fleet repo, so the repo's GITHUB_TOKEN could
# not write it. (That package is still there and still publicly readable, which
# is how this was finally diagnosed.) That is why the caller contract below
# publishes under the CALLER's own owner.
#
# A BRAND-NEW image name does NOT need any manual setup: the pushing repo
# creates the package and it is linked automatically. Verified 2026-08-20 —
# ghcr.io/elcanotek/fleet-sandbox (from this repo) and
# ghcr.io/elcanotek/fleet-sandbox-example (from example-config) were both
# first-ever pushes of those names and both succeeded with no package settings
# touched. An earlier revision of this comment claimed the opposite; it was
# generalising from the June failures, which are the *pre-existing unlinked
# package* case, not the new-name case.
#
# PACKAGE VISIBILITY — measured, because the docs describe something else
#
# In this org, a package published here takes the VISIBILITY of the repo that
# published it:
#
#   ghcr.io/elcanotek/fleet-sandbox          public  (fleet is public)
#   ghcr.io/elcanotek/fleet-sandbox-example  public  (example-config is public)
#   ghcr.io/elcanotek/fleet-sandbox-elcano   private (elcano-config is private)
#   ghcr.io/elcanotek/fleet-sandbox-reklaim  private (reklaim-config is private)
#
# fleet-sandbox-example is the controlled case: a first-ever push of that name,
# anonymously pullable minutes later with nobody having opened the package
# settings. GitHub's own docs say the default visibility is private and that a
# linked package "inherits the access permissions (but not the visibility)" of
# its repository — that is NOT what these four packages did. An org-level
# setting may be responsible, so treat the above as observed behaviour in this
# org rather than a portable guarantee: after a first publish of a new name,
# CHECK the package's visibility instead of assuming either way.
#
# What this means in practice. The image contents carry nothing sensitive — no
# shipped Containerfile has a COPY or ADD, so every one of these is Fedora plus
# RPMs. What a public package would disclose is its NAME: a public
# fleet-sandbox-<client> tells the world that client is a customer. Private
# bundle repo -> private package handles that without anyone configuring it, but
# it is worth verifying for a new bundle rather than trusted blindly.
#
# Caller contract (in a client config repo):
#
#   name: Publish sandbox image
#   on:
#     push:
#       branches: [main]
#       paths: ["sandbox/**"]
#     workflow_dispatch:
#   permissions:
#     contents: read         # checkout (a reusable workflow's permissions must
#     packages: write        # be a SUBSET of its caller's, so both are granted
#                            # here even though only the push is the point)
#   jobs:
#     publish:
#       uses: ElcanoTek/fleet/.github/workflows/publish-sandbox-image.yml@main
#
# NO image_name NEEDED. It is derived from the bundle itself — see "WHERE THE
# IMAGE NAME COMES FROM" below. Pass it only to publish somewhere other than
# GHCR under the caller's own owner (e.g. an ECR ref, per docs/EKS-DEPLOYMENT.md).
#
# WHERE THE IMAGE NAME COMES FROM
#
# The bundle has no registry destination in it, which is why this used to demand
# one. It carries two sandbox refs and neither is pushable:
#
#   sandbox.tag    localhost/fleet-sandbox-<client>:latest — a LOCAL podman tag;
#                  `podman push localhost/...` is not a thing.
#   sandbox.image  "${FLEET_SANDBOX_IMAGE:-}" — the CONSUME ref, deliberately
#                  empty. That emptiness IS the build-on-box default, and
#                  config/default must stay that way.
#
# But the one client-specific token is right there in sandbox.tag, so the
# destination is derivable: basename of the manifest tag, minus its :tag, under
# the caller's own owner. Verified byte-identical to what all five client
# bundles used to hand-write.
#
# Deriving it is not just less typing. The hand-written string is exactly how
# omnicom-config came to publish to `fleet-sandbox-example` — a copy-paste from
# the example-config fork that would have overwritten the public template's
# :latest with Omnicom's image the first time it fired. A derived name cannot
# express that bug.
#
# The name is also lowercased. OCI repository names must be lowercase, and
# `github.repository_owner` preserves the account's own casing (ElcanoTek), so
# an un-normalized ghcr.io/${{ github.repository_owner }}/... is an INVALID
# reference that podman rejects before it ever reaches the registry. The
# contract above recommended exactly that expression, and the callers only
# worked because they happened to hardcode a lowercase owner.
#
# The image is tagged twice: an immutable {git-sha} tag (what a deployment
# should consume) and a mutable :latest for convenience. Both the sha tag and
# the manifest digest are exposed as workflow outputs so a future K8s deploy
# workflow can consume an exact ref without re-deriving it.

on:
  workflow_call:
    inputs:
      bundle_dir:
        description: >-
          Client bundle directory relative to the caller repo root (the dir
          holding manifest.yaml). Client config repos are the bundle, so the
          default is the repo root.
        type: string
        required: false
        default: "."
      image_name:
        description: >-
          Override the publish destination, WITHOUT a tag (e.g.
          <acct>.dkr.ecr.<region>.amazonaws.com/fleet-sandbox-acme). Leave unset
          to derive ghcr.io/<owner>/<basename of the manifest's sandbox.tag>.
        type: string
        required: false
        default: ""
      fleet_ref:
        description: "fleet ref to take scripts/build-sandbox-image.sh from"
        type: string
        required: false
        default: "main"
    outputs:
      image_ref:
        description: "The immutable {name}:{sha} ref that was pushed"
        value: ${{ jobs.publish.outputs.image_ref }}
      image_digest:
        description: "The pushed manifest digest (sha256:...), or empty if unavailable"
        value: ${{ jobs.publish.outputs.image_digest }}
  workflow_dispatch:
    inputs:
      image_name:
        description: >-
          Override the publish destination, WITHOUT a tag. Leave blank to derive
          ghcr.io/<owner>/<basename of the manifest's sandbox.tag> — for the
          default bundle_dir that is ghcr.io/<owner>/fleet-sandbox.
        type: string
        required: false
        default: ""
      bundle_dir:
        description: "Bundle dir relative to repo root"
        type: string
        required: false
        default: "config/default"

# Only GHCR push. This workflow no longer writes to the caller's repo: it does
# not create a branch, a commit, or a PR, so contents/pull-requests write are
# not requested. Keep it that way — a publisher that can rewrite its caller's
# manifest is how config/default nearly got pinned by an ad-hoc dispatch.
permissions:
  contents: read
  packages: write

# Two publishes of the same image must not overlap: they both move the mutable
# :latest tag, and the loser of the race decides what it ends up pointing at.
# Keyed on repo + bundle_dir rather than image_name, because image_name is now
# optional and an empty one would collapse every publish into a single group.
# This preserves the original intent — the derived name is a function of exactly
# these two things, so two different bundles in the same repo still publish
# concurrently while two pushes of the same bundle serialize.
concurrency:
  group: publish-sandbox-image-${{ github.repository }}-${{ inputs.bundle_dir }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build + push sandbox image
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.push.outputs.image_ref }}
      image_digest: ${{ steps.push.outputs.image_digest }}
    env:
      BUNDLE_DIR: ${{ inputs.bundle_dir }}
      # IMAGE is exported by the "Resolve the publish destination" step below,
      # since it may be derived from the bundle rather than passed in.
      # The immutable tag, hoisted so no `run:` body has to interpolate it.
      SHA: ${{ github.sha }}
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v7

      # The build script lives in fleet core; a client-config caller doesn't
      # have it. Checking it out into a subdir keeps ONE canonical builder
      # (same manifest parsing, same flags) instead of a drifting copy per repo.
      - name: Checkout fleet (build script)
        uses: actions/checkout@v7
        with:
          repository: ElcanoTek/fleet
          ref: ${{ inputs.fleet_ref || 'main' }}
          path: .fleet-core
          sparse-checkout: |
            scripts/build-sandbox-image.sh
          sparse-checkout-cone-mode: false

      - name: Ensure podman
        run: |
          command -v podman >/dev/null 2>&1 \
            || (sudo apt-get update -qq && sudo apt-get install -y -qq podman)
          podman --version

      # Inputs are read from env, never interpolated into the script body: a
      # ${{ }} expression is spliced in before the shell runs, so a value
      # containing shell metacharacters would execute.
      - name: Resolve the publish destination
        env:
          INPUT_IMAGE_NAME: ${{ inputs.image_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          name="${INPUT_IMAGE_NAME:-}"
          if [ -z "$name" ]; then
            # --print-tag reads the manifest only (no podman, no build) and
            # yields the bundle's LOCAL tag, e.g.
            # localhost/fleet-sandbox-elcano:latest. Its basename is the one
            # client-specific token we need.
            tag="$(FLEET_CLIENT_CONFIG_DIR="$GITHUB_WORKSPACE/$BUNDLE_DIR" \
              bash .fleet-core/scripts/build-sandbox-image.sh --print-tag)"
            base="${tag##*/}"   # drop any registry / namespace prefix
            base="${base%:*}"   # drop the :tag
            if [ -z "$base" ]; then
              echo "::error::cannot derive an image name: manifest sandbox.tag is '$tag'"
              exit 1
            fi
            name="ghcr.io/$OWNER/$base"
            echo "Derived from $BUNDLE_DIR/manifest.yaml sandbox.tag ($tag)."
          else
            echo "Using the caller's explicit image_name override."
          fi

          # OCI repository names must be lowercase. github.repository_owner keeps
          # the account's own casing, so an owner like "ElcanoTek" yields an
          # invalid reference that podman rejects before the registry sees it.
          name="$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]')"

          # Fail closed on anything that is not a plausible tagless ref, rather
          # than discovering it at `podman push`. A ':' here means someone
          # included a tag, which would collide with the {sha}/:latest we add.
          case "$name" in
            ""|*[!a-z0-9./_-]*|*:*)
              echo "::error::implausible image name '$name' (expected a tagless ref)"
              exit 1
              ;;
          esac

          echo "IMAGE=$name" >> "$GITHUB_ENV"
          echo "Publishing to: $name"

      - name: Log in to GHCR
        env:
          # Passed as env, not interpolated into the script: a ${{ }} expression
          # is spliced into the run body before the shell runs, which puts the
          # token on a command line and lets any metacharacter in a value be
          # executed. Reading "$GHCR_TOKEN" keeps it a value.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" \
            | podman login ghcr.io --username "$GHCR_USER" --password-stdin

      - name: Build sandbox image (:${{ github.sha }})
        run: |
          FLEET_CLIENT_CONFIG_DIR="$GITHUB_WORKSPACE/$BUNDLE_DIR" \
          IMAGE_NAME="$IMAGE" \
            bash .fleet-core/scripts/build-sandbox-image.sh "$SHA"

      - name: Tag :latest and push both tags
        id: push
        run: |
          podman tag "$IMAGE:$SHA" "$IMAGE:latest"
          podman push "$IMAGE:$SHA"
          podman push "$IMAGE:latest"

          # Best-effort: the manifest digest is the only truly immutable ref, and
          # it is what a Kubernetes manifest should carry. A podman version that
          # does not report it must not fail an otherwise-good publish.
          digest="$(podman image inspect --format '{{.Digest}}' "$IMAGE:$SHA" 2>/dev/null || true)"
          {
            echo "image_ref=$IMAGE:$SHA"
            echo "image_digest=$digest"
          } >> "$GITHUB_OUTPUT"

          # This summary is how a publish communicates now that it no longer
          # opens a PR. Adoption is deliberate and deployment-side.
          {
            echo "### Sandbox image published"
            echo
            echo '| | |'
            echo '|---|---|'
            echo "| Immutable tag | \`$IMAGE:$SHA\` |"
            echo "| Mutable tag | \`$IMAGE:latest\` |"
            echo "| Digest | \`${digest:-unavailable}\` |"
            echo
            echo "To adopt it, set on each deployment (or in the bundle's manifest \`sandbox.image\`):"
            echo
            echo '```sh'
            echo "FLEET_SANDBOX_IMAGE=$IMAGE:$SHA"
            echo '```'
            echo
            echo "Leaving it unset keeps the build-on-box default."
          } >> "$GITHUB_STEP_SUMMARY"
