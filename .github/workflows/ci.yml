name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual runs. Exists because pull_request webhook deliveries were observed
  # being dropped during a GitHub incident (2026-08-26, Actions + Pull
  # Requests degraded): a dev->main promotion PR sat with NO way to produce
  # the required "CI gate" check — its opened event was lost and five
  # subsequent synchronize events never spawned a run. A dispatch on the PR's
  # head ref runs the identical suite on the identical head SHA, so the
  # name-matched required check is satisfied honestly; the docs-only
  # classifier treats an un-diffable event as "run everything" (fail-safe),
  # so a dispatched run can never skip more than an event-triggered one.
  workflow_dispatch:

permissions:
  # Least privilege at the workflow level, so nothing is granted to a job that
  # did not ask. `pull-requests: read` used to sit here for
  # golangci-lint-action's only-new-issues — which is now explicitly `false`
  # (see the note at that step), so the scope had no consumer while still
  # reaching every job that does not override it, including web / playwright /
  # e2e-live, which npm-install and run thousands of third-party packages.
  contents: read

# Rapid successive pushes to the SAME pull request cancel the previous run.
# `dev-ci.yml` has had this since it was written; this lane — the expensive one,
# carrying mocked Playwright, the live e2e against a real backend + rootless
# sandbox, and the Grype image scan — did not, so a branch pushed three times in
# a minute queued three full suites and the two stale ones still had to finish
# before the interesting one started.
#
# `cancel-in-progress` is deliberately NOT blanket-true: a push to `main` is a
# merge that already happened, and its run is the tree-wide verdict the
# diff-informed PR runs cannot give (see docs/SCANNING.md on why a
# `pull_request` CodeQL run certifies a diff, not a tree). Cancelling that to
# make room for the next merge would throw away the only full-tree result. So
# cancellation is scoped to `pull_request`, where the superseding run covers
# strictly newer code.
concurrency:
  # github.ref already differs between a PR (refs/pull/N/merge) and a push to
  # main (refs/heads/main); event_name is included so the two can never share a
  # group and cancel each other.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Classify the PR (or push) as docs-only or not. The heavy jobs below gate on
    # this so a documentation-only change skips the ~1.3GB sandbox build and the
    # rest of the compile/test/e2e suite. FAIL-SAFE: docs_only is true only when
    # EVERY changed file matches the documentation allowlist; a single non-doc file
    # forces the full suite, and anything we can't classify also runs everything.
    # The gitleaks secret scan is intentionally NOT gated on this — a secret can be
    # pasted into a markdown file, so it runs on every change.
    name: Detect docs-only changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the base/head (or before/after) SHAs are present to diff.
          fetch-depth: 0

      - name: Detect whether every changed file is documentation
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              range="${PR_BASE_SHA}...${PR_HEAD_SHA}" ;;
            push)
              # New branch / unknown base (all-zero SHA): can't diff, run everything.
              if [ -z "${PUSH_BEFORE}" ] || [ "${PUSH_BEFORE}" = "0000000000000000000000000000000000000000" ]; then
                echo "No usable base SHA for this push; running the full suite."
                echo "docs_only=false" >> "$GITHUB_OUTPUT"; exit 0
              fi
              range="${PUSH_BEFORE}...${PUSH_AFTER}" ;;
            *)
              echo "Event '$EVENT_NAME' is not gated; running the full suite."
              echo "docs_only=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac

          files="$(git diff --name-only "$range")"
          echo "Changed files in ${range}:"
          printf '%s\n' "$files"

          # FAIL-SAFE on an empty diff. docs_only is initialised true and only
          # ever cleared inside the loop below, so an empty $files would classify
          # as docs-only and skip the whole suite — and `ci-gate` trusts exactly
          # that value when it decides a `skipped` job is acceptable. An empty
          # range is not evidence that only prose changed; it is the absence of
          # evidence (a force-push can collapse the three-dot range), so run
          # everything.
          if [ -z "$(printf '%s' "$files" | tr -d '[:space:]')" ]; then
            echo "empty diff for ${range}; refusing to classify as docs-only."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          docs_only=true
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            # `*` in a shell case pattern spans '/', so these match at any depth.
            #
            # This list is deliberately an ALLOW-LIST of prose, and deliberately
            # NOT a bare `*.md` or `docs/*`. Both of those were wrong, and both
            # made `CI gate` report green over a suite that never ran:
            #
            #   - `*.md` matched at any depth, so it swallowed 15 markdown files
            #     that are COMPILED PRODUCT CONTENT — every
            #     internal/clientconfig/builtin_skills/*/SKILL.md (pulled in by
            #     `//go:embed all:builtin_skills` and asserted by
            #     builtin_skills_browserbase_test.go, clientconfig_test.go and
            #     validate_config_test.go), plus config/default/system_prompts/
            #     {default,chat}.md, which ARE the shipped system prompts that
            #     docs/PROMPT-CACHE-CONTRACT.md exists to protect.
            #   - `docs/*` swallowed docs/openapi.yaml, which
            #     cmd/fleet/openapi_drift_test.go asserts against the Go models,
            #     and docs/scripts/*.py + docs/img/*.py, which are inside the
            #     ruff, Semgrep p/python and CodeQL python scopes.
            #
            # So a PR touching only a shipped prompt or the OpenAPI spec skipped
            # the very tests that validate it. Keep this list prose-only; when in
            # doubt, leave a path OFF it and run the full suite.
            case "$f" in
              docs/*.md|LICENSE) : ;;
              README.md|CHANGELOG.md|CONTRIBUTING.md|SECURITY.md) : ;;
              CODE_OF_CONDUCT.md|AGENTS.md|CLAUDE.md|ONBOARDING.md) : ;;
              *) docs_only=false ;;
            esac
          done <<< "$files"

          echo "docs_only=${docs_only}"
          echo "docs_only=${docs_only}" >> "$GITHUB_OUTPUT"

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install gitleaks
        # Pin a specific gitleaks release and verify its checksum so the gate is
        # reproducible and can't be silently changed by an upstream re-tag. The
        # scan reads .gitleaks.toml (full default ruleset + path allowlist) and
        # .gitleaksignore (fingerprints of confirmed FAKE test fixtures) from the
        # repo root automatically.
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        # Fails the job (exit 1) on any new/un-ignored secret; passes clean on the
        # current tree. A fresh checkout has no build artifacts, so the path
        # allowlist in .gitleaks.toml is just local-run robustness.
        run: gitleaks dir . --redact --exit-code 1

  actions:
    # Lint the workflow files THEMSELVES. This repo carries ~3.1k lines of
    # workflow YAML that decide what every other gate on this list even runs,
    # and until now nothing checked them. The overlap with what already runs is
    # narrow and worth stating: Semgrep's `p/github-actions` pack meets this on
    # exactly ONE axis (actions referenced by a mutable tag) and CodeQL's
    # `actions` language on taint into a checkout. Neither parses `${{ }}`
    # expressions and neither shellchecks a `run:` block, which is where
    # actionlint earns its place — expression syntax and type errors, undefined
    # contexts, invalid `needs:` / `runs-on:` / cron, deprecated syntax, plus
    # shellcheck over the bash in every `run:`.
    #
    # The tree was at ZERO findings when this gate went in, so a failure here is
    # a regression rather than a backlog to wade through. Getting there took two
    # real fixes and one waiver: `run: "$GITHUB_WORKSPACE/..."` in both lanes
    # passed the path to the shell UNQUOTED (the YAML quotes are consumed by the
    # YAML parser, so the shell never saw them, despite the comment above the
    # line showing quoting was intended), and the SC2153 on `RESULTS` is an
    # `env:`-supplied name shellcheck cannot see, waived in-line with a reason.
    #
    # Deliberately NOT gated on the docs-only classifier. A change under
    # .github/workflows/ can never be docs-only by that allowlist anyway, but a
    # broken workflow is the one failure that can disarm every OTHER gate here,
    # so it runs unconditionally rather than depending on a classifier to let it.
    name: Workflow + shell lint (actionlint, shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install actionlint
        # Pinned release + checksum, the same contract as the gitleaks step
        # above: an upstream re-tag cannot silently change what this gate
        # enforces. Checksum verified against the release's own
        # actionlint_1.7.7_checksums.txt.
        env:
          ACTIONLINT_VERSION: '1.7.7'
          ACTIONLINT_SHA256: '023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757'
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSL -o "$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
          actionlint --version

      - name: Run actionlint
        # shellcheck ships preinstalled on the ubuntu-latest image, so actionlint
        # finds it and the `run:` blocks get checked too. ASSERT that rather than
        # assume it: a silently absent shellcheck drops half this job's coverage
        # while the job still reports green — the green-but-vacuous outcome this
        # repo keeps writing post-mortems about (see docs/SCANNING.md).
        run: |
          set -euo pipefail
          command -v shellcheck >/dev/null || {
            echo "::error::shellcheck is missing from the runner image; actionlint would silently skip every run: block."
            exit 1
          }
          shellcheck --version | head -2
          actionlint -color

      - name: Lint shell scripts (shellcheck)
        # The 18 tracked *.sh files are ~6.2k lines, and they are the DEPLOY
        # PATH, not helpers: scripts/update.sh, bootstrap.sh and doctor.sh are
        # what `fleet update` / `fleet bootstrap` actually run on an operator's
        # box. Go has golangci-lint, the web tier has oxlint + tsc, Python has
        # ruff — bash had nothing, which is the same gap docs/SCANNING.md used to
        # justify adding ruff, one language over. Several scripts already carry
        # hand-written `# shellcheck` directives, so it was being run by hand;
        # nothing made that reproducible.
        #
        # -S warning, and the tree is CLEAN at that level: the backlog was three
        # findings total (two SC2034, one SC2148), all fixed or annotated with a
        # reason in the same change that added this gate. Gating over an unfixed
        # backlog is how a gate becomes something people learn to ignore, so the
        # level was chosen by measuring, not by taste. The info tier (11 findings,
        # mostly style) stays off.
        run: |
          set -euo pipefail
          mapfile -t sh_files < <(git ls-files '*.sh')
          printf 'shellchecking %d files\n' "${#sh_files[@]}"
          # A vacuous pass is the failure mode this repo keeps writing up: if the
          # glob ever matches nothing, say so instead of reporting green.
          [ "${#sh_files[@]}" -gt 0 ] || { echo "::error::no shell scripts matched"; exit 1; }
          shellcheck -S warning "${sh_files[@]}"

  helm:
    # Lint + render the fleet Helm chart (#989) so a values/template drift
    # fails here, not at an operator's install. Fast (<15s) and not gated on
    # the docs-only classifier — chart files are product, not prose. helm
    # ships preinstalled on the ubuntu-latest runner image.
    name: Helm chart lint (#989)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint and render the fleet chart
        run: |
          set -euo pipefail
          helm version --short
          # --strict so a chart-level warning is a failure, not a note.
          helm lint --strict deploy/helm/fleet \
            --set image.repository=registry.invalid/fleet --set image.tag=ci \
            --set sandbox.image=registry.invalid/fleet-sandbox:ci

      - name: Install kubeconform
        # Pinned + checksum-verified, same discipline as the gitleaks gate.
        env:
          KUBECONFORM_VERSION: '0.6.7'
          KUBECONFORM_SHA256: '95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73'
        run: |
          set -euo pipefail
          tarball="kubeconform-linux-amd64.tar.gz"
          curl -sSL -o "$tarball" \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/${tarball}"
          echo "${KUBECONFORM_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Render and schema-validate every shape
        # The renders used to go to /dev/null, which proved only that the
        # TEMPLATE executes — not that it produces a manifest the apiserver
        # would accept. That is a green-but-vacuous gate: a NetworkPolicy whose
        # ipBlock `except` crosses address families, a probe with a bad field,
        # or a selector typo all rendered "fine". kubeconform checks the
        # rendered objects against the real Kubernetes schemas instead.
        run: |
          set -euo pipefail
          common=(--set image.repository=registry.invalid/fleet --set image.tag=ci
                  --set sandbox.image=registry.invalid/fleet-sandbox:ci)
          validate() {
            helm template ci deploy/helm/fleet --namespace fleet "${common[@]}" "$@" \
              | kubeconform -strict -kubernetes-version 1.30.0 -summary
          }
          # Minimal (the defaults every install starts from) …
          validate
          # … and everything-on, so every optional template compiles AND validates.
          validate \
            --set postgres.enabled=true \
            --set web.enabled=true --set web.image=registry.invalid/fleet-web:ci \
            --set web.existingSecret=fleet-web-secrets \
            --set config.existingSecret=fleet-secrets \
            --set ingress.enabled=true --set ingress.host=fleet.example.com \
            --set networkPolicies.openEgress.create=true \
            --set 'networkPolicies.openEgress.blockedCIDRs={169.254.0.0/16,10.0.0.0/8}' \
            --set sandbox.kubernetes.runtimeClass=kata

      - name: A typed value must not render as a Go format error
        # kubeconform cannot catch this: the mangled text is a perfectly valid
        # string in the rendered Deployment, and only the SANDBOX pod fleet
        # creates at runtime gets rejected — long after helm reported success.
        # YAML 1.1 makes `fleet-runner: true` a bool, and a template that
        # printed it with %s produced "fleet-runner=%!s(bool=true)", which the
        # apiserver refuses on every turn (#1264).
        run: |
          set -euo pipefail
          out=$(helm template ci deploy/helm/fleet --namespace fleet \
            --set image.repository=registry.invalid/fleet --set image.tag=ci \
            --set sandbox.image=registry.invalid/fleet-sandbox:ci \
            --set sandbox.kubernetes.nodeSelector.fleet-runner=true \
            --set sandbox.kubernetes.nodeSelector.rack=12)
          if grep -n '%!' <<<"$out"; then
            echo "::error::a chart value rendered as a Go format error (above)"
            exit 1
          fi
          grep -q 'fleet-runner=true' <<<"$out"
          grep -q 'rack=12' <<<"$out"

  migrations:
    name: Migration DDL lint (#256)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the merge-base with origin/main resolves and the
          # linter can diff the branch's new/changed migration files.
          fetch-depth: 0

      - name: Lint changed migrations for dangerous DDL
        # Diff-scoped: only migrations added/modified in this branch are checked,
        # so the existing corpus is untouched. Passes cleanly when nothing changed.
        env:
          # PR base SHA for a pull_request; the pushed-from SHA for a push. Empty
          # for edge cases (new branch / force-push) → the script falls back to
          # `git merge-base HEAD origin/main`, then to a clean skip.
          MIGRATION_LINT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: scripts/check-migrations.sh

  go:
    name: Go build / vet / lint / test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    # Skipped for a docs-only change; the `CI gate` job treats a skip as a pass.
    if: ${{ needs.changes.outputs.docs_only != 'true' }}

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: fleet
          POSTGRES_PASSWORD: fleet
          POSTGRES_DB: fleet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fleet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Chat suites (internal/store, internal/httpapi) read FLEET_TEST_DATABASE_URL,
      # falling back to CHAT_TEST_DATABASE_URL. Sched suite (internal/sched/*,
      # internal/runner) reads DATABASE_URL. The chat and sched migration systems
      # both use a table named schema_migrations with INCOMPATIBLE schemas, so they
      # MUST point at separate databases. Both suites auto-migrate from an empty DB.
      FLEET_TEST_DATABASE_URL: postgres://fleet:fleet@localhost:5432/fleet_chat_test?sslmode=disable
      CHAT_TEST_DATABASE_URL: postgres://fleet:fleet@localhost:5432/fleet_chat_test?sslmode=disable
      DATABASE_URL: postgres://fleet:fleet@localhost:5432/fleet_sched_test?sslmode=disable
      # The clientconfig tests self-resolve config/default, but point the binaries at
      # the in-repo bundle explicitly for any code path that reads it.
      FLEET_CLIENT_CONFIG_DIR: ${{ github.workspace }}/config/default

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Read from go.mod so the toolchain is declared once.
          go-version-file: go.mod
          check-latest: true

      - name: Prefetch Go modules (retried — the proxy is not always up)
        # setup-go's module cache is keyed on go.sum, so every dependency bump
        # is a cold cache and this job's first `go` command pulls the whole
        # module graph from the proxy. A single `read: connection reset by peer`
        # there fails the job for a reason that has nothing to do with the change
        # under test — which is exactly how the CI run on main went red after the
        # #1395 bumps landed. Do the download HERE, retried, so the
        # network-flaky part is isolated in a step that survives a hiccup and
        # every `go` command after it hits a warm module cache.
        #
        # Retries are bounded and only cover the download: a checksum mismatch or
        # a compile error still fails on the first try, in the step that owns it.
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if go mod download; then
              exit 0
            fi
            echo "go mod download failed (attempt ${attempt}/3); retrying in $(( attempt * 10 ))s"
            sleep "$(( attempt * 10 ))"
          done
          echo "::error::go mod download failed three times — the Go module proxy is unreachable from this runner"
          exit 1

      - name: Install postgresql-client-18 (so pg_dump matches the server major)
        # The runner ships client 16; the postgres service is server 18, and
        # pg_dump refuses to dump a newer server ("server version mismatch"). Pull
        # the matching client from PGDG so the backup/restore round-trip test
        # (internal/admincli/backup_test.go) runs for real.
        #
        # NOT best-effort, and that is a deliberate change. This step used to end
        # in `|| echo "... will skip on version mismatch"`, which meant an
        # unreachable PGDG left the runner's client 16 in place, and
        # backup_test.go's `t.Skipf("pg_dump major %d != server major %d")`
        # (internal/admincli/backup_test.go:155) turned the ONLY coverage of
        # `fleet backup` / `fleet restore` off — behind a green `CI gate`, the
        # single required check on main. That is the same green-but-vacuous shape
        # this repo keeps writing post-mortems about, and the same one `e2e-live`
        # already refuses by grepping its own log for `--- SKIP`. A PGDG outage
        # is now a red build with an obvious cause rather than a silent hole.
        run: |
          set -euxo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          # Installing the package does NOT change what `pg_dump` resolves to,
          # and that is what made this step's first outing fail with `got=16`
          # over an install that had plainly succeeded. /usr/bin/pg_dump is a
          # symlink to postgresql-common's pg_wrapper, and the wrapper's own
          # header states the rule: it calls the client "with the version,
          # cluster and default database specified in ~/.postgresqlrc or
          # /etc/postgresql-common/user_clusters". That is cluster
          # configuration, NOT "the newest client installed" — so on a runner
          # image carrying a PostgreSQL 16 cluster, adding a 16-agnostic client
          # package changes nothing about the dispatch. Put the versioned bin
          # dir first on PATH instead, which is what the Go test needs anyway:
          # it execs `pg_dump` off PATH (internal/admincli/backup.go), with no
          # versioned path of its own.
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          # Assert the major, don't just print it: the test self-skips on a
          # mismatch, so an install that "succeeded" with the wrong major is
          # exactly as invisible as one that failed. Absolute path here because
          # $GITHUB_PATH only takes effect in LATER steps — PATH resolution is
          # asserted in the next step, where it has.
          got="$(/usr/lib/postgresql/18/bin/pg_dump --version | grep -oE '[0-9]+' | head -1)"
          [ "$got" = "18" ] || {
            echo "::error::installed pg_dump major ${got} != server major 18 — the backup/restore round-trip test would self-skip."
            exit 1
          }

      - name: Assert pg_dump on PATH is the server major
        # A separate step because $GITHUB_PATH applies from the next step on,
        # and PATH resolution is the half that actually broke: the package
        # installed correctly and `pg_dump` still meant 16. This asserts the
        # exact lookup the round-trip test performs, so the two cannot drift
        # again without going red.
        run: |
          set -euo pipefail
          command -v pg_dump
          got="$(pg_dump --version | grep -oE '[0-9]+' | head -1)"
          [ "$got" = "18" ] || {
            echo "::error::pg_dump on PATH is major ${got}, not server major 18 — the backup/restore round-trip test would self-skip."
            exit 1
          }

      - name: Create test databases
        run: |
          PGPASSWORD=fleet psql -h localhost -U fleet -d fleet -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE fleet_chat_test;' \
            -c 'CREATE DATABASE fleet_sched_test;'

      - name: Disable podman so container sandbox tests self-skip
        # GitHub's ubuntu-latest runner ships podman, but building the ~1.3GB
        # default-bundle sandbox image (config/default/sandbox/Containerfile) per
        # unit-test run would dominate this fast lint/test job — the real sandbox
        # is exercised in the e2e-live job, which builds it. So the
        # podman-gated integration tests in internal/sandbox are skipped here by
        # masking podman. They gate on
        # exec.LookPath("podman"): when podman is absent they cleanly t.Skip,
        # but when present they need the local sandbox image
        # (localhost/fleet-sandbox:latest) and t.Fatalf if it is absent. Masking
        # the binary makes LookPath fail so every container test skips. The
        # host-backend sandbox tests (bash/python3 via os/exec) still run normally.
        run: |
          if command -v podman >/dev/null 2>&1; then
            sudo mv "$(command -v podman)" "$(command -v podman).disabled"
          fi
          if command -v podman >/dev/null 2>&1; then
            echo "podman still on PATH at $(command -v podman); failing" >&2
            exit 1
          fi
          echo "podman is not on PATH (container sandbox tests will skip)"

      - name: go build (release config — host executor must NOT be compiled in)
        # No fleet_host_executor tag: this is the shipped binary. It compile-checks
        # the release path, proving the unsandboxed host executor (host.go) is fenced
        # out and host_disabled.go's stub stands in (#159).
        run: go build ./...

      - name: go vet
        # Tagged so host.go (gated behind fleet_host_executor) is vetted too. Tests
        # + the host fixtures only compile with the tag.
        run: go vet -tags fleet_host_executor ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Repo .golangci.yml is the v2 schema (version: "2"). It no longer
          # pins run.go: golangci-lint's documented default is "use Go version
          # from the go.mod file", so go.mod is the single declaration and the
          # linter follows it automatically. The BINARY version still needs a
          # pin so CI and a local `golangci-lint run` agree and the full gate
          # never flaps on a release.
          version: v2.13.1
          # FULL GATE: the lint backlog has been burned down to zero, so this
          # fails on ANY finding (not just new-vs-merge-base). only-new-issues is
          # intentionally removed/false. To keep it clean: fix the finding, or
          # add a //nolint with a reason (nolintlint enforces the reason).
          only-new-issues: false

      - name: go test
        # Tagged: compiles the host-mode fixtures + MockMode tests. The release
        # binary above is built untagged; here we exercise the full suite (#159).
        # -coverprofile / -covermode=atomic: emit coverage data for the two
        # coverage-summary steps below (issue #249). The race step is
        # intentionally NOT instrumented — `go tool cover` on this non-race
        # profile is enough for trend tracking, and -coverprofile under -race
        # would double the already-long race run.
        run: go test -p 1 -tags fleet_host_executor -coverprofile=coverage.out -covermode=atomic ./... -count=1

      - name: go test -race
        # fleet's correctness rests on in-process coordination (the worker pool,
        # SSE fan-out, single-owner DB leases, the admission semaphore). The race
        # detector is the gate for that whole class of bug; it reuses the same
        # Postgres service as the plain test step above.
        run: go test -race -p 1 -tags fleet_host_executor ./... -count=1

      - name: Coverage summary
        # Print the project-total line to the log and emit an HTML report for
        # local-style inspection / artifact download. There is no external
        # coverage service in this pipeline, so this step and the per-package
        # summary below ARE the coverage signal — in-log and in the job summary.
        run: |
          go tool cover -func=coverage.out | tail -1
          go tool cover -html=coverage.out -o coverage.html

      - name: Per-package coverage summary
        # Write the per-package (and per-function) coverage table to the Actions
        # job summary, visible in the UI without downloading any artifact (#249).
        run: |
          {
            echo "## Go coverage by package"
            echo '```'
            go tool cover -func=coverage.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: govulncheck (dependency CVEs)
        # Call-graph-aware scan of the (broad, fast-moving) dependency tree for
        # known vulnerabilities reachable from fleet's code. gosec covers SAST and
        # gitleaks covers secrets; nothing else gates on vulnerable dependencies.
        #
        # BOTH halves of this step are deliberately time-varying — unlike the
        # pinned gitleaks/Grype releases above — so this is worth stating plainly
        # rather than leaving it to look like an oversight:
        #
        #   * The DATABASE must be live. govulncheck fetches advisories from
        #     https://vuln.go.dev per run (see `govulncheck -version`). Pinning it
        #     would blind the gate to anything disclosed after the pin, which is
        #     the entire point of the check. The cost is that this step can turn
        #     red with no commit involved — that is the gate working, not
        #     flaking. GO-2026-6166..6173 against lib/pq is the worked example:
        #     nothing in the diff changed, and the correct response was to drop
        #     the unmaintained dependency, not to quiet the scanner.
        #
        #   * The SCANNER stays @latest, which is upstream Go's own documented
        #     invocation (go.dev/doc/security/vuln) and what golang/govulncheck-action
        #     effectively does too — it exposes no govulncheck version input. A pin
        #     here could only be a hand-maintained string (Dependabot does not
        #     rewrite versions inside `run:`, and the go.mod `tool` directive is
        #     worse: tool deps share the main module build list, so the scanner
        #     would start dictating the product's x/net version). A pin nobody
        #     bumps quietly costs detection as the reachability analysis improves
        #     — the wrong trade for a security gate. If a bad govulncheck release
        #     ever blocks every PR at once, pinning here is the one-line rollback.
        #
        # govulncheck-scheduled.yml runs the same scan against main daily and
        # reports to the Security tab. That does not make anything greener; it
        # changes WHEN a newly published advisory is discovered, so it is found
        # on a schedule instead of ambushing the next unrelated PR.
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  python:
    name: Python lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    # Skipped for a docs-only change; the `CI gate` job treats a skip as a pass.
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    # The lane the repo did not have. fleet ships 13 Python files — the sandbox
    # FileOp helper, the python bridge, the bento-slides and data-profiler skill
    # scripts, MCP test servers — and nothing linted any of them: Go had
    # golangci-lint, the web tier had oxlint, Python had neither. Its only
    # coverage was whatever CodeQL's code-quality suite happened to notice, which
    # is a ~40s job with no autofix; ruff does the same class of check in well
    # under a second. See ruff.toml for why the rule set is narrow (default rules
    # find 3 issues here; the broad selection finds 333, almost all style churn).
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ruff
        # Pinned like every other tool this repo installs in CI, so an upstream
        # release cannot change the verdict without a visible diff.
        env:
          RUFF_VERSION: '0.15.8'
        run: |
          set -euo pipefail
          python3 -m pip install --user --quiet "ruff==${RUFF_VERSION}"
          # GITHUB_PATH only affects LATER steps, so export for this one too.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          ruff --version

      - name: Lint
        # Config (rule selection, excludes, per-file ignores) lives in ruff.toml
        # so a local `ruff check .` and this gate cannot disagree.
        run: ruff check --output-format github .

      - name: Formatting check
        # A gate, and safe to be one: the whole tree was ruff-formatted in the
        # change that flipped this, so a failure here is a NEW unformatted file,
        # fixable with one `ruff format .`.
        run: ruff format --check .

  codeql:
    # Reusable-workflow call: brings codeql.yml's jobs into THIS workflow's
    # graph so `CI gate` (the single required check on main) blocks on them.
    # Its `Fail on findings` step means a finding — not just a broken scanner —
    # fails this job and therefore the gate.
    needs: changes
    # Docs-only changes cannot touch Go/JS/Python/workflow code (the allowlist
    # is *.md, docs/, LICENSE); the gate treats the skip as a pass.
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    permissions:
      contents: read
      security-events: write  # the called workflow uploads SARIF to code scanning
      actions: read
    uses: ./.github/workflows/codeql.yml

  semgrep:
    # Same mechanism as codeql above: called here so `CI gate` blocks on it.
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/semgrep.yml

  web:
    name: Web lint / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    # Skipped for a docs-only change; the `CI gate` job treats a skip as a pass.
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Read from web/.nvmrc so the deployed node major is declared once.
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Audit dependencies for known CVEs
        # The npm counterpart of the Go job's govulncheck gate: reads
        # package-lock.json against the npm advisory DB and fails on ANY
        # severity. Like govulncheck, the verdict is a function of the clock as
        # well as the commit — a new advisory can redden an unchanged tree, and
        # that is the point. Needs no node_modules (lockfile-only), so it runs
        # before the expensive install and fails fast.
        run: npm audit --audit-level=low

      - name: Audit rampart-service dependencies for known CVEs
        # Separate tree, same gate. Its lockfile pins `overrides` forcing
        # sharp >=0.35 (libvips CVEs) and adm-zip >=0.6 (GHSA-xcpc-8h2w-3j85)
        # because the locked @huggingface/transformers/onnxruntime-node parents
        # have not picked the fixes up yet — see package.json.
        working-directory: scripts/rampart-service
        run: npm audit --audit-level=low

      - name: Check whether the rampart security overrides are droppable
        # scripts/rampart-service/package.json force-patches sharp and adm-zip
        # because their locked parents still require vulnerable lines. Once a
        # dependency update moves every locked parent to a fixed range, this
        # FAILS with removal instructions; checking @latest would be unsafe
        # while a transitive consumer remains pinned to an older parent.
        # Absolute path: this job's default working-directory is web/, which is
        # exactly how run 32579378165 caught the repo-relative form (exit 127).
        run: '"$GITHUB_WORKSPACE/scripts/check-npm-overrides.sh"'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Explicit type gate. `next build` also type-checks, but it runs LAST and
      # after the bundle work — so a plain type error used to surface minutes
      # into the job. oxlint is a syntax/semantic linter with no type awareness
      # (that is why it works on TS 7 at all), so the types need their own step
      # rather than riding along with lint as they did under
      # @typescript-eslint. On the native TS 7 compiler this costs ~2s.
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npx vitest run

      - name: Build
        run: npm run build

  playwright:
    name: Web e2e (Playwright, mocked)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    # Skipped for a docs-only change; the `CI gate` job treats a skip as a pass.
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    defaults:
      run:
        working-directory: web

    env:
      # The mocked e2e suite drives the REAL Next app but route-intercepts every
      # Go backend, so no chat-server / orchestrator / OpenRouter / Podman is
      # needed — it's fully deterministic. These throwaway secrets must be set at
      # build time (server components read AUTH_SIGNING_PUBKEY to render the
      # "Use Elcano email" button). At RUNTIME the mocked suite regenerates a
      # fresh Ed25519 keypair per run (see web/e2e/test-auth-key.ts) and
      # playwright.config.ts overrides AUTH_SIGNING_PUBKEY on the `next start`
      # webServer with that generated pubkey — so the value below only needs to
      # be a shape-valid throwaway pubkey for the build-step button render.
      CHAT_MOCK_MODE: '1'
      APP_SESSION_SECRET: e2e-session-secret-0123456789abcdef
      # TEST ONLY — throwaway Ed25519 pubkey, not used in any deployment.
      AUTH_SIGNING_PUBKEY: P8Lyn/xy8bS2SWcnPkg2kKiGBctyJZdEMMzNEixh0As=
      CHAT_SERVER_URL: http://127.0.0.1:18080
      CHAT_SERVER_TOKEN: e2e-shared-secret
      ORCHESTRATOR_SERVER_URL: http://127.0.0.1:18000

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Read from web/.nvmrc so the deployed node major is declared once.
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Build
        # Production build; playwright.config.ts boots `next start` against it in
        # CI (CHAT_MOCK_MODE=1) so the suite validates the shipped bundle.
        run: npm run build

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright HTML report
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14

  e2e-live:
    name: Web e2e (Playwright, live — real backend + sandbox)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: changes
    # Skipped for a docs-only change; the `CI gate` job treats a skip as a pass.
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    # The full real stack: Postgres (service container), both Go listeners, SSE,
    # the scheduler + worker pool, and the REAL rootless-podman sandbox. ONLY the
    # LLM is stubbed — by the wire-compatible fake (cmd/fake-llm), reached via
    # OPENROUTER_BASE_URL. No OpenRouter spend, fully deterministic.

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: fleet
          POSTGRES_PASSWORD: fleet
          POSTGRES_DB: fleet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fleet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # The boot script creates the fleet_e2e_chat + fleet_e2e_sched DBs on this
      # admin DSN (the service container's superuser has CREATEDB).
      E2E_DATABASE_DSN: postgres://fleet:fleet@127.0.0.1:5432/postgres?sslmode=disable
      # Sandbox image: built locally from the default client bundle
      # (config/default/sandbox/Containerfile, a vanilla fedora-minimal base) by
      # the step below and resolved into FLEET_SANDBOX_IMAGE. fleet's core pulls
      # no vendor-published image; the per-client registry-publish path is opt-in
      # from a client's own bundle repo (see internal/clientconfig Sandbox()).
      SANDBOX_IMAGE_LOCAL: localhost/fleet-sandbox:latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Read from go.mod so the toolchain is declared once.
          go-version-file: go.mod
          check-latest: true

      - name: Prefetch Go modules (retried — the proxy is not always up)
        # setup-go's module cache is keyed on go.sum, so every dependency bump
        # is a cold cache and this job's first `go` command pulls the whole
        # module graph from the proxy. A single `read: connection reset by peer`
        # there fails the job for a reason that has nothing to do with the change
        # under test — which is exactly how the CI run on main went red after the
        # #1395 bumps landed. Do the download HERE, retried, so the
        # network-flaky part is isolated in a step that survives a hiccup and
        # every `go` command after it hits a warm module cache.
        #
        # Retries are bounded and only cover the download: a checksum mismatch or
        # a compile error still fails on the first try, in the step that owns it.
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if go mod download; then
              exit 0
            fi
            echo "go mod download failed (attempt ${attempt}/3); retrying in $(( attempt * 10 ))s"
            sleep "$(( attempt * 10 ))"
          done
          echo "::error::go mod download failed three times — the Go module proxy is unreachable from this runner"
          exit 1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Read from web/.nvmrc so the deployed node major is declared once.
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright browser (chromium)
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Ensure podman + pasta + postgres client
        # ubuntu-latest already ships podman and the postgres client, but install
        # defensively so the job is robust to runner image changes. The boot
        # script can stand up its own cluster too, but here we use the service.
        #
        # pasta (passt) is the rootless network backend for the per-turn podman
        # tool sandbox; install it explicitly rather than relying on the runner
        # image's default rootless backend.
        run: |
          sudo apt-get update -qq
          command -v podman >/dev/null 2>&1 || sudo apt-get install -y -qq podman
          command -v pasta  >/dev/null 2>&1 || sudo apt-get install -y -qq passt
          command -v psql   >/dev/null 2>&1 || sudo apt-get install -y -qq postgresql-client
          podman --version
          pasta --version 2>/dev/null | head -1 || true
          psql --version

      - name: Build the sandbox image from the default bundle
        id: sandbox
        # fleet's core depends on NO vendor-published sandbox image: build the
        # generic default-bundle flavor on the runner from
        # config/default/sandbox/Containerfile (a vanilla fedora-minimal base),
        # exactly as a deployment box does. The ~1.3GB build is the cost of a
        # self-contained, registry-independent gate. A client that prefers a
        # prebuilt image publishes it from its own bundle repo and sets
        # sandbox.image in its manifest — that path is out of scope for core CI.
        run: |
          set -euo pipefail
          IMAGE_NAME="${SANDBOX_IMAGE_LOCAL%%:*}" scripts/build-sandbox-image.sh "${SANDBOX_IMAGE_LOCAL##*:}"
          echo "image=$SANDBOX_IMAGE_LOCAL" >> "$GITHUB_OUTPUT"

      - name: Assert sandbox isolation invariants (always-on, real rootless podman)
        # The project's #1 non-negotiable invariant (AGENTS.md): every agent tool
        # call's model-authored local execution runs in the rootless-Podman
        # sandbox (MCP is the documented host-side broker exception), mapped via
        # `--userns=keep-id:uid=1000,gid=1000` with same-path `:z` workspace
        # mounts. Its regression tests live in internal/sandbox, but they
        # SELF-SKIP when run as root or with podman masked — which is exactly the
        # default PR lanes (the `go` job masks podman; a root `make test` trips the
        # euid guard). This e2e-live job is the ONLY always-on lane with a real,
        # non-root, rootless-podman sandbox, so run the invariant tests here.
        #
        # TestSeccompProfileDeniesAtRuntime is here because it is the ONLY test
        # that proves the seccomp filter actually reaches a live container: the
        # static profile tests can't, and the older in-container canary
        # (sandbox_hardened_test.go) is opt-in behind FLEET_SANDBOX_HARDENED_TEST,
        # which no lane sets. It asserts both directions — AF_VSOCK denied AND
        # AF_INET still open — so an over-restrictive filter fails it too.
        #
        # The disk-quota pair is here for the same reason: RLIMIT_FSIZE is the
        # only cap on the workspace bind mount, and nothing else in an always-on
        # lane proves it reaches the kernel. (Its storage-opt sibling is
        # deliberately NOT listed — it needs an XFS-pquota/btrfs driver these
        # runners do not have, so it would SKIP and trip the guard below.)
        #
        # A SKIP is treated as a FAILURE: a silently-skipped invariant test is a
        # false green, which is the precise gap this lane closes (issue #34). We
        # require an explicit `--- PASS` for each named test and fail on any
        # `--- SKIP`. FLEET_SANDBOX_TEST_IMAGE points the tests at the SAME image
        # the live stack uses (the locally-built default-bundle sandbox), so the
        # assertion runs against the real rootless-podman image.
        env:
          FLEET_SANDBOX_TEST_IMAGE: ${{ steps.sandbox.outputs.image }}
        run: |
          set -euo pipefail
          tests='TestContainerWorkspaceSamePathCoherence|TestContainerReadOnlyMountsSamePath|TestContainerWorkspaceSurvivesConcurrentMount|TestContainerBashSamePath|TestContainerDiskQuotaSetsRLimit|TestContainerDiskQuotaBlocksOversizeFile|TestSeccompProfileDeniesAtRuntime'
          # -tags fleet_host_executor: these are container-mode invariant tests,
          # but they share the sandbox test package with the host-mode fixtures
          # that are now gated behind this tag (#159) — the package won't COMPILE
          # without it (the tests would read as "absent" and trip the guard below).
          go test -tags fleet_host_executor -run "$tests" -v -count=1 ./internal/sandbox 2>&1 | tee sandbox-invariants.log
          for tc in \
            TestContainerWorkspaceSamePathCoherence \
            TestContainerReadOnlyMountsSamePath \
            TestContainerWorkspaceSurvivesConcurrentMount \
            TestContainerBashSamePath \
            TestContainerDiskQuotaSetsRLimit \
            TestContainerDiskQuotaBlocksOversizeFile \
            TestSeccompProfileDeniesAtRuntime; do
            if ! grep -q -- "--- PASS: ${tc}" sandbox-invariants.log; then
              echo "::error::sandbox invariant test ${tc} did not PASS (skipped or absent) — this always-on lane must actually run it (see issue #34)"
              exit 1
            fi
          done
          if grep -q -- '--- SKIP' sandbox-invariants.log; then
            echo "::error::a sandbox invariant test SKIPPED — this lane must run them for real (non-root rootless podman + resolved image), not self-skip into a false green"
            exit 1
          fi

      - name: Boot the live stack + run the live Playwright project
        working-directory: web
        env:
          CI: '1'
          E2E_LIVE: '1'
          E2E_PROD: '1'
          FLEET_SANDBOX_IMAGE: ${{ steps.sandbox.outputs.image }}
        # playwright.config.ts (E2E_LIVE=1) launches ../scripts/e2e-boot-server.sh
        # as its webServer; the script boots everything (health-gated, no sleeps),
        # then the "live" project runs against it.
        run: npx playwright test --project=live --reporter=list

      - name: Upload Playwright live report
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-live-report
          path: web/playwright-report/
          retention-days: 14

      - name: Upload server logs on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-live-server-logs
          path: |
            .e2e-run/logs/
            web/test-results/
          retention-days: 14
          if-no-files-found: ignore

  grype-scan:
    name: Container image vulnerability scan (Grype)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [e2e-live]  # runs after e2e-live succeeds (which already builds the image)
    # When e2e-live is skipped for a docs-only change, this job is skipped too
    # (a job that `needs` a skipped job is itself skipped); the `CI gate` job
    # treats a skip as a pass, so docs-only PRs are not blocked.
    permissions:
      # Least-privilege: only this job can write SARIF to the Security tab.
      contents: read
      security-events: write
    env:
      SANDBOX_IMAGE_LOCAL: localhost/fleet-sandbox:latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job holds a write scope. Nothing in it pushes or does an
          # authenticated fetch, so do not leave the token in .git/config while
          # a PR-controlled Containerfile goes through `podman build`.
          persist-credentials: false

      - name: Install Grype
        # Pin a specific Grype release and verify its checksum, exactly as the
        # gitleaks gate above pins its binary: the scanner is part of the merge
        # gate, so its OWN supply chain matters as much as what it scans. We run
        # the pinned, checksum-verified upstream binary — NOT a third-party
        # composite action on a mutable @master ref — so an upstream re-tag can't
        # silently change what runs in the gate. Bump GRYPE_VERSION + GRYPE_SHA256
        # together (the checksum is published as grype_<ver>_checksums.txt).
        #
        # Why Grype and not Trivy: the sandbox base is fedora-minimal, and Trivy
        # has no Fedora advisory feed — it detects the OS but scans 0 of the ~400
        # RPMs ("WARN Unsupported os family=fedora"), which would be a false-green
        # gate. Grype matches the image's RPM AND Python packages against NVD/GHSA,
        # so it actually covers this image. See docs/TESTING.md for the rationale.
        env:
          GRYPE_VERSION: '0.117.0'
          GRYPE_SHA256: '38525dab1e06f162ebaa02f94d82d1f807076b011a44180cf2777edf1a7b9c26'
        run: |
          set -euo pipefail
          tarball="grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          curl -sSL -o "$tarball" \
            "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/${tarball}"
          echo "${GRYPE_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" grype
          sudo install -m 0755 grype /usr/local/bin/grype
          grype version

      - name: Ensure podman
        # The sandbox image is built with podman (scripts/build-sandbox-image.sh);
        # ubuntu-latest ships podman, but install defensively so the job is robust
        # to runner image changes (mirrors the e2e-live job's approach).
        run: |
          sudo apt-get update -qq
          command -v podman >/dev/null 2>&1 || sudo apt-get install -y -qq podman
          podman --version

      - name: Build the sandbox image and export it to an archive
        # Rebuilds the same default-bundle sandbox image the e2e-live job builds
        # (config/default/sandbox/Containerfile, a vanilla fedora-minimal base),
        # then `podman save`s it to a docker-archive tarball. Scanning the archive
        # (grype docker-archive:...) needs no running container daemon or socket —
        # hermetic and robust. This is a separate runner with a cold podman store
        # (GitHub shares no layer cache between jobs), so it is a full rebuild —
        # the ~1.3GB build is the cost of a self-contained, registry-independent
        # gate. govulncheck covers Go module CVEs; it cannot see the ~400 RPMs (and the
        # Python packages they ship) this image installs via microdnf — that
        # surface is what this scan covers.
        run: |
          set -euo pipefail
          IMAGE_NAME="${SANDBOX_IMAGE_LOCAL%%:*}" scripts/build-sandbox-image.sh "${SANDBOX_IMAGE_LOCAL##*:}"
          podman save --format docker-archive -o sandbox-image.tar "$SANDBOX_IMAGE_LOCAL"

      - name: Scan the sandbox image (report all findings)
        # Produce one full report for people and GitHub Security. The separate
        # policy step below decides what blocks a merge; keeping collection and
        # policy separate avoids hiding non-blocking findings with --only-fixed.
        run: |
          set -euo pipefail
          grype "docker-archive:sandbox-image.tar" \
            --output table \
            --output json=grype-results.json \
            --output sarif=grype-results.sarif

      - name: Enforce actionable Fedora RPM policy
        # The generic image follows Fedora latest. Block when a CRITICAL **or
        # HIGH** RPM finding has a packaged fix (scripts/check-grype-policy.sh
        # selects both severities — this comment said CRITICAL only, which
        # understated the gate); report upstream language records but do not
        # force hand-maintained overlay pins over distro-owned packages.
        run: scripts/check-grype-policy.sh grype-results.json

      - name: Upload Grype SARIF results to the GitHub Security tab
        # Upload whenever the scan produced a SARIF — including when the policy
        # step rejects a fixable CRITICAL/HIGH RPM — so
        # findings reach GitHub Security → Code scanning with full CVE details,
        # affected packages, and fix versions rather than only a red CI job. The
        # hashFiles guard skips this step (instead of erroring "file not found")
        # when an EARLIER step failed before grype could write the SARIF.
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        if: ${{ !cancelled() && hashFiles('grype-results.sarif') != '' }}
        with:
          sarif_file: 'grype-results.sarif'
          category: 'grype-sandbox-image'

  ci-gate:
    # The SINGLE required status check on `main` (see .github/CODEOWNERS). It
    # `needs` every other job and ALWAYS runs, so it always reports a result —
    # which is what lets docs-only PRs (whose heavy jobs are skipped) merge
    # without being blocked forever on a required check that never reported, the
    # classic footgun of pairing required checks with path/`if` skips. A code PR
    # cannot go green here unless every upstream job actually succeeded: a skip is
    # allowed (docs-only), any failure fails the gate, and a superseded run
    # (cancelled upstream jobs, none failed) concludes neutral (#1302).
    name: CI gate
    if: ${{ always() }}
    needs: [changes, gitleaks, actions, migrations, helm, go, python, codeql, semgrep, web, playwright, e2e-live, grype-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all upstream jobs to have succeeded or been skipped
        env:
          # needs.*.result is one of: success | failure | cancelled | skipped.
          RESULTS: ${{ join(needs.*.result, ',') }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
        run: |
          set -euo pipefail
          echo "Upstream job results: ${RESULTS}"
          echo "docs_only: ${DOCS_ONLY}"
          case ",${RESULTS}," in
            *,failure,*)
              echo "::error::A required upstream CI job failed."
              exit 1 ;;
          esac
          # Cancelled-but-nothing-failed means this run was SUPERSEDED: the
          # concurrency group above cancels an in-flight PR run when a newer
          # push replaces the head. This job still runs (`if: always()`);
          # conclude neutral rather than stamping a meaningless red X on the
          # stale commit — the superseding run on the new head is what the
          # required check actually evaluates (#1302, same shape as Dev gate).
          # Caveat, accepted deliberately: a HUMAN cancelling the run on a
          # PR's current head also lands here and turns the required check
          # green over a suite that did not finish. Cancelling a run and then
          # merging over it is a deliberate two-step act, not an accident this
          # gate is built to catch; on pushes to main cancel-in-progress is
          # off, so no push run can reach this branch via supersession.
          case ",${RESULTS}," in
            *,cancelled,*)
              echo "::notice::run superseded: upstream jobs were cancelled and none failed; CI gate concludes neutral (#1302)"
              exit 0 ;;
          esac
          # A `skipped` job passes this gate only because the docs-only
          # classifier above is allowed to skip the suite. If nothing was
          # classified docs-only, a skip means a required job did not run and
          # this gate would otherwise report green over it — the
          # red-but-not-required rot pattern with the colours inverted. So trust
          # the classifier for the one case it exists for, and refuse a skip in
          # every other case rather than assuming the `if:` that produced it was
          # correct.
          if [ "${DOCS_ONLY}" != "true" ]; then
            case ",${RESULTS}," in
              *,skipped,*)
                echo "::error::A required upstream job was SKIPPED on a change that is not docs-only. CI gate does not pass over a suite that did not run."
                exit 1 ;;
            esac
          fi
          echo "All required CI jobs passed (or were cleanly skipped for a docs-only change)."
