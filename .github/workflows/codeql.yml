# CodeQL — ADVANCED setup.
#
# This file replaces GitHub's zero-config "default setup", which was switched off
# because its Go analysis could not be fixed from anywhere. Default setup
# installed the Go toolchain its extractor was built with (1.26.6) and pinned
# `GOTOOLCHAIN=local`, so on a `go.mod` that requires 1.27 it could neither build
# that toolchain nor download it:
#
#     go: go.mod requires go >= 1.27.0 (running go 1.26.6; GOTOOLCHAIN=local)
#     Failed to run `go mod tidy -e` in .
#     Extraction failed for all discovered Go projects.
#     CodeQL job status was configuration error.
#
# Every main-targeting PR had that failure from the Go 1.27 bump (#1240, promoted
# in #1242) onward, so the repo had no CodeQL coverage of its Go code for that
# whole stretch. Default setup exposes no knobs — there is no place to set a Go
# version or an env var — hence advanced setup, where `actions/setup-go` reads
# `go-version-file: go.mod` like every other lane in this repo.
#
# The literal-version rule applies here too: `scripts/check_versions_test.go`'s
# TestWorkflowsDeclareVersionsByFile scans EVERY .github/workflows/*.yml for a
# literal `go-version:`/`node-version:` and fails on it. That assertion is
# directory-wide, so this file was covered by it the moment it was added — no
# change to the test was needed. Do not replace the version-file input with a
# hardcoded 1.27; that is the exact bug class #1240 and #1241 already fixed twice
# for node, and pinning it here would go stale silently the next time go.mod moves.
#
# SCOPE: security queries only. Default setup ran two analyses per event —
# security over go/python/javascript-typescript/actions, and code quality over
# the first three. This file restores the SECURITY half and deliberately drops
# the code-quality half. That is a considered narrowing, not an oversight, and
# the measurements behind it are recorded in docs/CODEQL.md. In short:
#
#   - The quality suite was enabled first and measured. It produced 32 findings,
#     every one of them note-level, and ZERO security findings across the whole
#     tree. So nothing was being caught that mattered at severity.
#   - For Go and the web tier it duplicates linters that already run AND ALREADY
#     BLOCK via `ci-gate`: golangci-lint (gosec, staticcheck, revive, unparam,
#     gocritic, …) and oxlint. `go/useless-assignment-to-field` is squarely
#     inside golangci-lint's remit.
#   - 28 of the 32 were Python, which was the one real gap — Python had no
#     linter at all. That gap is now closed by ruff (see ruff.toml), which finds
#     the same class of thing in under a second, with autofix, and blocks. A
#     ~40s CodeQL job with no autofix is the wrong instrument for it.
#   - 3 of the 32 were false positives on correct code (the idiomatic NaN test
#     `value != value`, flagged as comparison-of-identical-expressions).
#
# Note for anyone tempted to re-add it: `analysis-kinds: code-scanning,code-quality`
# does NOT work in a custom workflow. The action logs two ##[error] lines and
# still exits 0, silently analyzing security only:
#
#     The `analysis-kinds` input is experimental and for GitHub-internal use
#     only. [...] An analysis kind other than `code-scanning` was specified in a
#     custom workflow. This is not supported and will become a fatal error in a
#     future version of the CodeQL Action. If your intention is to use quality
#     queries outside of Code Quality, use the `queries` input with
#     `code-quality` instead.
#     [...] Specifying multiple values as input is no longer supported.
#
# `queries: code-quality` is the working form. It is simply not wanted here.
#
# Not touched by this file: the three independent `upload-sarif` calls (ci.yml's
# Grype step, govulncheck-scheduled.yml, grype-scheduled.yml). Those push their
# own SARIF to the Security tab and never depended on CodeQL being configured.
#
# Merge gating, in two parts — both closed:
#
#   1. Does a finding turn the CHECK red? YES, for a finding in the blocking
#      band — see the `Fail on findings` step for the threshold and
#      docs/adr/0048-codeql-severity-gating.md for why it is that band and not
#      "any finding". Without that step the analyze step exits 0 whether it found
#      nothing or a hundred alerts, so a red check could only ever mean "the
#      scanner broke".
#   2. Does a red check BLOCK a merge? YES, through the EXISTING required check.
#      This is a REUSABLE workflow (`on: workflow_call`): ci.yml and dev-ci.yml
#      each call it as a job, and a job that calls a reusable workflow can sit in
#      a gate job's `needs` like any other job — which routes a CodeQL failure
#      into `CI gate` / `Dev gate` with no branch-protection change at all. The
#      earlier design note saying this required a repo-settings click was wrong:
#      `needs` cannot cross workflow FILES, but a workflow_call brings the jobs
#      into the caller's file.
#
#      CAVEAT, and it is load-bearing: that routing only blocks a merge where the
#      aggregate gate is a REQUIRED status check. On `main` it is (`CI gate`).
#      On `dev` the ruleset requires no status checks at all, so `Dev gate` is
#      red-but-not-required there — see docs/SCANNING.md ("Known gaps").
#
# The per-language `analyze` legs cannot be named directly in `CI gate`'s
# `needs` — a job's `needs` cannot reach across workflow files — but the CALLING
# job can be, and is. So the aggregate `CodeQL gate` job at the bottom of this
# file exists for the standalone schedule/dispatch runs (one legible verdict per
# weekly re-scan instead of four boxes) and as a stable single check name to put
# in a ruleset, not because the workflow_call path needs it.
# See docs/CODEQL.md ("Merge gating").
name: CodeQL

on:
  # No push/pull_request triggers of its own: per-change runs come from ci.yml
  # (push/PR on main) and dev-ci.yml (push/PR on dev) calling this workflow, so
  # every branch event is covered exactly once and the result feeds the gates.
  # Scanning dev PRs at all is the one place this exceeds old default setup,
  # which never ran on them (verified: zero CodeQL runs recorded on dev PRs).
  workflow_call:
  workflow_dispatch:  # manual re-run (e.g. after dismissing an alert)
  schedule:
    # Monday 10:00 UTC, weekly. Offset from the 07:00 canary, the 08:00 daily
    # govulncheck and the Monday 09:00 Grype scan, following the same
    # don't-contend-for-runners reasoning those files state.
    #
    # A cron matters for CodeQL specifically because a run's verdict is a
    # function of the query pack as well as the commit: new queries ship
    # continuously, and without a schedule the only way this repo learns that a
    # newly published query flags existing code is that some unrelated PR turns
    # red. Same argument govulncheck-scheduled.yml makes about vuln.go.dev.
    - cron: '0 10 * * 1'

permissions:
  contents: read
  security-events: write  # required to upload CodeQL results to the Security tab
  # The `actions` analysis reads workflow definitions; `packages: read` is not
  # needed because no analysis here pulls a private CodeQL pack.
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          # Go is the reason this file exists. `build-mode: none` is NOT
          # supported for Go — only `autobuild` or `manual` — so the toolchain
          # has to be right rather than skipped.
          # security-extended everywhere: the broader security suite (more
          # queries, lower average precision than the default). The adoption
          # measurement was taken on a `pull_request` run, where CodeQL is
          # DIFF-INFORMED and reports only results inside the PR's diff — so it
          # measured the diff, not the tree, and read as zero when the tree held
          # 55 findings. Do not re-derive a tree-wide claim from a PR run; the
          # full-tree numbers come from push/schedule runs. See
          # docs/adr/0048-codeql-severity-gating.md.
          # NOTE on in-source `// codeql[rule-id]` suppressions: they do NOT
          # work with this pipeline, and this was measured, not assumed. Three
          # forms were tried on PR #1249 (the `packs:` input, `packs:` with
          # the documented "+" additive prefix, and an inline `config:` block
          # combining security-extended with codeql/go-queries'
          # AlertSuppression.ql) — in every case the uploaded SARIF carried no
          # `suppressions` on the annotated result, the gate below kept
          # classifying the waiver from the register, and the Security-tab
          # alert stayed open. The analyze action's interpret step is not
          # configurable enough to change that, so the accepted-findings
          # register stays the ONE waiver mechanism for the CI gate, and a
          # deliberately-waived alert is closed in the Security tab by a
          # one-time human dismissal there (which persists across analyses).
          - language: go
            build-mode: autobuild
            queries: security-extended
          - language: python
            build-mode: none
            queries: security-extended
          - language: javascript-typescript
            build-mode: none
            queries: security-extended
          - language: actions
            build-mode: none
            queries: security-extended

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # THE FIX. Runs before init so the interpreter is already on PATH when the
      # Go extractor and autobuild shell out to `go`. go-version-file makes go.mod
      # the single declaration point, so this cannot drift from the module.
      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: ${{ matrix.queries }}
          # security-extended (see the matrix note). The SCOPE note in the
          # header still applies to `code-quality` — do not re-add that one.

      - name: Autobuild
        if: matrix.build-mode == 'autobuild'
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        env:
          # Same build tag ci.yml and dev-ci.yml pass to `go vet` and `go test`,
          # and for the same reason: internal/sandbox/host.go — the UNSANDBOXED
          # host executor — is fenced behind `//go:build fleet_host_executor`, so
          # without the tag it is not in the default build and the extractor never
          # sees it. Measured on the first run of this workflow: 426 of the 427
          # non-test .go files were extracted, and the one missing file was
          # exactly host.go. Leaving the most security-sensitive file in the tree
          # as the single hole in Go coverage is not a defensible default, so the
          # tag is passed here to match the lanes that already vet it.
          GOFLAGS: -tags=fleet_host_executor

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:${{ matrix.language }}
          # Also write the SARIF to disk so the step below can summarize it. The
          # results are still uploaded to code scanning (`upload` defaults true);
          # this only adds a local copy.
          output: ${{ runner.temp }}/codeql-sarif

      - name: Classify findings (shared filter)
        # ONE classifier, in .github/codeql-gate.jq, consumed by both the summary
        # and the gate below. Two copies of a SARIF filter is two copies that can
        # disagree about what "blocking" means, and the report disagreeing with
        # the gate is worse than either being wrong alone. Keeping it in a file
        # also means it can be exercised against fixture SARIF locally with the
        # exact bytes CI runs.
        if: ${{ !cancelled() }}
        env:
          SARIF_DIR: ${{ runner.temp }}/codeql-sarif
          LANGUAGE: ${{ matrix.language }}
          ACCEPTED_FILE: ${{ github.workspace }}/.github/codeql-accepted-findings.json
          GATE_FILTER: ${{ github.workspace }}/.github/codeql-gate.jq
          CLASSIFIED: ${{ runner.temp }}/codeql-classified.json
        run: |
          set -uo pipefail
          shopt -s nullglob
          files=("$SARIF_DIR"/*.sarif)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No SARIF written for $LANGUAGE — cannot conclude the scan was clean."
            exit 1
          fi
          for f in "$ACCEPTED_FILE" "$GATE_FILTER"; do
            if [ ! -f "$f" ]; then
              echo "::error::$f is missing — refusing to gate without it."
              exit 1
            fi
          done
          if ! jq -rs --slurpfile reg "$ACCEPTED_FILE" -f "$GATE_FILTER" \
                 "${files[@]}" > "$CLASSIFIED"; then
            echo "::error::could not classify the SARIF for $LANGUAGE — refusing to report it clean."
            exit 1
          fi
          total=$(jq -r '.total' "$CLASSIFIED")
          meta=$(jq -r '.ruleMetaCount' "$CLASSIFIED")
          echo "$LANGUAGE: $total finding(s), $meta rule metadata entr(ies)"
          # VACUITY CHECK. Severity banding depends on resolving each result's
          # rule metadata, and CodeQL puts that in tool.extensions[].rules[] —
          # not tool.driver.rules[]. A first cut of the filter read only the
          # driver, resolved nothing, scored every finding at security-severity 0
          # and reported "0 blocking" over a tree holding 30 findings. The check
          # below is what would have caught that: findings but no rule metadata
          # means the lookup is broken and the gate is not evaluating anything.
          if [ "$total" != "0" ] && [ "$meta" = "0" ]; then
            echo "::error::$LANGUAGE: $total finding(s) but ZERO rule metadata resolved — severity banding is inoperative, so this gate would pass vacuously. Fix the rule lookup in .github/codeql-gate.jq."
            exit 1
          fi

      - name: Summarize findings to the job log
        # WHY THIS EXISTS: a CodeQL run reports nothing about what it FOUND to
        # its own log. It writes SARIF, uploads it, and exits 0 — with findings
        # or without them. So the only way to see results was to open the
        # Security tab, which means a run's outcome is invisible to anyone
        # reading CI output, to `gh run view`, and to any automation that has
        # the log but not the code-scanning API.
        #
        # The listing is split into the SAME three tiers the gate uses, from the
        # same classifier, and prints the ACCEPTED tier BY NAME — a waiver that
        # is invisible in CI output is a waiver nobody re-reads.
        if: ${{ !cancelled() }}
        env:
          LANGUAGE: ${{ matrix.language }}
          CLASSIFIED: ${{ runner.temp }}/codeql-classified.json
          # The database directory is named after the EXTRACTOR, which is not
          # always the matrix language: javascript-typescript -> javascript.
          CODEQL_DB: ${{ matrix.language == 'javascript-typescript' && 'javascript' || matrix.language }}
        run: |
          set -uo pipefail
          {
            echo "### CodeQL findings — $LANGUAGE"
            echo '```'
            jq -r '
              def fmt: "  [\(.level)] sec-sev=\(if .hasSev then .sev else "n/a" end)  \(.rule)  \(.file):\(.line)"
                       + (if .suppressed then "   (in-source suppression)" else "" end);
              def tier($label; $rows):
                "\($label) (\($rows | length)):",
                (if ($rows | length) == 0 then "  none"
                 else ($rows | sort_by(.rule, .file, .line) | .[] | fmt) end);
              tier("BLOCKING — High band (security-severity >= 7.0), not waived"; .blocking),
              "",
              tier("ACCEPTED — High band, waived in codeql-accepted-findings.json"; .accepted),
              "",
              tier("ADVISORY — below the High band; triage in the Security tab"; .advisory),
              "",
              "totals: \(.total) finding(s) — \(.blocking | length) blocking, \(.accepted | length) accepted, \(.advisory | length) advisory",
              "rule metadata resolved: \(.ruleMetaCount)"
            ' "$CLASSIFIED"
            echo '```'
            # COVERAGE, not just the verdict: "No findings." alone cannot be
            # told apart from "analyzed nothing", which is the exact
            # green-but-vacuous outcome this workflow exists to rule out.
            # The source archive is the file set the database was built from.
            # RUNNER_TEMP (the env var), not ${{ runner.temp }}: interpolating a
            # GitHub expression straight into a run: block is the shape
            # semgrep's gha-curl-pipe-shell / curl-eval rules flag, and it also
            # breaks their bash sub-parser — which silently costs coverage on
            # this very file. The env var is equivalent and parses.
            src="$RUNNER_TEMP/codeql_databases/$CODEQL_DB/src.zip"
            if [ -f "$src" ]; then
              echo "files in the $LANGUAGE database: $(unzip -Z1 "$src" 2>/dev/null | grep -vc '/$' || echo '?')"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Fail on findings
        # THIS is what makes CodeQL a gate rather than a report. The analyze step
        # exits 0 whether it found nothing or a hundred alerts — job success only
        # means extraction and query evaluation worked. Without this step a red
        # `Analyze (…)` check can only ever mean "the scanner broke", never "the
        # code has a problem", which is precisely how the Go toolchain break sat
        # unnoticed behind a red-but-not-required check for weeks.
        #
        # THRESHOLD (see .github/codeql-gate.jq for the mechanics):
        #   - security-severity >= 7.0 blocks. That is CodeQL's own High/Critical
        #     cut and what GitHub's code-scanning merge protection bands on.
        #     `level` / @problem.severity is NOT used for a rule that publishes a
        #     security-severity: nearly every security query is `error`,
        #     go/log-injection at 6.1 included, so banding on it would block all
        #     23 log-injection findings and reproduce the deadlock this replaced.
        #   - a rule with no security-severity falls back to level error/warning.
        #   - a (rule, file) pair in .github/codeql-accepted-findings.json moves
        #     a High-band finding to ACCEPTED. The register is per-FILE, so the
        #     rule stays live everywhere else. It is the ONLY waiver route: the
        #     in-source `// codeql[rule-id]` form does not work here (see the
        #     measured note by the matrix above).
        #
        # WHY NOT "any finding" — that was tried in #1246 and it deadlocked the
        # repo. See docs/adr/0048-codeql-severity-gating.md: the zero it was armed
        # on came from a `pull_request` run, where CodeQL is DIFF-INFORMED and
        # reports only results inside the PR's diff, so it measured the diff and
        # not the tree.
        if: ${{ !cancelled() }}
        env:
          LANGUAGE: ${{ matrix.language }}
          CLASSIFIED: ${{ runner.temp }}/codeql-classified.json
        run: |
          set -uo pipefail
          count=$(jq -r '.blocking | length' "$CLASSIFIED")
          if [ -z "$count" ]; then
            echo "::error::could not read the classification for $LANGUAGE — refusing to report it clean."
            exit 1
          fi
          if [ "$count" != "0" ]; then
            echo "::error::CodeQL found ${count} blocking finding(s) for ${LANGUAGE} — see the summary above."
            jq -r '.blocking[] | "  \(.rule)  \(.file):\(.line)  (security-severity \(.sev))"' "$CLASSIFIED"
            echo ""
            echo "Fix it. If it is a false positive the honest options are a code"
            echo "change that removes the sink, or an entry in"
            echo ".github/codeql-accepted-findings.json with a written reason."
            echo "An in-source // codeql[rule-id] comment does NOT work with this"
            echo "pipeline — measured on #1249; see the note by the matrix above."
            echo "Note that dismissing the alert in the"
            echo "Security tab will NOT turn this check green: this step reads the"
            echo "run's own SARIF and never consults the code-scanning API."
            exit 1
          fi
          echo "CodeQL ($LANGUAGE): 0 blocking findings."

  codeql-gate:
    name: CodeQL gate
    # Aggregate of the matrix. In the workflow_call path the caller's
    # `needs: codeql` already rolls up every job here, so this exists for the
    # standalone schedule/dispatch runs — one legible verdict per weekly re-scan
    # instead of four boxes — and as a stable single check name.
    #
    # `needs: [analyze]` on a matrix job collapses to one aggregate result:
    # success only when every leg succeeded. With `fail-fast: false` above,
    # every language still runs and reports before this evaluates them.
    if: always()
    needs: [analyze]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fail if any CodeQL analysis did not succeed
        # RESULTS via env, not interpolated into the run: block. The values are
        # drawn from {success, failure, cancelled, skipped} so nothing
        # attacker-controlled reaches the shell — but this is the exact shape the
        # two sites fixed in #1246 were fixed away FROM, and it breaks semgrep's
        # bash sub-parser, which silently costs coverage on this very file.
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          # RESULTS is supplied by the `env:` block above; shellcheck cannot see
          # that and reads the all-caps name as a typo for the local `results`.
          # shellcheck disable=SC2153
          results="$RESULTS"
          echo "job results: $results"
          # A real failure always wins.
          for r in $results; do
            if [ "$r" = "failure" ]; then
              echo "::error::a CodeQL analysis failed"
              exit 1
            fi
          done
          # Cancelled-but-nothing-failed means the run was superseded (the
          # caller's concurrency group cancelled it for a newer tip); this job
          # still runs because of `if: always()`. Conclude neutral instead of
          # painting a meaningless red X on the stale commit — the superseding
          # run carries the real verdict (#1302).
          for r in $results; do
            if [ "$r" = "cancelled" ]; then
              echo "::notice::run superseded: analyses were cancelled and none failed; CodeQL gate concludes neutral (#1302)"
              exit 0
            fi
          done
          for r in $results; do
            [ "$r" = "success" ] || { echo "a CodeQL analysis did not succeed"; exit 1; }
          done
