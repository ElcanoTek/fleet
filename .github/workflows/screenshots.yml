# Regenerate the docs screenshots on every push to main (#487).
#
# GUI: drives the SAME deterministic mocked Next app the `Web e2e (Playwright,
# mocked)` CI lane uses — no backend, no LLM, no Podman — captures a full-page
# PNG of the chat and Operations Center views via the dedicated `screenshots`
# Playwright project, into docs/screenshots/web/.
#
# TUI: renders a representative `fleet chat` TUI frame DETERMINISTICALLY from
# in-memory model state (no server, no real conversation data) and freezes the
# ANSI to a PNG via charmbracelet/freeze, into docs/screenshots/tui/.
#
# Both refreshed images are committed back in a single push.
#
# Loop-safe: `paths-ignore` keeps a screenshots-only commit from re-triggering
# this workflow, and the commit carries `[skip ci]`. The push is best-effort — if
# main is protected against direct pushes, the step warns instead of failing the
# run, and the baseline PNGs committed in the repo still serve.
name: Screenshots

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/screenshots/**'

# Only the newest push to main needs fresh screenshots; cancel superseded runs.
concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

# Read-only, deliberately. This workflow has ONE job, and that job npm-installs
# and runs Playwright — thousands of third-party packages — so `contents: write`
# here was a repo-writable token handed to third-party code on every run.
#
# It bought nothing: the push it existed for cannot succeed. The `main` ruleset
# carries a pull_request rule with current_user_can_bypass: never and no bypass
# actors, so a direct push to main is refused regardless of token scope. The push
# step is already written to warn rather than fail, so dropping the scope changes
# the warning's wording and nothing else.
#
# If refreshing screenshots from CI is ever wanted for real, the shape is a
# second job that needs: [screenshots], holds `contents: write` alone, runs no
# third-party code, and opens a PR — not a direct push.
permissions:
  contents: read

jobs:
  screenshots:
    name: Generate GUI screenshots
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # Same throwaway build-time secrets as the mocked e2e lane: the mocked app
      # route-intercepts every backend, so nothing real is reached. At runtime
      # playwright.config.ts regenerates a fresh Ed25519 keypair per run.
      CHAT_MOCK_MODE: '1'
      APP_SESSION_SECRET: e2e-session-secret-0123456789abcdef
      AUTH_SIGNING_PUBKEY: P8Lyn/xy8bS2SWcnPkg2kKiGBctyJZdEMMzNEixh0As=
      CHAT_SERVER_URL: http://127.0.0.1:18080
      CHAT_SERVER_TOKEN: e2e-shared-secret
      ORCHESTRATOR_SERVER_URL: http://127.0.0.1:18000
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Read from web/.nvmrc so the deployed node major is declared once.
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Capture GUI screenshots
        # Non-gating: a capture hiccup should not turn main red, and simply leaves
        # the previous committed screenshots in place.
        run: npm run test:e2e:screenshots || echo "::warning::GUI screenshot capture failed; keeping the existing images"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Read from go.mod so the toolchain is declared once.
          go-version-file: go.mod
          check-latest: true

      - name: Capture TUI screenshot
        # Renders the chat TUI frame + freezes it to a PNG. Non-gating, same as GUI.
        working-directory: ${{ github.workspace }}
        run: scripts/generate-tui-screenshot.sh || echo "::warning::TUI screenshot capture failed; keeping the existing image"

      - name: Commit refreshed screenshots
        working-directory: ${{ github.workspace }}
        run: |
          if git diff --quiet -- docs/screenshots; then
            echo "No screenshot changes — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "docs(screenshots): refresh GUI + TUI screenshots [skip ci]"
          # The `main` ruleset carries a pull_request rule with
          # current_user_can_bypass: never and no bypass actors, so a direct push
          # to main CANNOT succeed — this is a permanent no-op, not an
          # occasional one, and the [skip ci] in the commit message above means
          # anything it did land would bypass CI on main. The workflow token is
          # also read-only now (see the permissions note at the top), so this
          # fails on scope first. Kept as a warning rather than an error so the
          # capture half stays useful; do not "fix" it by widening either the
          # ruleset or the token — refresh via a PR instead.
          git push origin HEAD:main \
            || echo "::warning::could not push refreshed screenshots — the main ruleset requires a pull request, so this push is expected to fail. Refresh via PR; the committed baseline still serves."
