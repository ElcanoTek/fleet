# Weekly MCP catalog smoke — NON-BLOCKING (#986, Phase 2).
#
# The built-in remote MCP directory (internal/clientconfig/builtin_remote_catalog.yaml)
# is a static snapshot of ~290 vendor endpoints and documentation links, and it
# rots: vendors move docs pages, sunset betas and rename endpoints, and the
# only way a fleet operator finds out today is a user hitting "failed to
# connect". This lane checks what CAN be checked without a human once a week:
#
#   links  — scripts/mcp-catalog-lint.sh fetches every docs_url and fails on
#            an obviously dead one (404/410/unresolvable, confirmed on a second
#            pass). Bot walls and rate limits are warnings, not failures.
#   smoke  — internal/remotemcp's live catalog tests run fleet's own add-time
#            handshake (initialize + tools/list over the SSRF-safe client)
#            against every `open` entry, and against a handful of `api_key`
#            entries when their keys are present as repository secrets
#            (FLEET_CATALOG_KEY_<ENTRY>, or FLEET_CATALOG_KEY_<ENTRY>_<ID> for
#            one of an entry's url_variants; a missing secret skips that
#            fixture, it never fails). OAuth entries need a browser consent step and are
#            verified by hand — see docs/MCP-CATALOG-STATUS.md.
#
# It is NEVER a PR gate: it runs weekly and on manual dispatch only, and
# a red run files an issue (same alarm as the other scheduled lanes) instead of
# blocking anyone. Running weekly rather than daily matches the other upstream
# drift lanes (Grype, pins-update, Flag drift) — third-party catalog curation
# moves on weeks, not hours, and hitting ~300 external hosts every night mostly
# multiplied vendor weather (#1640, #1683, #1776, #1844).
# Design note: docs/MCP-CATALOG-SMOKE.md.
name: Weekly MCP catalog smoke

on:
  schedule:
    # 06:30 UTC Mondays — offset from the 07:00 canary, the 08:00 govulncheck
    # scan and the Monday 09:00 Grype scan so the lanes don't contend.
    - cron: '30 6 * * 1'
  workflow_dispatch:
    inputs:
      fields:
        description: 'Catalog link fields to check (comma-separated)'
        required: false
        default: 'docs_url'
      strict_links:
        description: 'Fail the links job on warnings (bot walls, 5xx) too'
        required: false
        type: boolean
        default: false
      strict_smoke:
        description: 'Fail the smoke job on a vendor outage (5xx but 501, 408/429, timeout/drop) or a refused fixture key too'
        required: false
        type: boolean
        default: false

# No `issues: write`: these jobs talk to ~300 third-party hosts. A failed
# scheduled run is filed as an issue by scan-cron-alarm.yml, which watches this
# workflow by its `name:`.
permissions:
  contents: read

# One sweep at a time: a dispatch overlapping the schedule would hit every
# vendor host twice at once, which is exactly the rate the script's per-host
# delay exists to avoid. Queue rather than cancel — both runs are wanted.
concurrency:
  group: mcp-catalog-smoke
  cancel-in-progress: false

jobs:
  links:
    name: Documentation links (docs_url)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check every catalog link
        env:
          FIELDS: ${{ inputs.fields || 'docs_url' }}
          STRICT: ${{ inputs.strict_links == true && '--strict' || '' }}
        # The script's own concurrency/delay defaults are the politeness
        # policy; this lane does not override them. STRICT is empty or one flag.
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          scripts/mcp-catalog-lint.sh --fields "$FIELDS" --report mcp-catalog-links.tsv $STRICT

      - name: Upload the link report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-catalog-links
          path: mcp-catalog-links.tsv
          if-no-files-found: ignore
          retention-days: 30

  smoke:
    name: Live handshake (open entries + api_key fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run the live catalog tests
        # Same build tag as scripts/go-test.sh so the test tree matches CI's.
        # The key variables are empty when the secret is not configured, and
        # the fixture then skips itself — configure a secret to arm it.
        # A probe that fails is probed once more two minutes later and only
        # the second result counts, so a blip that clears by then never
        # reaches the alarm (#1844). A vendor outage that outlasts both (5xx,
        # 429 or a JSON-RPC rate-limit message, timeout, refused connection)
        # skips its entry with a VENDOR OUTAGE warning
        # instead of failing the job — one third-party service having a bad
        # night is not catalog rot, and an alarm that cries wolf gets ignored
        # (#1683). An api_key fixture whose own key the vendor refuses (401/403)
        # skips with a FIXTURE KEY REFUSED warning the same way: the secret
        # lives in a third-party account that can lapse, which is not catalog
        # rot either (#1776). strict_smoke turns both kinds into failures.
        env:
          FLEET_CATALOG_LIVE: '1'
          FLEET_CATALOG_STRICT: ${{ inputs.strict_smoke == true && '1' || '' }}
          FLEET_CATALOG_KEY_TAVILY: ${{ secrets.FLEET_CATALOG_KEY_TAVILY }}
          FLEET_CATALOG_KEY_PAGERDUTY: ${{ secrets.FLEET_CATALOG_KEY_PAGERDUTY }}
          FLEET_CATALOG_KEY_EXA: ${{ secrets.FLEET_CATALOG_KEY_EXA }}
          FLEET_CATALOG_KEY_BROWSERBASE: ${{ secrets.FLEET_CATALOG_KEY_BROWSERBASE }}
          FLEET_CATALOG_KEY_FIRECRAWL: ${{ secrets.FLEET_CATALOG_KEY_FIRECRAWL }}
        # The summary is written on a FAILED run too — that is the run whose
        # alarm issue someone will open — so the exit status is captured, not
        # allowed to abort the step before the summary.
        run: |
          set -uo pipefail
          rc=0
          # -parallel: the subtests are network-bound and a failing one sleeps
          # two minutes before its confirmation probe, so every wait must
          # overlap rather than queue behind GOMAXPROCS. -timeout: above the
          # waits plus the retry budgets, below the job's 30-minute cap, so a
          # bad night ends in test output and not a killed job.
          go test -tags fleet_host_executor -count=1 -v -parallel 32 -timeout 25m -run 'TestCatalogLive' ./internal/remotemcp/ 2>&1 | tee catalog-smoke.log || rc=$?
          # Each outage warning becomes a run annotation, so it is visible on
          # the run page without opening the log. The marker is
          # vendorOutageMarker in catalog_live_test.go.
          outages="$(grep -E 'VENDOR OUTAGE' catalog-smoke.log | sed -E 's/^[[:space:]]*catalog_live_test\.go:[0-9]+: //' || true)"
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::warning title=MCP catalog vendor outage::$line"
          done <<< "$outages"
          # Likewise a refused fixture key (fixtureKeyRefusedMarker): the fix
          # is rotating that repository secret, not a code change.
          refused="$(grep -E 'FIXTURE KEY REFUSED' catalog-smoke.log | sed -E 's/^[[:space:]]*catalog_live_test\.go:[0-9]+: //' || true)"
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::warning title=MCP catalog fixture key refused::$line"
          done <<< "$refused"
          {
            echo "### Live catalog handshake (go test exit $rc)"
            echo '```'
            grep -E '^\s*--- (PASS|FAIL|SKIP)' catalog-smoke.log || true
            echo '```'
            if [ -n "$outages" ]; then
              echo "#### Vendor outages (warnings, not failures)"
              echo '```'
              echo "$outages"
              echo '```'
            fi
            if [ -n "$refused" ]; then
              echo "#### Fixture keys refused (rotate the secret; warnings, not failures)"
              echo '```'
              echo "$refused"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
