name: Build sandbox image (reusable, no push)

# Sandbox build CANARY (reusable). A client config repo calls this to prove its
# bundle's sandbox/Containerfile still builds — nothing is pushed anywhere, and
# no registry is involved. For publishing, see publish-sandbox-image.yml; this
# file exists precisely because the useful part of a periodic sandbox build is
# the BUILD, not the push.
#
# WHY A PERIODIC BUILD IS WORTH A WORKFLOW AT ALL
#
# Every bundle's sandbox image derives from exactly two inputs: the `FROM` base
# and the Containerfile's own RUN lines. build-sandbox-image.sh sets the build
# context to the Containerfile's own directory, and no shipped Containerfile has
# a single COPY or ADD — so nothing outside <bundle>/sandbox/** can change the
# image. That is why the publisher's trigger is `paths: ["sandbox/**"]` and not
# every push: a commit elsewhere cannot alter the image.
#
# But every shipped Containerfile tracks `fedora-minimal:latest` unpinned, so the
# image content drifts with TIME rather than with commits. Rebuild the same
# Containerfile a month later and the RPMs differ. If Fedora renames or drops a
# package one of those RUN lines installs, the build breaks — and the build is
# not some optional path: `fleet bootstrap` / `fleet update` builds on the box,
# which is what every deployment does by default (every bundle ships
# `image: "${FLEET_SANDBOX_IMAGE:-}"`, i.e. unpinned). Without this workflow the
# breakage surfaces on a customer's box at deploy time.
#
# fleet's own config/default does NOT need to call this: the CI gate builds that
# sandbox on every PR (the live Playwright job), and grype-scheduled.yml rebuilds
# and scans it every Monday. The five client bundles had no such coverage — none
# of their CI ever built a Containerfile — which is the gap this closes.
#
# Deliberately NOT a publish. A weekly push of ~1.3 GB per bundle to GHCR would
# have no consumer today: nothing pins sandbox.image, so nothing pulls. Scheduled
# PUBLISHING is worth adding to a bundle at the point it gains a real puller (a
# Kubernetes deployment, or a box setting FLEET_SANDBOX_IMAGE) — then a stale
# digest is a live exposure. Until then this stays build-only, and needs no
# packages: write and no GHCR login.
#
# Caller contract (in a client config repo):
#
#   name: Sandbox build canary
#   on:
#     schedule:
#       - cron: "0 10 * * 1"     # after fleet's Monday 09:00 Grype scan
#     pull_request:
#       paths: ["sandbox/**"]
#     workflow_dispatch:
#   permissions:
#     contents: read             # checkout only — nothing is pushed
#   jobs:
#     build:
#       uses: ElcanoTek/fleet/.github/workflows/build-sandbox-image.yml@main
#
# The pull_request trigger matters as much as the schedule: the publisher fires
# only on push to main, so before this a Containerfile edit was never built
# until after it merged.

on:
  workflow_call:
    inputs:
      bundle_dir:
        description: >-
          Client bundle directory relative to the caller repo root (the dir
          holding manifest.yaml). Client config repos are the bundle, so the
          default is the repo root.
        type: string
        required: false
        default: "."
      fleet_ref:
        description: "fleet ref to take scripts/build-sandbox-image.sh from"
        type: string
        required: false
        default: "main"
  workflow_dispatch:
    inputs:
      bundle_dir:
        description: "Bundle dir relative to repo root"
        type: string
        required: false
        default: "config/default"

# Checkout only. This workflow builds and throws the image away: no registry
# login, no push, no repo writes. Keep it that way — the moment it needs
# packages: write it has become the publisher, which already exists.
permissions:
  contents: read

# One build per bundle at a time; a queued duplicate teaches nothing.
concurrency:
  group: build-sandbox-image-${{ github.repository }}-${{ inputs.bundle_dir }}
  cancel-in-progress: true

jobs:
  build:
    name: Build sandbox (no push)
    runs-on: ubuntu-latest
    env:
      BUNDLE_DIR: ${{ inputs.bundle_dir }}
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The build script lives in fleet core; a client-config caller doesn't
      # have it. Checking it out into a subdir keeps ONE canonical builder
      # (same manifest parsing, same flags) instead of a drifting copy per repo.
      # fleet_ref chooses which ref of ElcanoTek/fleet the BUILD SCRIPT below is
      # taken from — and that script is then EXECUTED. Every ref in this repo is
      # collaborator-written except refs/pull/* (fork PRs), so those are exactly
      # the refs that would let non-collaborator code run here; refuse them
      # before the checkout. The checkout then consumes this step's validated
      # output rather than the raw input. (Found via CodeQL
      # actions/untrusted-checkout under security-extended; the same pattern in
      # publish-sandbox-image.yml was hardened symmetrically even though the
      # query's privileged/taint split happened to flag neither variant there.)
      - name: Pin fleet_ref to collaborator-controlled refs
        id: pin
        env:
          REQUESTED: ${{ inputs.fleet_ref || 'main' }}
        run: |
          set -euo pipefail
          # ALLOW-LIST, not a deny-list. The previous deny-list (`refs/pull/*|pull/*|-*`)
          # had two holes, both of which this closes by construction:
          #
          #  1. GITHUB_OUTPUT newline injection. A workflow_call string input may contain
          #     newlines, and `printf 'resolved=%s\n'` wrote it unsanitized, so
          #     `fleet_ref: "main\nresolved=refs/pull/1/head"` matched no deny pattern
          #     (the string starts "main"), exited 0, and emitted TWO `resolved=` lines —
          #     last-wins gave the attacker the ref. The same primitive could forge any
          #     step output. The character class below admits no newline, so the value
          #     cannot carry a second assignment.
          #  2. A raw commit SHA. "Every ref in this repo is collaborator-written except
          #     refs/pull/*" is true of NAMED REFS and false of reachable COMMITS: GitHub
          #     keeps fork-PR commits in the base repo's object store and
          #     actions/checkout will happily fetch a bare SHA. So a bare hex SHA is
          #     refused too — pass a branch or tag name, which only a collaborator can
          #     create.
          case "$REQUESTED" in
            "")
              echo "::error::fleet_ref is empty"; exit 1 ;;
            *[!a-zA-Z0-9._/-]*)
              echo "::error::fleet_ref contains a character outside [A-Za-z0-9._/-] (newline, space or shell metacharacter). Refused before checkout."; exit 1 ;;
            -*|*..*|*//*)
              echo "::error::fleet_ref '$REQUESTED' is not a plausible ref name"; exit 1 ;;
            refs/pull/*|pull/*)
              echo "::error::fleet_ref '$REQUESTED' is refused: pull-request refs carry fork-controlled code, and this workflow executes the checked-out build script."; exit 1 ;;
          esac
          # Refuse a bare commit SHA (see 2 above). A ref name that happens to be all-hex
          # and >=7 chars must be given in its refs/heads/ or refs/tags/ form.
          if [ -z "$(printf '%s' "$REQUESTED" | tr -d '0-9a-fA-F')" ] && [ "${#REQUESTED}" -ge 7 ]; then
            echo "::error::fleet_ref '$REQUESTED' looks like a raw commit SHA. Fork pull-request commits are reachable by SHA from this repository, so only named refs are accepted (e.g. main, refs/heads/x, v1.2.3)."
            exit 1
          fi
          printf 'resolved=%s\n' "$REQUESTED" >> "$GITHUB_OUTPUT"

      - name: Checkout fleet (build script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ElcanoTek/fleet
          ref: ${{ steps.pin.outputs.resolved }}
          path: .fleet-core
          sparse-checkout: |
            scripts/build-sandbox-image.sh
          sparse-checkout-cone-mode: false

      - name: Ensure podman
        run: |
          command -v podman >/dev/null 2>&1 \
            || (sudo apt-get update -qq && sudo apt-get install -y -qq podman)
          podman --version

      # No IMAGE_NAME override: the script derives the tag from the bundle
      # manifest's sandbox.tag, so this also proves the manifest's sandbox block
      # still parses — the same path `fleet bootstrap` takes on a box.
      - name: Build the bundle's sandbox image
        id: build
        run: |
          FLEET_CLIENT_CONFIG_DIR="$GITHUB_WORKSPACE/$BUNDLE_DIR" \
            bash .fleet-core/scripts/build-sandbox-image.sh

      - name: Report what was built
        if: ${{ always() && steps.build.outcome != 'skipped' }}
        env:
          # The step outcome comes in through env, not interpolated into the
          # script: a ${{ }} expression expanded inside a run: block is the
          # script-injection shape semgrep's github-actions rules flag, and the
          # inline form also broke their bash sub-parser, silently costing this
          # file rule coverage (same fix as codeql.yml's $RUNNER_TEMP).
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          tag="$(FLEET_CLIENT_CONFIG_DIR="$GITHUB_WORKSPACE/$BUNDLE_DIR" \
            bash .fleet-core/scripts/build-sandbox-image.sh --print-tag 2>/dev/null || true)"
          # Plain assignment instead of a ${tag:-(…)} expansion default: the
          # parenthesis inside the default value is valid bash but chokes
          # semgrep's bash sub-parser, which partial-parsed this file and
          # silently dropped two rules' coverage of it.
          if [ -z "$tag" ]; then tag="(tag unavailable)"; fi
          if [ "$BUILD_OUTCOME" = "success" ]; then
            {
              echo "### Sandbox builds clean"
              echo
              echo "\`$tag\` built from \`$BUNDLE_DIR/sandbox/Containerfile\`."
              echo
              echo "Nothing was pushed — this is a build canary. The base tracks"
              echo "\`fedora-minimal:latest\`, so this is the check that a Fedora"
              echo "package change has not broken the on-box build path."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Sandbox build FAILED"
              echo
              echo "\`$BUNDLE_DIR/sandbox/Containerfile\` no longer builds."
              echo
              echo "On-box deploys (\`fleet bootstrap\` / \`fleet update\`) run this"
              echo "same script, so this breaks real deployments — it is not just a"
              echo "CI problem. The usual cause is a package renamed or dropped in"
              echo "\`fedora-minimal:latest\`; check the RUN lines against current Fedora."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
