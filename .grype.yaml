# .grype.yaml — Grype configuration + CVE suppression list for fleet.
#
# Grype scans the sandbox container image (built from
# config/default/sandbox/Containerfile) for known CVEs in its RPM and Python
# packages. Both scans publish every non-suppressed finding. The per-PR job's
# explicit policy (`scripts/check-grype-policy.sh`) blocks only a fixable
# CRITICAL in a Fedora RPM; the weekly scan is report-only. Grype auto-reads
# this file from the repo root, so both scans honour the same suppressions.
#
# Why Grype and not Trivy: the sandbox base is registry.fedoraproject.org/
# fedora-minimal, and Trivy has no Fedora advisory feed — it scans 0 of the
# image's ~400 RPMs (a false-green gate). Grype matches RPM + Python packages
# against NVD/GHSA, so it actually covers this image. Python dist-info owned by
# an RPM is still reported, but is not a merge blocker based solely on an
# upstream PyPI fix that Fedora cannot apply.
#
# To accept/suppress a specific CVE, add an `ignore:` entry with a rationale
# comment. Keep this list MINIMAL — prefer rebuilding the image (the unpinned
# fedora-minimal base + its packages pick up upstream fixes on every rebuild)
# over suppressing a CVE here. A suppressed CVE is dropped from BOTH the blocking
# gate and the SARIF upload, so only suppress one you have consciously accepted.
# Review this list quarterly, or whenever the affected package is upgraded.

ignore:
  # Accepted: Fedora 44 ships python3-pillow-12.3.0 as a distro RPM. Grype
  # additionally catalogs its /usr/lib64/python3.14/site-packages/pillow-12.3.0.dist-info/METADATA
  # file as an independent PyPI (type: python) package and matches these 41
  # upstream Pillow < 13.0.0 GHSA advisories (including wheel-bundled libopenjp2
  # and Windows-only WMF/EMF advisories that do not apply to the Fedora Linux
  # RPM build). Per commit 9a25a706 and scripts/check-grype-policy.sh, Fleet
  # does not shadow distro-owned RPMs with pip wheels. Each entry is scoped to
  # package { name: pillow, version: 12.3.0, type: python } so RPM-level
  # python3-pillow advisories (type: rpm) still report and gate, and the rules
  # automatically become inert once Fedora updates python3-pillow past 12.3.0.
  # Review by 2027-02-01 (or when Fedora ships python3-pillow >= 13.0.0).
