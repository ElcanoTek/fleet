# golangci-lint v2 configuration
# https://golangci-lint.run/docs/configuration/
#
# CI pins the golangci-lint binary as GOLANGCI_LINT_VERSION in
# .github/workflows/ci.yml (the go job's env; scripts/update-pins.sh moves it
# and the docs that restate it, listed in scripts/lib/pin-docs.tsv). Run that
# version locally so `golangci-lint run` matches CI exactly — drifting the
# binary version can surface or hide findings and make the full-gate flap.
#
# That pin is coupled to go.mod's Go version and cannot lag it: golangci-lint
# refuses to run when the Go release it was BUILT with is older than the
# version go.mod targets ("the Go language version (go1.26) used to build
# golangci-lint is lower than the targeted Go version (1.27.0)"). Upstream
# keeps its own module minimum at latest-1 and ships the release that supports
# a new Go days after that Go lands, so bumping go.mod means bumping this too.
# Even a patch release can need it: go1.27.2 raised the compiler's export
# data version, which v2.13.x cannot read ("export data version 5 is greater
# than maximum supported version 4"); v2.14.0 can.
version: "2"

linters:
  # Use standard as the base set of linters
  default: standard
  enable:
    # Additional linters beyond standard
    - bodyclose
    - errname
    - errorlint
    # forbidigo: one way to read the environment (#2053, docs/CONFIG-REGISTRY.md).
    - forbidigo
    - exhaustive
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - misspell
    - nakedret
    - nilerr
    - noctx
    - nolintlint
    - prealloc
    - predeclared
    - revive
    - unconvert
    - unparam
    - whitespace
  disable:
    # Disabled linters (too strict or not needed)
    - depguard
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - lll
    - wsl
    # dupl: large parts of this monorepo are deliberate, verbatim ports of the
    # same logic across the chat / sched / cutlass surfaces (and from sibling
    # repos). Those duplicates are intentional and reviewed; dupl only produces
    # noise here, so it is disabled rather than blanket-suppressed.
    - dupl
    # goconst: produced 100+ findings, the vast majority of which are short,
    # locally-meaningful literals (HTTP verbs, "text"/"success" tags, MIME
    # types, single-word case labels) where a package-level constant would hurt
    # readability more than the repetition does. The handful that are genuinely
    # worth hoisting already have named constants nearby; chasing the rest to
    # zero is churn, so goconst is disabled for the full-clean gate.
    - goconst
  settings:
    forbidigo:
      # Every environment read goes through the configuration registry
      # (internal/config/envreg): envreg.Get / envreg.Lookup for a declared
      # setting, envreg.Unregistered for a name that comes from data (the
      # client bundle's manifest, an account suffix, a flag). The os accessors
      # are banned everywhere else; the exceptions are listed under
      # exclusions.rules below.
      analyze-types: true
      forbid:
        - pattern: ^os\.(Getenv|LookupEnv|Environ)$
          msg: read the environment through internal/config/envreg (Get/Lookup for a registered setting, Unregistered for a data-named variable) — docs/CONFIG-REGISTRY.md
        # One way to log (#2052, docs/TELEMETRY.md): structured log/slog
        # records through logging.From(ctx) (or slog.* where no context
        # exists), so every line carries its correlation ids and goes through
        # the redactor. The stdlib log package's print/fatal/panic helpers
        # produce an unstructured line with neither.
        - pattern: ^log\.(Print|Printf|Println|Fatal|Fatalf|Fatalln|Panic|Panicf|Panicln)$
          msg: log through logging.From(ctx).Info/Warn/Error (or slog.* with no context) with key/value attributes; use logging.Fatal to exit — docs/TELEMETRY.md
    exhaustive:
      # Treat a switch with a default case as exhaustive. Every enum switch in
      # this tree that exhaustive flagged already routes the remaining values
      # through a deliberate default (e.g. TaskStatus.IsValidReportedStatus,
      # the stream-error classifiers), so a default IS the exhaustive handling.
      default-signifies-exhaustive: true
    gocyclo:
      # A few functions are legitimately branchy state machines (the agent
      # turn-loop, task validation, atomic status updates). Keep gocyclo ON but
      # set the cap just above them so it flags genuinely new complexity, not
      # these.
      min-complexity: 35
    nolintlint:
      # Every //nolint must carry an explanation and name the specific
      # linter(s) it suppresses, and unused suppressions are flagged so they
      # don't rot. This keeps the suppressions added during this cleanup honest.
      require-explanation: true
      require-specific: true
      allow-unused: false
  exclusions:
    # Use lax mode for generated files (ignores files with code generation comments)
    generated: lax
    warn-unused: true
    # Use preset exclusions for common patterns
    presets:
      - comments
      - std-error-handling
    # Custom exclusion rules
    rules:
      # web/node_modules vendors third-party Go (e.g. flatted's Go port) that we
      # neither own nor ship from the Go build; it only exists locally after an
      # `npm ci`. Never lint it. (CI's lint job doesn't run npm, so it's absent
      # there, but excluding it keeps local `golangci-lint run` matching CI.)
      - path: web/node_modules/
        linters:
          - exhaustive
          - gocyclo
          - govet
          - gosec
          - staticcheck
          - revive
          - errcheck
      # Exclude some linters from running on tests files
      - path: _test\.go
        linters:
          - dupl
          - gosec
          - goconst
          - errcheck
          # noctx: httptest.NewRequest (vs NewRequestWithContext) is idiomatic
          # in tests — these are synthetic requests with no cancellation
          # semantics, so threading a context through every one is pure churn.
          # Production call sites use exec.CommandContext rather than
          # exec.Command — cmd/fleet/{mcp_broker_runtime,health,validate_config}.go
          # and internal/admincli/backup.go. (This note used to name
          # cmd/fleet-admin, which held no exec call after the CLI was unified
          # in #461 and was removed outright in ADR-0060.)
          - noctx
      # Exclude shadow checking for err variables (common pattern)
      - text: 'shadow: declaration of "err"'
        linters:
          - govet
      # ── forbidigo exceptions: the env-read ban (#2053) ──
      # internal/config owns the environment: the registry accessor itself
      # (envreg), the env-file loader that snapshots and restores the process
      # env, and the DSN resolver.
      - path: ^internal/config/
        linters:
          - forbidigo
      # Tests set and read the environment directly to stage scenarios. (Only
      # the env-read ban: the log-print ban below applies to tests too.)
      - path: _test\.go
        text: os\.(Getenv|LookupEnv|Environ)
        linters:
          - forbidigo
      # Wholesale copies of the environment, never a read of one setting:
      #   - subprocess env plumbing: `fleet backup` (pg_dump) and `fleet
      #     update` (update.sh) hand their whole environment to the child;
      #   - secret redactors snapshot every VALUE as a literal to scrub
      #     (agentcore, mcpbroker, the process log, the Browserbase live-view guard, `fleet
      #     diagnose`), and diagnose lists the set NAMES (never values);
      #   - the broker divests the connector env by scanning it, and creds
      #     discovers per-account suffix variants by scanning it.
      - path: ^(internal/admincli/(backup|update|diagnose)|internal/agentcore/redact|internal/logging/redact|internal/mcpbroker/redact|internal/tools/browserbase_live_view|cmd/fleet/mcp_broker_runtime|internal/creds/creds)\.go$
        text: os\.Environ
        linters:
          - forbidigo
      # ── forbidigo exception: the log-print ban (#2052) ──
      # The ONE allowlisted file: logging's own test drives the stdlib log
      # package on purpose, to prove a third-party library's log.Printf is
      # bridged into the structured stream. Nothing else may call it.
      - path: ^internal/logging/logging_test\.go$
        text: log\.Printf
        linters:
          - forbidigo

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: strict

issues:
  # 0 = no cap. The CI lint job is a FULL gate (fails on ANY finding), so it
  # must surface every issue rather than truncating at 50/3 — a hidden finding
  # would still fail the build but be invisible in the log.
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: true

output:
  sort-order:
    - linter
    - file
  show-stats: true

run:
  timeout: 5m
  tests: true
  # Lint the host-executor-enabled build so host.go (gated behind this tag, #159)
  # is covered. The release build excludes it; `go build ./...` in CI compile-checks
  # that untagged path. CI and local `golangci-lint run` agree because both read this.
  build-tags:
    - fleet_host_executor

severity:
  default: error
